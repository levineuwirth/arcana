<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcana — My Decks</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("arcana.theme")||"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/assets/mana.css" />
<style>
  /* My Decks is a working page (D15): the cockpit's register on a flat page.
     The top bar, buttons, badges, modal, identity dots and empty state are
     shared (theme.css); this keeps the page's layout and its own variants. */
  html, body { height: 100%; }
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  .hall { flex: 1; width: min(1180px, 94vw); margin: 0 auto; padding: 22px 0 48px; }
  .hall-title { margin: 4px 0 16px; }
  .hall-title h1 { font-size: 24px; margin: 0; }
  .hall-title p { color: var(--text-muted); margin: 4px 0 0; font-size: 13px; }

  .toolbar { display: flex; gap: 12px; margin-bottom: 22px; }

  /* a family: a root deck + its forks/variations */
  .family { margin: 0 0 26px; }
  .family-line { display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start; }
  .children { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .children:empty::before { content: "No forks or variations yet."; color: var(--text-faint); font-size: 12px; font-style: italic; }

  .deck.panel { overflow: hidden; display: flex; flex-direction: column; --faction: var(--link); }
  .deck .banner { height: 4px; background: var(--faction); }
  .deck .art { aspect-ratio: 1.5; background: var(--bg-nav); overflow: hidden; }
  .deck .art img { width: 100%; height: 100%; object-fit: cover; }
  .deck .art.ph { display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 12px; }
  .deck .body { padding: 11px 13px 12px; display: flex; flex-direction: column; gap: 7px; }
  .deck .nm { font-family: var(--font-serif); font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .deck.child .nm { font-size: 15px; }
  .meta { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 12px; flex-wrap: wrap; }
  .ddiff { font-size: 11px; color: var(--text-faint); }
  .ddiff .add { color: var(--added); } .ddiff .rem { color: var(--removed); }

  .actions { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 2px; }
  .actions a { cursor: pointer; font-size: 12px; color: var(--text-muted); }
  .actions a:hover { color: var(--link-hover); }
  .actions a.primary { color: var(--link); font-weight: 600; }
  .actions a.danger:hover { color: var(--danger); }

  .muted { color: var(--text-muted); }

  /* ---- inspector: version history + compare ---- */
  #inspect .modal-card { width: min(960px, 96vw); }
  #inspect .modal-body { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
  @media (max-width: 740px) { #inspect .modal-body { grid-template-columns: 1fr; } }
  #inspect .meta-label { display: block; margin: 0 0 10px; }
  .cmp-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .cmp-controls select { max-width: 240px; }
  .diffblock { margin-bottom: 16px; }
  .diffgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .diffgrid { grid-template-columns: 1fr; } }
  .diffcol h4 { margin: 0 0 6px; font-size: 13px; font-variant-caps: all-small-caps; letter-spacing: .12em; color: var(--text-faint); }
  .diffcol .line { font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .diffcol.add .line { color: var(--added); } .diffcol.rem .line { color: var(--removed); } .diffcol.chg .line { color: var(--text); }
  .diffcol .none { color: var(--text-faint); font-size: 12px; font-style: italic; }
  .ver { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border-muted); flex-wrap: wrap; }
  .ver .vlabel { font-size: 13px; } .ver .spacer { flex: 1; }
</style>
</head>
<body>
  <header class="topbar" data-label="my decks">
    <span class="spacer"></span>
  </header>

  <main class="hall">
    <div class="hall-title">
      <h1>My Decks</h1>
      <p>Your collection — fork a list, spin variations, and track the lineage.</p>
    </div>
    <div class="toolbar">
      <button class="primary" id="new">+ New deck</button>
      <a class="btn" href="/deck">Open the deckbuilder</a>
    </div>
    <div id="families"></div>
  </main>

  <div class="modal" id="inspect" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <b id="ins-title">Deck</b>
        <span class="spacer"></span>
        <button class="ghost sm" id="ins-close">✕ Close</button>
      </div>
      <div class="modal-body">
        <div>
          <div class="meta-label">Compare</div>
          <div class="cmp-controls">
            <label>Base <select id="cmp-a"></select></label>
            <span class="muted">→</span>
            <label>Compare <select id="cmp-b"></select></label>
          </div>
          <div id="cmp-result"></div>
        </div>
        <div>
          <div class="meta-label">Version history</div>
          <div id="ins-versions"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
  const A = window.Arcana;

  const MANA_VAR = { W:"--mana-w", U:"--mana-u", B:"--mana-b", R:"--mana-r", G:"--mana-g", C:"--mana-c" };
  const identityCache = new Map(); // deckId -> view
  let sampleEmpty = null;

  function renderPips(letters) {
    const span = document.createElement("span"); span.className = "pips";
    for (const c of (letters && letters.length ? letters : ["C"])) {
      const d = document.createElement("span"); d.className = "pip " + c; span.appendChild(d);
    }
    return span;
  }

  async function identityFor(deck) {
    if (identityCache.has(deck.id)) return identityCache.get(deck.id);
    const ids = A.Decks.ids(deck.id).main;
    let view = { identity: { name: deck.name, archetype: "", colors: 0 }, colors: [], portrait_name: null };
    if (ids.length) {
      try { view = await A.Api.deckIdentity(ids, deck.name); } catch {}
    }
    // apply this deck's saved identity overrides
    if (deck.identity) {
      if (deck.identity.name) view.identity.name = deck.identity.name;
      if (deck.identity.archetype) view.identity.archetype = deck.identity.archetype;
      if (deck.identity.portrait != null) {
        view.identity.portrait = deck.identity.portrait;
        const c = (view.portrait_candidates || []).find((c) => c.id === deck.identity.portrait);
        if (c) view.portrait_name = c.name;
      }
    }
    identityCache.set(deck.id, view);
    return view;
  }

  function countOf(deck) { return A.Decks.ids(deck.id).main.length; }

  function deckCard(deck, isRoot) {
    const view = identityCache.get(deck.id) || { identity: { name: deck.name }, colors: [] };
    const el = document.createElement("div");
    el.className = "deck panel " + (isRoot ? "root" : "child");
    const f = (view.colors && view.colors[0]) ? "var(" + MANA_VAR[view.colors[0]] + ")" : "var(--link)";
    el.style.setProperty("--faction", f);

    const banner = document.createElement("div"); banner.className = "banner"; el.appendChild(banner);

    const art = document.createElement("div"); art.className = "art";
    if (view.portrait_name) {
      const img = document.createElement("img"); img.src = A.artCrop(view.portrait_name); img.alt = view.portrait_name;
      img.onerror = () => { img.onerror = null; img.src = A.art(view.portrait_name); };
      art.appendChild(img);
    } else { art.classList.add("ph"); art.textContent = "no cards yet"; }
    el.appendChild(art);

    const body = document.createElement("div"); body.className = "body";
    const nm = document.createElement("div"); nm.className = "nm";
    nm.appendChild(document.createTextNode(view.identity.name || deck.name));
    const badge = document.createElement("span");
    badge.className = "badge " + deck.relation + (deck.relation === "native" ? " accent" : "");
    badge.textContent = deck.relation;
    nm.appendChild(badge);
    body.appendChild(nm);

    const meta = document.createElement("div"); meta.className = "meta";
    meta.appendChild(renderPips(view.colors));
    const arch = (view.identity.archetype || "").trim();
    meta.appendChild(document.createTextNode((arch ? arch + " · " : "") + countOf(deck) + " cards"));
    body.appendChild(meta);

    // diff vs parent (forks/variations) — a teaser of the compare view
    if (deck.parent) {
      const pc = A.Decks.content(deck.parent).main, cc = A.Decks.content(deck.id).main;
      const d = A.Decks.diff(pc, cc);
      const add = d.added.reduce((n, e) => n + e.count, 0) + d.changed.reduce((n, e) => n + Math.max(0, e.to - e.from), 0);
      const rem = d.removed.reduce((n, e) => n + e.count, 0) + d.changed.reduce((n, e) => n + Math.max(0, e.from - e.to), 0);
      const dd = document.createElement("div"); dd.className = "ddiff";
      dd.innerHTML = (add || rem)
        ? 'vs parent: <span class="add">+' + add + '</span> <span class="rem">−' + rem + '</span>'
        : "identical to parent";
      body.appendChild(dd);
    }

    const actions = document.createElement("div"); actions.className = "actions";
    const link = (label, fn, cls) => { const a = document.createElement("a"); a.textContent = label; if (cls) a.className = cls; a.onclick = fn; return a; };
    actions.append(
      link("Open", () => { location.href = "/deck?deck=" + deck.id; }, "primary"),
      link("Play", () => { location.href = "/?deck=" + deck.id; }),
      link("History", () => openInspect(deck)),
      link("Fork", () => doFork(deck, "fork")),
      link("Vary", () => doFork(deck, "variation")),
      link("Rename", () => doRename(deck)),
      link("Duplicate", () => { A.Decks.duplicate(deck.id); refresh(); }),
      link("Export", () => doExport(deck)),
      link("Delete", () => doDelete(deck), "danger"),
    );
    body.appendChild(actions);
    el.appendChild(body);
    return el;
  }

  async function doFork(deck, relation) {
    const def = deck.name + (relation === "variation" ? " (variation)" : " (fork)");
    const name = await A.Dialog.prompt(relation === "variation" ? "Name this variation:" : "Name this fork:", def,
                                       { ok: relation === "variation" ? "Create variation" : "Fork" });
    if (name == null) return;
    A.Decks.fork(deck.id, name.trim() || def, relation);
    refresh();
  }
  async function doRename(deck) {
    const name = await A.Dialog.prompt("Rename deck:", deck.name, { ok: "Rename" });
    if (name == null) return;
    A.Decks.rename(deck.id, name.trim() || deck.name);
    identityCache.delete(deck.id);
    refresh();
  }
  async function doDelete(deck) {
    const kids = A.Decks.family(deck.id).length - 1;
    const msg = kids > 0
      ? "Delete \"" + deck.name + "\"? Its " + kids + " fork(s)/variation(s) will be kept and re-parented."
      : "Delete \"" + deck.name + "\"?";
    if (!(await A.Dialog.confirm(msg, { ok: "Delete", danger: true }))) return;
    A.Decks.remove(deck.id); identityCache.delete(deck.id); refresh();
  }
  function doExport(deck) {
    const c = A.Decks.content(deck.id);
    const lines = [];
    for (const e of c.main) lines.push(e.count + " " + (e.info ? e.info.name : e.id));
    if (c.side && c.side.length) { lines.push("", "Sideboard"); for (const e of c.side) lines.push(e.count + " " + (e.info ? e.info.name : e.id)); }
    const blob = new Blob([lines.join("\n") + "\n"], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = deck.name.replace(/[^\w.-]+/g, "_") + ".txt";
    a.click(); URL.revokeObjectURL(a.href);
  }
  async function doNew() {
    const name = await A.Dialog.prompt("Name your new deck:", "New deck", { ok: "Create" });
    if (name == null) return;
    const id = A.Decks.create(name.trim() || "New deck", [], []);
    location.href = "/deck?deck=" + id; // open the empty deck to build it
  }

  async function refresh() {
    const wrap = document.getElementById("families");
    const decks = A.Decks.list();
    if (!decks.length) {
      wrap.innerHTML = '<div class="empty block">No decks yet.<br>Create one, or build a list in the deckbuilder.</div>';
      return;
    }
    // Warm identities (parallel) so cards paint with colors/portrait at once.
    await Promise.all(decks.map(identityFor));
    // Roots = decks with no (live) parent; each root owns a family block.
    const byId = A.Decks.all();
    const roots = decks.filter((d) => !d.parent || !byId[d.parent]);
    wrap.innerHTML = "";
    for (const root of roots) {
      const fam = document.createElement("div"); fam.className = "family";
      const line = document.createElement("div"); line.className = "family-line";
      line.appendChild(deckCard(root, true));
      const kids = document.createElement("div"); kids.className = "children";
      for (const child of A.Decks.family(root.id).filter((d) => d.id !== root.id)) {
        kids.appendChild(deckCard(child, false));
      }
      line.appendChild(kids);
      fam.appendChild(line);
      wrap.appendChild(fam);
    }
  }

  // ---- inspector: version history + compare ----
  function rel(ts) {
    const s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  const nm = (e) => (e.info ? e.info.name : e.id);

  function contentFor(val) {
    const i = val.indexOf("|");
    const id = val.slice(0, i), vid = val.slice(i + 1);
    if (vid) { const v = A.Decks.history(id).find((x) => x.vid === vid); return v ? { main: v.main, side: v.side } : { main: [], side: [] }; }
    return A.Decks.content(id);
  }
  function compareOptions(deck) {
    const opts = [{ v: deck.id + "|", l: "This deck — current" }];
    const head = A.Decks.get(deck.id).head;
    const vs = A.Decks.history(deck.id);
    for (let i = vs.length - 1; i >= 0; i--) {
      if (vs[i].vid !== head) opts.push({ v: deck.id + "|" + vs[i].vid, l: "This deck — " + (vs[i].label || "version") + " · " + rel(vs[i].ts) });
    }
    const others = A.Decks.list().filter((d) => d.id !== deck.id);
    others.sort((a, b) => (b.id === deck.parent) - (a.id === deck.parent));
    for (const d of others) opts.push({ v: d.id + "|", l: (d.id === deck.parent ? "(parent) " : "") + d.name + " — current" });
    return opts;
  }
  function buildCompareSelectors(deck) {
    const a = document.getElementById("cmp-a"), b = document.getElementById("cmp-b");
    a.innerHTML = ""; b.innerHTML = "";
    for (const o of compareOptions(deck)) { a.add(new Option(o.l, o.v)); b.add(new Option(o.l, o.v)); }
    b.value = deck.id + "|"; // compare = this deck, current
    if (deck.parent && A.Decks.get(deck.parent)) a.value = deck.parent + "|"; // base = parent
    else { const vs = A.Decks.history(deck.id); a.value = vs.length >= 2 ? deck.id + "|" + vs[vs.length - 2].vid : deck.id + "|"; }
    a.onchange = renderCompare; b.onchange = renderCompare;
  }
  function diffCol(title, cls, lines) {
    const col = document.createElement("div"); col.className = "diffcol " + cls;
    const h = document.createElement("h4"); h.textContent = title + (lines.length ? " (" + lines.length + ")" : ""); col.appendChild(h);
    if (!lines.length) { const e = document.createElement("div"); e.className = "none"; e.textContent = "—"; col.appendChild(e); }
    for (const t of lines) { const d = document.createElement("div"); d.className = "line"; d.textContent = t; col.appendChild(d); }
    return col;
  }
  function diffBlock(label, aC, bC) {
    const d = A.Decks.diff(aC, bC); // B relative to A
    const wrap = document.createElement("div"); wrap.className = "diffblock";
    const h = document.createElement("div"); h.className = "meta-label"; h.textContent = label; wrap.appendChild(h);
    if (!d.added.length && !d.removed.length && !d.changed.length) {
      const e = document.createElement("div"); e.className = "muted"; e.textContent = "No differences."; wrap.appendChild(e); return wrap;
    }
    const grid = document.createElement("div"); grid.className = "diffgrid";
    grid.appendChild(diffCol("Added", "add", d.added.map((e) => "+" + e.count + " " + nm(e))));
    grid.appendChild(diffCol("Removed", "rem", d.removed.map((e) => "−" + e.count + " " + nm(e))));
    grid.appendChild(diffCol("Changed", "chg", d.changed.map((e) => nm(e) + ": " + e.from + " → " + e.to)));
    wrap.appendChild(grid); return wrap;
  }
  function renderCompare() {
    const A_ = contentFor(document.getElementById("cmp-a").value);
    const B_ = contentFor(document.getElementById("cmp-b").value);
    const out = document.getElementById("cmp-result"); out.innerHTML = "";
    out.appendChild(diffBlock("Maindeck", A_.main || [], B_.main || []));
    if ((A_.side && A_.side.length) || (B_.side && B_.side.length)) out.appendChild(diffBlock("Sideboard", A_.side || [], B_.side || []));
  }
  function renderVersions(deck) {
    const wrap = document.getElementById("ins-versions"); wrap.innerHTML = "";
    const vs = A.Decks.history(deck.id); const head = A.Decks.get(deck.id).head;
    for (let i = vs.length - 1; i >= 0; i--) {
      const v = vs[i]; const isHead = v.vid === head;
      let delta = "";
      if (i > 0) {
        const d = A.Decks.diff(vs[i - 1].main, v.main);
        const add = d.added.reduce((n, e) => n + e.count, 0) + d.changed.reduce((n, e) => n + Math.max(0, e.to - e.from), 0);
        const rem = d.removed.reduce((n, e) => n + e.count, 0) + d.changed.reduce((n, e) => n + Math.max(0, e.from - e.to), 0);
        delta = (add || rem) ? (" · +" + add + " −" + rem) : " · no change";
      }
      const row = document.createElement("div"); row.className = "ver";
      const lab = document.createElement("span"); lab.className = "vlabel"; lab.textContent = (isHead ? "● " : "") + (v.label || "version");
      const meta = document.createElement("span"); meta.className = "muted"; meta.textContent = rel(v.ts) + delta;
      const sp = document.createElement("span"); sp.className = "spacer";
      row.append(lab, meta, sp);
      if (!isHead) {
        const b = document.createElement("button"); b.className = "ghost sm"; b.textContent = "Restore";
        b.onclick = () => {
          A.Decks.restore(deck.id, v.vid); identityCache.delete(deck.id);
          const d2 = A.Decks.get(deck.id);
          renderVersions(d2); buildCompareSelectors(d2); renderCompare(); refresh();
        };
        row.appendChild(b);
      }
      wrap.appendChild(row);
    }
  }
  function openInspect(deck) {
    document.getElementById("ins-title").textContent =
      ((identityCache.get(deck.id) || {}).identity || {}).name || deck.name;
    buildCompareSelectors(deck);
    renderVersions(deck);
    renderCompare();
    document.getElementById("inspect").hidden = false;
  }
  function closeInspect() { document.getElementById("inspect").hidden = true; }
  document.getElementById("ins-close").onclick = closeInspect;
  document.getElementById("inspect").onclick = (e) => { if (e.target.id === "inspect") closeInspect(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeInspect(); });

  document.getElementById("new").onclick = doNew;
  // First paint waits for the server deck store to sync in (a newer copy from
  // another browser/device may replace localStorage); later adoptions re-render.
  A.Decks.ready.then(refresh);
  window.addEventListener("arcana-decks-synced", refresh);
  </script>
</body>
</html>
