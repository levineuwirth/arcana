<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcana — Deckbuilder</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("arcana.theme")||"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
<link rel="stylesheet" href="/theme.css" />
<style>
  header {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px var(--page-padding); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg-nav); z-index: 20;
  }
  header .mark { font-family: var(--font-serif); font-weight: 600; font-size: 18px; }
  header .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  header .spacer { flex: 1; }

  main { display: flex; gap: 16px; padding: 16px var(--page-padding); align-items: flex-start; }
  #browse { flex: 1; min-width: 0; }
  #preview {
    width: 264px; flex-shrink: 0; position: sticky; top: 64px;
    max-height: calc(100vh - 80px); overflow-y: auto;
    border: 1px solid var(--border); border-radius: var(--radius-panel);
    padding: 12px; background: var(--bg-offset);
  }
  #pv { display: flex; flex-direction: column; gap: 10px; }
  #deckpanel {
    width: 330px; flex-shrink: 0; border: 1px solid var(--border); border-radius: var(--radius-panel);
    padding: 12px; background: var(--bg-offset); position: sticky; top: 64px;
    max-height: calc(100vh - 80px); overflow-y: auto;
  }

  form#search { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  form#search .colors { display: inline-flex; gap: 8px; }
  form#search .colors label { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--text-muted); }
  .results-meta { color: var(--text-faint); font-size: 12px; }

  .grid { display: flex; gap: 10px; flex-wrap: wrap; --card-w: 122px; }
  #deckstats .colors .ctile { display: inline-flex; align-items: center; gap: 1px;
    font-variant-numeric: tabular-nums; }

  .muted { color: var(--text-muted); font-size: 12px; }
  .empty-note { color: var(--text-faint); font-style: italic; font-family: var(--font-serif); font-size: 13px; }

  #deckstats { font-size: 13px; margin-bottom: 10px; }
  #deckstats .summary { font-family: var(--font-serif); margin-bottom: 8px; }
  #deckstats .summary .tnum { font-weight: 600; }
  #deckstats .curve { display: flex; gap: 4px; align-items: flex-end; height: 52px; margin: 8px 0 22px; }
  #deckstats .bar { flex: 1; background: var(--text-muted); border-radius: 2px 2px 0 0; min-height: 2px; position: relative; }
  #deckstats .bar span { position: absolute; bottom: -17px; left: 0; right: 0; text-align: center;
    font-size: 9px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  #deckstats .colors { display: flex; gap: 5px; flex-wrap: wrap; }

  .sectlabel { margin: 12px 0 5px; }
  #decklist .row { display: flex; gap: 6px; align-items: center; padding: 3px 0; font-size: 13px; }
  #decklist .row .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: zoom-in; }
  #decklist .row .cnt { min-width: 16px; text-align: center; font-variant-numeric: tabular-nums; }
  #decklist .row button { padding: 1px 8px; }
  #decklist .row button.mv { padding: 1px 6px; font-size: 11px; color: var(--text-muted); }

  #legality.ok { color: var(--text); font-weight: 500; }
  #legality.bad { color: var(--text); font-weight: 500; text-decoration: underline; text-decoration-color: var(--border-muted); }

  /* import/export overlay */
  #io { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(8,7,6,.8);
    align-items: center; justify-content: center; padding: var(--page-padding); }
  #io.show { display: flex; }
  #io .iobox { width: min(560px, 92vw); background: var(--bg); border: 1px solid var(--border-muted);
    border-radius: var(--radius-panel); padding: 14px; box-shadow: var(--shadow-float); }
  #io .iohdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #io .iohdr b { font-family: var(--font-serif); font-size: 16px; }
  #io textarea { width: 100%; height: 48vh; resize: vertical; font-family: var(--font-mono); font-size: 12px; }
  #io .iobtns { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
</style>
</head>
<body>
  <header>
    <span class="mark">Arcana</span><span class="sub">deckbuilder</span>
    <a href="/">← Play</a>
    <span class="spacer"></span>
    <input id="deckname" placeholder="deck name" size="14" />
    <button id="save">Save</button>
    <select id="loadsel"><option value="">load…</option></select>
    <button id="import">Import</button>
    <button id="export">Export</button>
    <button id="clear" class="ghost">Clear</button>
    <select id="format"></select>
    <span id="legality" class="muted"></span>
    <span class="spacer"></span>
    <span id="total" class="muted"></span>
    <select id="opponent" title="opponent's deck"></select>
    <button id="play" class="primary">Play this deck</button>
    <span id="themeslot"></span>
  </header>

  <main>
    <section id="browse">
      <form id="search">
        <input id="q-name" placeholder="name contains…" size="16" />
        <span class="colors">
          <label><input type="checkbox" value="W" />W</label>
          <label><input type="checkbox" value="U" />U</label>
          <label><input type="checkbox" value="B" />B</label>
          <label><input type="checkbox" value="R" />R</label>
          <label><input type="checkbox" value="G" />G</label>
          <label><input type="checkbox" value="C" />◇</label>
        </span>
        <select id="q-type">
          <option value="">any type</option>
          <option>Creature</option><option>Instant</option><option>Sorcery</option>
          <option>Artifact</option><option>Enchantment</option><option>Land</option>
          <option>Planeswalker</option><option>Battle</option>
        </select>
        <select id="q-kw"><option value="">any keyword</option></select>
        <input id="q-cmin" type="number" min="0" placeholder="mv≥" style="width:64px" />
        <input id="q-cmax" type="number" min="0" placeholder="mv≤" style="width:64px" />
        <button type="submit">Search</button>
        <button type="button" id="cacheart" class="ghost" title="Pre-download art for the results + deck so images don't trickle in">Cache art</button>
        <button type="button" id="cacheall" class="ghost" title="Download + cache the entire catalog's art via Scryfall bulk data (~20k cards / ~2 GB, one-time; fast parallel download; persists + works offline)">Download all art</button>
        <span id="results-meta" class="results-meta"></span>
        <span id="cacheart-msg" class="muted"></span>
      </form>
      <div id="results" class="grid"><span class="empty-note">Search the catalog to add cards.</span></div>
    </section>

    <aside id="preview"><div id="pv" class="pv-empty">Hover a card to preview it.</div></aside>

    <aside id="deckpanel">
      <div id="deckstats"></div>
      <div id="decklist"></div>
    </aside>
  </main>

  <div id="io">
    <div class="iobox">
      <div class="iohdr"><b id="iotitle">Import deck</b><button id="ioclose" class="ghost">✕</button></div>
      <textarea id="iotext" spellcheck="false" placeholder="Paste an Arena/MTGO deck list…&#10;&#10;Deck&#10;4 Lightning Bolt&#10;20 Mountain"></textarea>
      <div class="iobtns"><button id="iodo" class="primary">Import</button><span id="iomsg" class="muted"></span></div>
    </div>
  </div>

<script src="/app.js"></script>
<script>
"use strict";

const main = new Map();   // cardId -> { info, count }  (maindeck)
const side = new Map();   // cardId -> { info, count }  (sideboard)
let formats = [];
let curFormat = null;
let legalityTimer = null;
let sampleDeck = [];      // the baseline opponent (card ids)

// color key -> mana-pip class (for the deck color tally)
const COLOR_PIP = { W: "w", U: "u", B: "b", R: "r", G: "g", C: "c" };

function mapTotal(m) { let t = 0; for (const e of m.values()) t += e.count; return t; }
function sortedEntries(m) {
  return [...m.values()].sort((a, b) =>
    a.info.mana_value - b.info.mana_value || a.info.name.localeCompare(b.info.name));
}

// ---- card tiles (shared component) ----
function previewCard(info) { Arcana.renderPreview(document.getElementById("pv"), info); }

function tile(info) {
  const have = main.get(info.id);
  const el = Arcana.renderCard(info, {
    count: have ? have.count : 0,
    onClick: () => addCard(main, info),
  });
  el.addEventListener("mouseenter", () => previewCard(info));
  return el;
}

// ---- deck ops (generic over a map: main or side) ----
function addCard(m, info) { const e = m.get(info.id); if (e) e.count++; else m.set(info.id, { info, count: 1 }); render(); }
function setCount(m, id, n) { const e = m.get(id); if (!e) return; e.count = n; if (e.count <= 0) m.delete(id); render(); }
function moveCard(from, to, info) { setCountSilent(from, info.id, (from.get(info.id) ? from.get(info.id).count : 0) - 1); addCardSilent(to, info); render(); }
function setCountSilent(m, id, n) { const e = m.get(id); if (!e) return; e.count = n; if (e.count <= 0) m.delete(id); }
function addCardSilent(m, info) { const e = m.get(info.id); if (e) e.count++; else m.set(info.id, { info, count: 1 }); }

function render() {
  renderDeck();
  if (window._lastResults) renderResults(window._lastResults);
  scheduleLegality();
}

function sectionRows(container, m, isSide) {
  if (!m.size) {
    const e = document.createElement("div"); e.className = "empty-note";
    e.textContent = isSide ? "(empty)" : "empty — click cards to add";
    container.appendChild(e); return;
  }
  for (const { info, count } of sortedEntries(m)) {
    const row = document.createElement("div"); row.className = "row";
    row.addEventListener("mouseenter", () => previewCard(info));
    const minus = document.createElement("button"); minus.textContent = "−"; minus.onclick = () => setCount(m, info.id, count - 1);
    const cnt = document.createElement("span"); cnt.className = "cnt"; cnt.textContent = count;
    const plus = document.createElement("button"); plus.textContent = "+"; plus.onclick = () => setCount(m, info.id, count + 1);
    const n = document.createElement("span"); n.className = "n"; n.textContent = info.name;
    n.title = info.type_line; n.oncontextmenu = (e) => { e.preventDefault(); Arcana.Zoom.show(info); };
    const cost = document.createElement("span"); cost.className = "mana-mini";
    cost.appendChild(Arcana.renderMana(info.mana_cost));
    const mv = document.createElement("button"); mv.className = "mv"; mv.textContent = isSide ? "→main" : "→SB";
    mv.title = isSide ? "move to maindeck" : "move to sideboard";
    mv.onclick = () => moveCard(isSide ? side : main, isSide ? main : side, info);
    row.append(minus, cnt, plus, n, cost, mv);
    container.appendChild(row);
  }
}

function renderDeck() {
  const total = mapTotal(main);
  document.getElementById("total").textContent = total + " main · " + mapTotal(side) + " SB";
  document.getElementById("play").disabled = total < 7;

  const stats = document.getElementById("deckstats");
  const bins = [0, 0, 0, 0, 0, 0, 0, 0];
  const colorCount = { W: 0, U: 0, B: 0, R: 0, G: 0, C: 0 };
  let lands = 0;
  for (const { info, count } of main.values()) {
    if (info.is_land) lands += count;
    else bins[Math.min(info.mana_value, 7)] += count;
    if (info.colors.length === 0) colorCount.C += count;
    else for (const c of info.colors) colorCount[c] += count;
  }
  const maxBin = Math.max(1, ...bins);
  const curve = bins.map((v, i) =>
    '<div class="bar" style="height:' + Math.round(100 * v / maxBin) + '%" title="mv ' +
    (i === 7 ? "7+" : i) + ": " + v + '"><span>' + (i === 7 ? "7+" : i) + "</span></div>").join("");
  const colors = Object.entries(colorCount).filter(([, v]) => v > 0)
    .map(([k, v]) => '<span class="ctile">' + v + Arcana.manaSymbolHtml(k) + "</span>").join("");

  stats.innerHTML =
    '<div class="summary"><span class="tnum">' + total + "</span> cards · <span class=\"tnum\">" + lands +
      '</span> lands · <span class="tnum">' + (total - lands) + "</span> spells</div>" +
    '<div class="curve">' + curve + "</div>" +
    '<div class="colors">' + (colors || '<span class="muted">—</span>') + "</div>";

  const list = document.getElementById("decklist");
  list.innerHTML = "";
  const ml = document.createElement("div"); ml.className = "sectlabel meta-label"; ml.textContent = "Maindeck"; list.appendChild(ml);
  sectionRows(list, main, false);
  const sl = document.createElement("div"); sl.className = "sectlabel meta-label"; sl.textContent = "Sideboard"; list.appendChild(sl);
  sectionRows(list, side, true);
}

// ---- legality ----
function scheduleLegality() { clearTimeout(legalityTimer); legalityTimer = setTimeout(checkLegality, 200); }
async function checkLegality() {
  const el = document.getElementById("legality");
  if (!curFormat) { el.textContent = ""; return; }
  const body = {
    main: [...main.values()].map(({ info, count }) => [info.id, count]),
    sideboard: [...side.values()].map(({ info, count }) => [info.id, count]),
    spec: curFormat,
  };
  try {
    const rep = await Arcana.Api.legality(body);
    el.className = rep.legal ? "ok" : "bad";
    el.textContent = rep.legal ? "✓ legal" : ("✗ " + rep.violations.length + " issue" + (rep.violations.length > 1 ? "s" : ""));
    el.title = rep.violations.join("\n") || "legal for " + rep.format;
  } catch (e) { el.textContent = ""; }
}

// ---- search ----
function buildQuery() {
  const q = { limit: 120 };
  const name = document.getElementById("q-name").value.trim();
  if (name) q.name = name;
  const checked = [...document.querySelectorAll("form#search .colors input:checked")].map((c) => c.value);
  if (checked.includes("C")) q.colorless = true;
  const colors = checked.filter((c) => c !== "C");
  if (colors.length) q.colors = colors;
  const type = document.getElementById("q-type").value; if (type) q.types = [type];
  const kw = document.getElementById("q-kw").value; if (kw) q.keywords = [kw];
  const cmin = document.getElementById("q-cmin").value; if (cmin !== "") q.cmc_min = +cmin;
  const cmax = document.getElementById("q-cmax").value; if (cmax !== "") q.cmc_max = +cmax;
  return q;
}
async function search() {
  try {
    const results = await Arcana.Api.search(buildQuery());
    window._lastResults = results;
    renderResults(results);
    document.getElementById("results-meta").textContent = results.length + " shown (capped)";
  } catch (e) {
    document.getElementById("results-meta").textContent = "search failed";
  }
}
function renderResults(results) {
  const box = document.getElementById("results");
  box.innerHTML = "";
  if (!results.length) { box.innerHTML = '<span class="empty-note">No matches.</span>'; return; }
  for (const info of results) box.appendChild(tile(info));
}

// ---- save / load (localStorage) ----
function savedDecks() { try { return JSON.parse(localStorage.getItem("arcana.decks") || "{}"); } catch { return {}; } }
function refreshLoadSelect() {
  const names = Object.keys(savedDecks());
  const sel = document.getElementById("loadsel");
  sel.innerHTML = '<option value="">load…</option>';
  for (const name of names) { const o = document.createElement("option"); o.value = name; o.textContent = name; sel.appendChild(o); }
  const opp = document.getElementById("opponent");
  const prev = opp.value;
  opp.innerHTML = "";
  const add = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; opp.appendChild(o); };
  add("mirror", "vs Mirror");
  add("sample", "vs Sample deck");
  for (const name of names) add("saved:" + name, "vs " + name);
  opp.value = prev || "mirror";
}
function deckIdsFromSaved(d) {
  const m = Array.isArray(d) ? d : (d.main || []);
  const ids = [];
  for (const { info, count } of m) for (let i = 0; i < count; i++) ids.push(info.id);
  return ids;
}
function loadEntries(m, arr) { m.clear(); for (const { info, count } of (arr || [])) m.set(info.id, { info, count }); }
function saveDeck() {
  const name = document.getElementById("deckname").value.trim();
  if (!name) { alert("Name the deck first."); return; }
  const decks = savedDecks();
  decks[name] = {
    main: [...main.values()].map(({ info, count }) => ({ info, count })),
    side: [...side.values()].map(({ info, count }) => ({ info, count })),
  };
  localStorage.setItem("arcana.decks", JSON.stringify(decks));
  refreshLoadSelect();
}
function loadDeck(name) {
  const d = savedDecks()[name]; if (!d) return;
  loadEntries(main, Array.isArray(d) ? d : d.main);
  loadEntries(side, Array.isArray(d) ? [] : d.side);
  document.getElementById("deckname").value = name;
  render();
}
function clearDeck() { main.clear(); side.clear(); render(); }

// ---- import / export ----
function openIo(mode) {
  const io = document.getElementById("io");
  document.getElementById("iotitle").textContent = mode === "export" ? "Export deck" : "Import deck";
  document.getElementById("iodo").textContent = mode === "export" ? "Copy" : "Import";
  document.getElementById("iomsg").textContent = "";
  const ta = document.getElementById("iotext");
  ta.value = mode === "export" ? exportText() : "";
  ta.readOnly = false;
  io.dataset.mode = mode;
  io.classList.add("show");
  ta.focus();
}
function closeIo() { document.getElementById("io").classList.remove("show"); }
function exportText() {
  const name = document.getElementById("deckname").value.trim() || "Untitled";
  let s = "About\nName " + name + "\n\nDeck\n";
  for (const { info, count } of sortedEntries(main)) s += count + " " + info.name + "\n";
  if (side.size) { s += "\nSideboard\n"; for (const { info, count } of sortedEntries(side)) s += count + " " + info.name + "\n"; }
  return s;
}
async function ioAction() {
  const io = document.getElementById("io");
  const ta = document.getElementById("iotext");
  if (io.dataset.mode === "export") {
    try { await navigator.clipboard.writeText(ta.value); document.getElementById("iomsg").textContent = "copied"; }
    catch { ta.select(); document.getElementById("iomsg").textContent = "select + copy manually"; }
    return;
  }
  try {
    const d = await Arcana.Api.import(ta.value);
    loadEntries(main, d.main); loadEntries(side, d.sideboard);
    if (d.name) document.getElementById("deckname").value = d.name;
    render();
    if (d.unresolved.length) {
      document.getElementById("iomsg").textContent = "imported; unresolved: " + d.unresolved.map(([n, c]) => c + " " + n).join(", ");
    } else { closeIo(); }
  } catch (e) {
    document.getElementById("iomsg").textContent = "import failed";
  }
}

// ---- play ----
async function playDeck() {
  const ids = [];
  for (const { info, count } of main.values()) for (let i = 0; i < count; i++) ids.push(info.id);
  if (ids.length < 7) { alert("Need at least 7 maindeck cards (40–60 recommended)."); return; }
  const body = { deck: ids };
  const sel = document.getElementById("opponent").value;
  if (sel === "sample") body.opponent = sampleDeck;
  else if (sel.startsWith("saved:")) {
    const d = savedDecks()[sel.slice(6)];
    if (d) body.opponent = deckIdsFromSaved(d);
  } // "mirror" -> omit opponent (server mirrors)
  if (body.opponent && body.opponent.length < 7) {
    alert("Opponent deck has fewer than 7 cards; it will fall back to the sample deck.");
  }
  try { await Arcana.Api.newGame(body); window.location = "/"; }
  catch (e) { alert("Could not start a game with this deck."); }
}

// ---- pre-download art for the current results + deck (no trickle) ----
async function cacheArt() {
  const names = new Set();
  for (const c of (window._lastResults || [])) names.add(c.name);
  for (const { info } of main.values()) names.add(info.name);
  for (const { info } of side.values()) names.add(info.name);
  const list = [...names];
  const btn = document.getElementById("cacheart");
  const msg = document.getElementById("cacheart-msg");
  if (!list.length) { msg.textContent = "nothing to cache"; return; }
  btn.disabled = true;
  let done = 0;
  const BATCH = 24;
  try {
    for (let i = 0; i < list.length; i += BATCH) {
      const batch = list.slice(i, i + BATCH);
      await Arcana.Api.warmArt(batch);
      done += batch.length;
      msg.textContent = "Caching art… " + done + "/" + list.length;
    }
    msg.textContent = "Art cached (" + list.length + ")";
    render(); // re-render so any fallback images reload from the now-warm cache
  } catch (e) {
    msg.textContent = "art cache failed";
  } finally {
    btn.disabled = false;
  }
}

// ---- download ALL catalog art (background job + progress polling) ----
let warmPoll = null;
async function downloadAllArt() {
  const msg = document.getElementById("cacheart-msg");
  document.getElementById("cacheall").disabled = true;
  try { await Arcana.Api.warmAll(); }
  catch (e) { msg.textContent = "couldn't start"; document.getElementById("cacheall").disabled = false; return; }
  pollWarmAll();
}
async function pollWarmAll() {
  if (warmPoll) { clearTimeout(warmPoll); warmPoll = null; }
  let s;
  try { s = await Arcana.Api.warmStatus(); } catch (e) { return; }
  const msg = document.getElementById("cacheart-msg");
  const btn = document.getElementById("cacheall");
  if (s.running) {
    btn.disabled = true;
    const miss = s.failed ? " (" + s.failed + " missing)" : "";
    msg.textContent = "Downloading all art… " + s.done + "/" + s.total + miss;
    warmPoll = setTimeout(pollWarmAll, 1500);
  } else {
    btn.disabled = false;
    if (s.total) {
      msg.textContent = "All art cached (" + (s.total - s.failed) + "/" + s.total +
        (s.failed ? ", " + s.failed + " missing" : "") + ")";
      render(); // reload any fallback tiles from the now-warm cache
    }
  }
}

// ---- wire ----
document.getElementById("search").onsubmit = (e) => { e.preventDefault(); search(); };
document.getElementById("cacheart").onclick = cacheArt;
document.getElementById("cacheall").onclick = downloadAllArt;
pollWarmAll(); // resume the progress display if a download is already running
document.getElementById("save").onclick = saveDeck;
document.getElementById("clear").onclick = () => { if (confirm("Clear the deck?")) clearDeck(); };
document.getElementById("loadsel").onchange = (e) => { if (e.target.value) loadDeck(e.target.value); };
document.getElementById("play").onclick = playDeck;
document.getElementById("import").onclick = () => openIo("import");
document.getElementById("export").onclick = () => openIo("export");
document.getElementById("ioclose").onclick = closeIo;
document.getElementById("iodo").onclick = ioAction;
document.getElementById("format").onchange = (e) => { curFormat = formats[+e.target.value] || null; checkLegality(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeIo(); });

async function init() {
  Arcana.mountThemeSwitcher(document.getElementById("themeslot"));
  await Arcana.loadGlossary();
  const kwsel = document.getElementById("q-kw");
  for (const k of Object.keys(Arcana.glossary).sort()) { const o = document.createElement("option"); o.textContent = k; kwsel.appendChild(o); }
  try { formats = await Arcana.Api.formats(); } catch (e) { formats = []; }
  try { sampleDeck = await Arcana.Api.sampleDeck(); } catch (e) { sampleDeck = []; }
  const fsel = document.getElementById("format");
  formats.forEach((f, i) => { const o = document.createElement("option"); o.value = i; o.textContent = f.name; fsel.appendChild(o); });
  curFormat = formats[0] || null;
  refreshLoadSelect();
  render();
  search(); // initial unconstrained page
}
init();
</script>
</body>
</html>
