<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcana — Deckbuilder</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #14161b; color: #e7e9ee; }
  header {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid #2a2f3a; position: sticky; top: 0; background: #14161b; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  header .spacer { flex: 1; }
  a, a:visited { color: #8fb3ff; text-decoration: none; }
  input, select, button {
    background: #20242d; color: #e7e9ee; border: 1px solid #3a4150; border-radius: 6px;
    padding: 5px 8px; font-size: 13px;
  }
  button { cursor: pointer; background: #2a2f3a; }
  button:hover:not(:disabled) { background: #353c4a; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #2d6a3f; border-color: #3f8a55; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #357a49; }
  main { display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start; }
  #browse { flex: 1; min-width: 0; }
  #deckpanel { width: 320px; flex-shrink: 0; border: 1px solid #2a2f3a; border-radius: 8px; padding: 10px; background: #1a1d24; position: sticky; top: 56px; max-height: calc(100vh - 70px); overflow-y: auto; }
  form#search { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  form#search .colors label { margin-right: 6px; font-size: 12px; }
  .grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .card {
    width: 104px; border-radius: 6px; overflow: hidden; background: #20242d; border: 1px solid #333a47;
    font-size: 11px; position: relative; cursor: pointer;
  }
  .card:hover { border-color: #4a6aa0; }
  .card img { width: 100%; display: block; aspect-ratio: 488/680; object-fit: cover; background: #0c0d11; }
  .card .nm { padding: 3px 4px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .cost { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.75); padding: 1px 5px; border-radius: 4px; font-weight: 700; font-size: 10px; }
  .card .cnt { position: absolute; top: 2px; left: 2px; background: #2d6a3f; padding: 1px 6px; border-radius: 999px; font-weight: 800; font-size: 11px; }
  .muted { opacity: .6; font-size: 12px; }
  #deckstats { font-size: 13px; margin-bottom: 8px; }
  #deckstats .curve { display: flex; gap: 3px; align-items: flex-end; height: 46px; margin: 6px 0; }
  #deckstats .bar { flex: 1; background: #3f5d8a; border-radius: 2px 2px 0 0; min-height: 2px; position: relative; }
  #deckstats .bar span { position: absolute; bottom: -15px; left: 0; right: 0; text-align: center; font-size: 9px; opacity: .6; }
  #decklist .row { display: flex; gap: 6px; align-items: center; padding: 2px 0; font-size: 13px; }
  #decklist .row .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #decklist .row button { padding: 0 7px; }
  .sectlabel { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .55; margin: 8px 0 3px; }
  #decklist .row button.mv { padding: 0 5px; font-size: 11px; opacity: .7; }
  #legality.ok { color: #8fd0a0; } #legality.bad { color: #e69a8a; }
  /* import/export overlay */
  #io { display: none; position: fixed; inset: 0; z-index: 90; background: rgba(8,9,12,.8); align-items: center; justify-content: center; }
  #io.show { display: flex; }
  #io .iobox { width: min(560px, 92vw); background: #1a1d24; border: 1px solid #3a4150; border-radius: 10px; padding: 12px; }
  #io .iohdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #io textarea { width: 100%; height: 50vh; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; background: #12141a; color: #e7e9ee; border: 1px solid #2a2f3a; border-radius: 6px; padding: 8px; }
  #io .iobtns { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  /* zoom */
  #zoom { display: none; position: fixed; inset: 0; z-index: 100; cursor: zoom-out; background: rgba(8,9,12,.85); align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
  #zoom.show { display: flex; }
  #zoom img { max-height: 82vh; border-radius: 14px; box-shadow: 0 10px 44px #000; }
</style>
</head>
<body>
  <header>
    <h1>Arcana Deckbuilder <span class="muted">(prototype)</span></h1>
    <a href="/">← Play</a>
    <span class="spacer"></span>
    <input id="deckname" placeholder="deck name" size="14" />
    <button id="save">Save</button>
    <select id="loadsel"><option value="">load…</option></select>
    <button id="import">Import</button>
    <button id="export">Export</button>
    <button id="clear">Clear</button>
    <select id="format"></select>
    <span id="legality" class="muted"></span>
    <span class="spacer"></span>
    <span id="total" class="muted"></span>
    <button id="play" class="primary">Play this deck</button>
  </header>

  <main>
    <section id="browse">
      <form id="search">
        <input id="q-name" placeholder="name contains…" size="16" />
        <span class="colors">
          <label><input type="checkbox" value="W" />W</label>
          <label><input type="checkbox" value="U" />U</label>
          <label><input type="checkbox" value="B" />B</label>
          <label><input type="checkbox" value="R" />R</label>
          <label><input type="checkbox" value="G" />G</label>
          <label><input type="checkbox" value="C" />◇</label>
        </span>
        <select id="q-type">
          <option value="">any type</option>
          <option>Creature</option><option>Instant</option><option>Sorcery</option>
          <option>Artifact</option><option>Enchantment</option><option>Land</option>
          <option>Planeswalker</option><option>Battle</option>
        </select>
        <select id="q-kw"><option value="">any keyword</option></select>
        <input id="q-cmin" type="number" min="0" placeholder="mv≥" style="width:64px" />
        <input id="q-cmax" type="number" min="0" placeholder="mv≤" style="width:64px" />
        <button type="submit">Search</button>
        <span id="results-meta" class="muted"></span>
      </form>
      <div id="results" class="grid"><span class="muted">Search the catalog to add cards.</span></div>
    </section>

    <aside id="deckpanel">
      <div id="deckstats"></div>
      <div id="decklist"></div>
    </aside>
  </main>

  <div id="io">
    <div class="iobox">
      <div class="iohdr"><b id="iotitle">Import deck</b><button id="ioclose">✕</button></div>
      <textarea id="iotext" spellcheck="false" placeholder="Paste an Arena/MTGO deck list…&#10;&#10;Deck&#10;4 Lightning Bolt&#10;20 Mountain"></textarea>
      <div class="iobtns"><button id="iodo" class="primary">Import</button><span id="iomsg" class="muted"></span></div>
    </div>
  </div>

  <div id="zoom"><img id="zoomimg" alt="card" /></div>

<script>
"use strict";

const main = new Map();   // cardId -> { info, count }  (maindeck)
const side = new Map();   // cardId -> { info, count }  (sideboard)
let glossary = {};
let formats = [];
let curFormat = null;
let legalityTimer = null;

function artUrl(name) {
  return "https://api.scryfall.com/cards/named?format=image&exact=" + encodeURIComponent(name);
}
function compactCost(c) { return c ? c.replace(/[{}]/g, "") : ""; }
function mapTotal(m) { let t = 0; for (const e of m.values()) t += e.count; return t; }
function sortedEntries(m) {
  return [...m.values()].sort((a, b) =>
    a.info.mana_value - b.info.mana_value || a.info.name.localeCompare(b.info.name));
}

// ---- card tiles ----
function tile(info) {
  const div = document.createElement("div");
  div.className = "card";
  const img = document.createElement("img");
  img.loading = "lazy"; img.alt = info.name; img.src = artUrl(info.name);
  img.onerror = () => { img.style.visibility = "hidden"; };
  div.appendChild(img);
  if (info.mana_cost) {
    const cost = document.createElement("div");
    cost.className = "cost"; cost.textContent = compactCost(info.mana_cost);
    div.appendChild(cost);
  }
  const have = main.get(info.id);
  if (have) {
    const cnt = document.createElement("div");
    cnt.className = "cnt"; cnt.textContent = have.count;
    div.appendChild(cnt);
  }
  const nm = document.createElement("div");
  nm.className = "nm"; nm.textContent = info.name;
  div.appendChild(nm);
  div.title = info.name + (info.mana_cost ? "  " + info.mana_cost : "") + "\n" + info.type_line +
    (info.keywords.length ? "\n" + info.keywords.join(", ") : "");
  div.onclick = () => addCard(main, info);
  div.oncontextmenu = (e) => { e.preventDefault(); zoom(info.name); };
  return div;
}

// ---- deck ops (generic over a map: main or side) ----
function addCard(m, info) { const e = m.get(info.id); if (e) e.count++; else m.set(info.id, { info, count: 1 }); render(); }
function setCount(m, id, n) { const e = m.get(id); if (!e) return; e.count = n; if (e.count <= 0) m.delete(id); render(); }
function moveCard(from, to, info) { setCountSilent(from, info.id, (from.get(info.id)?.count || 0) - 1); addCardSilent(to, info); render(); }
function setCountSilent(m, id, n) { const e = m.get(id); if (!e) return; e.count = n; if (e.count <= 0) m.delete(id); }
function addCardSilent(m, info) { const e = m.get(info.id); if (e) e.count++; else m.set(info.id, { info, count: 1 }); }

function render() {
  renderDeck();
  if (window._lastResults) renderResults(window._lastResults);
  scheduleLegality();
}

function sectionRows(container, m, isSide) {
  if (!m.size) { const e = document.createElement("div"); e.className = "muted"; e.textContent = isSide ? "(empty)" : "empty — click cards to add"; container.appendChild(e); return; }
  for (const { info, count } of sortedEntries(m)) {
    const row = document.createElement("div"); row.className = "row";
    const minus = document.createElement("button"); minus.textContent = "−"; minus.onclick = () => setCount(m, info.id, count - 1);
    const cnt = document.createElement("span"); cnt.textContent = count; cnt.style.minWidth = "14px"; cnt.style.textAlign = "center";
    const plus = document.createElement("button"); plus.textContent = "+"; plus.onclick = () => setCount(m, info.id, count + 1);
    const n = document.createElement("span"); n.className = "n"; n.textContent = info.name;
    n.title = info.type_line; n.style.cursor = "zoom-in"; n.oncontextmenu = (e) => { e.preventDefault(); zoom(info.name); };
    const cost = document.createElement("span"); cost.className = "muted"; cost.textContent = compactCost(info.mana_cost);
    const mv = document.createElement("button"); mv.className = "mv"; mv.textContent = isSide ? "→main" : "→SB";
    mv.title = isSide ? "move to maindeck" : "move to sideboard";
    mv.onclick = () => moveCard(isSide ? side : main, isSide ? main : side, info);
    row.append(minus, cnt, plus, n, cost, mv);
    container.appendChild(row);
  }
}

function renderDeck() {
  const total = mapTotal(main);
  document.getElementById("total").textContent = total + " main · " + mapTotal(side) + " SB";
  document.getElementById("play").disabled = total < 7;

  // stats: mana curve (nonland) + color counts (maindeck)
  const stats = document.getElementById("deckstats");
  const bins = [0,0,0,0,0,0,0,0];
  const colorCount = { W:0,U:0,B:0,R:0,G:0,C:0 };
  let lands = 0;
  for (const { info, count } of main.values()) {
    if (info.is_land) lands += count;
    else bins[Math.min(info.mana_value, 7)] += count;
    if (info.colors.length === 0) colorCount.C += count;
    else for (const c of info.colors) colorCount[c] += count;
  }
  const maxBin = Math.max(1, ...bins);
  const curve = bins.map((v, i) =>
    `<div class="bar" style="height:${Math.round(100 * v / maxBin)}%" title="mv ${i===7?'7+':i}: ${v}"><span>${i===7?'7+':i}</span></div>`).join("");
  const colors = Object.entries(colorCount).filter(([,v]) => v > 0).map(([k,v]) => `${v}${k}`).join("  ");
  stats.innerHTML =
    `<div>${total} cards · ${lands} lands · ${total - lands} spells</div>` +
    `<div class="curve">${curve}</div>` +
    `<div class="muted" style="margin-top:18px">${colors || "—"}</div>`;

  const list = document.getElementById("decklist");
  list.innerHTML = "";
  const ml = document.createElement("div"); ml.className = "sectlabel"; ml.textContent = "Maindeck"; list.appendChild(ml);
  sectionRows(list, main, false);
  const sl = document.createElement("div"); sl.className = "sectlabel"; sl.textContent = "Sideboard"; list.appendChild(sl);
  sectionRows(list, side, true);
}

// ---- legality ----
function scheduleLegality() {
  clearTimeout(legalityTimer);
  legalityTimer = setTimeout(checkLegality, 200);
}
async function checkLegality() {
  const el = document.getElementById("legality");
  if (!curFormat) { el.textContent = ""; return; }
  const body = {
    main: [...main.values()].map(({ info, count }) => [info.id, count]),
    sideboard: [...side.values()].map(({ info, count }) => [info.id, count]),
    spec: curFormat,
  };
  try {
    const r = await fetch("/legality", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const rep = await r.json();
    el.className = rep.legal ? "ok" : "bad";
    el.textContent = rep.legal ? "✓ legal" : ("✗ " + rep.violations.length + " issue" + (rep.violations.length > 1 ? "s" : ""));
    el.title = rep.violations.join("\n") || "legal for " + rep.format;
  } catch (e) { el.textContent = ""; }
}

// ---- search ----
function buildQuery() {
  const q = { limit: 120 };
  const name = document.getElementById("q-name").value.trim();
  if (name) q.name = name;
  const checked = [...document.querySelectorAll("form#search .colors input:checked")].map(c => c.value);
  if (checked.includes("C")) q.colorless = true;
  const colors = checked.filter(c => c !== "C");
  if (colors.length) q.colors = colors;
  const type = document.getElementById("q-type").value; if (type) q.types = [type];
  const kw = document.getElementById("q-kw").value; if (kw) q.keywords = [kw];
  const cmin = document.getElementById("q-cmin").value; if (cmin !== "") q.cmc_min = +cmin;
  const cmax = document.getElementById("q-cmax").value; if (cmax !== "") q.cmc_max = +cmax;
  return q;
}
async function search() {
  const r = await fetch("/search", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(buildQuery()) });
  const results = await r.json();
  window._lastResults = results;
  renderResults(results);
  document.getElementById("results-meta").textContent = results.length + " shown (capped)";
}
function renderResults(results) {
  const box = document.getElementById("results");
  box.innerHTML = "";
  if (!results.length) { box.innerHTML = '<span class="muted">No matches.</span>'; return; }
  for (const info of results) box.appendChild(tile(info, true));
}

// ---- save / load (localStorage) ----
function savedDecks() { try { return JSON.parse(localStorage.getItem("arcana.decks") || "{}"); } catch { return {}; } }
function refreshLoadSelect() {
  const sel = document.getElementById("loadsel");
  sel.innerHTML = '<option value="">load…</option>';
  for (const name of Object.keys(savedDecks())) { const o = document.createElement("option"); o.value = name; o.textContent = name; sel.appendChild(o); }
}
function loadEntries(m, arr) { m.clear(); for (const { info, count } of (arr || [])) m.set(info.id, { info, count }); }
function saveDeck() {
  const name = document.getElementById("deckname").value.trim();
  if (!name) { alert("Name the deck first."); return; }
  const decks = savedDecks();
  decks[name] = {
    main: [...main.values()].map(({ info, count }) => ({ info, count })),
    side: [...side.values()].map(({ info, count }) => ({ info, count })),
  };
  localStorage.setItem("arcana.decks", JSON.stringify(decks));
  refreshLoadSelect();
}
function loadDeck(name) {
  const d = savedDecks()[name]; if (!d) return;
  // tolerate the old flat format (array == maindeck only)
  loadEntries(main, Array.isArray(d) ? d : d.main);
  loadEntries(side, Array.isArray(d) ? [] : d.side);
  document.getElementById("deckname").value = name;
  render();
}
function clearDeck() { main.clear(); side.clear(); render(); }

// ---- import / export ----
function openIo(mode) {
  const io = document.getElementById("io");
  document.getElementById("iotitle").textContent = mode === "export" ? "Export deck" : "Import deck";
  document.getElementById("iodo").textContent = mode === "export" ? "Copy" : "Import";
  document.getElementById("iomsg").textContent = "";
  const ta = document.getElementById("iotext");
  if (mode === "export") { ta.value = exportText(); ta.readOnly = false; }
  else { ta.value = ""; ta.readOnly = false; }
  io.dataset.mode = mode;
  io.classList.add("show");
  ta.focus();
}
function closeIo() { document.getElementById("io").classList.remove("show"); }
function exportText() {
  const name = document.getElementById("deckname").value.trim() || "Untitled";
  let s = "About\nName " + name + "\n\nDeck\n";
  for (const { info, count } of sortedEntries(main)) s += count + " " + info.name + "\n";
  if (side.size) { s += "\nSideboard\n"; for (const { info, count } of sortedEntries(side)) s += count + " " + info.name + "\n"; }
  return s;
}
async function ioAction() {
  const io = document.getElementById("io");
  const ta = document.getElementById("iotext");
  if (io.dataset.mode === "export") {
    try { await navigator.clipboard.writeText(ta.value); document.getElementById("iomsg").textContent = "copied"; }
    catch { ta.select(); document.getElementById("iomsg").textContent = "select + copy manually"; }
    return;
  }
  const r = await fetch("/import", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: ta.value }) });
  if (!r.ok) { document.getElementById("iomsg").textContent = "import failed"; return; }
  const d = await r.json();
  loadEntries(main, d.main); loadEntries(side, d.sideboard);
  if (d.name) document.getElementById("deckname").value = d.name;
  render();
  if (d.unresolved.length) {
    document.getElementById("iomsg").textContent = "imported; unresolved: " + d.unresolved.map(([n, c]) => c + " " + n).join(", ");
  } else { closeIo(); }
}

// ---- play ----
async function playDeck() {
  const ids = [];
  for (const { info, count } of main.values()) for (let i = 0; i < count; i++) ids.push(info.id);
  if (ids.length < 7) { alert("Need at least 7 maindeck cards (40–60 recommended)."); return; }
  const r = await fetch("/new", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deck: ids }) });
  if (r.ok) window.location = "/"; else alert("Could not start a game with this deck.");
}

// ---- zoom ----
function zoom(name) { const z = document.getElementById("zoom"); document.getElementById("zoomimg").src = artUrl(name); z.classList.add("show"); }
document.getElementById("zoom").onclick = () => document.getElementById("zoom").classList.remove("show");
document.addEventListener("keydown", e => { if (e.key === "Escape") { document.getElementById("zoom").classList.remove("show"); closeIo(); } });

// ---- wire ----
document.getElementById("search").onsubmit = (e) => { e.preventDefault(); search(); };
document.getElementById("save").onclick = saveDeck;
document.getElementById("clear").onclick = () => { if (confirm("Clear the deck?")) clearDeck(); };
document.getElementById("loadsel").onchange = (e) => { if (e.target.value) loadDeck(e.target.value); };
document.getElementById("play").onclick = playDeck;
document.getElementById("import").onclick = () => openIo("import");
document.getElementById("export").onclick = () => openIo("export");
document.getElementById("ioclose").onclick = closeIo;
document.getElementById("iodo").onclick = ioAction;
document.getElementById("format").onchange = (e) => { curFormat = formats[+e.target.value] || null; checkLegality(); };

async function init() {
  try { const r = await fetch("/glossary"); if (r.ok) glossary = await r.json(); } catch {}
  const kwsel = document.getElementById("q-kw");
  for (const k of Object.keys(glossary).sort()) { const o = document.createElement("option"); o.textContent = k; kwsel.appendChild(o); }
  try { const r = await fetch("/formats"); if (r.ok) formats = await r.json(); } catch {}
  const fsel = document.getElementById("format");
  formats.forEach((f, i) => { const o = document.createElement("option"); o.value = i; o.textContent = f.name; fsel.appendChild(o); });
  curFormat = formats[0] || null;
  refreshLoadSelect();
  render();
  search(); // initial unconstrained page
}
init();
</script>
</body>
</html>
