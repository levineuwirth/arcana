  renderFullCtl();
  try { adopt(await Arcana.Api.autoPass(on ? "full_control" : "default"), true); }
  catch (e) { logLine("sys", "auto-pass: " + e); }
}
fullctlBtn.onclick = () => setFullControl(!fullControl, true);

// "Pass until <phase>" — the one-shot skip directive (overhaul step 2). The
// server auto-passes our windows up to the checkpoint (or an interrupt: stack
// activity, a block to declare, a must-attack) and returns the state there.
// One request in solo play; in a networked duel the directive persists on the
// session and our windows keep being consumed as the opponent acts.
async function passUntil(until, label) {
  if (G.busy || matchOver) return;
  const v = G.resp && G.resp.view;
  if (v && v.game_over) return;
  logLine("sys", "Skipping to " + label + "…");
  setBusy(true);
  try { adopt(await Arcana.Api.passUntil(until), true); }
  catch (e) { logLine("sys", "skip: " + (e && e.message || e)); }
  finally { setBusy(false); }
}
const SKIP_LABELS = { combat: "combat", end_of_turn: "end of turn", my_next_turn: "your next turn" };
for (const b of document.querySelectorAll(".skipctl")) {
  b.onclick = () => passUntil(b.dataset.until, SKIP_LABELS[b.dataset.until]);
}

// Play hotkeys (ignored while typing / with a modifier held).
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  // F: toggle full control.
  if (e.key === "f" || e.key === "F") { e.preventDefault(); setFullControl(!fullControl, true); return; }

  // C / E / N: pass until combat / end of turn / my next turn.
  if (e.key === "c" || e.key === "C") { e.preventDefault(); passUntil("combat", SKIP_LABELS.combat); return; }
  if (e.key === "e" || e.key === "E") { e.preventDefault(); passUntil("end_of_turn", SKIP_LABELS.end_of_turn); return; }
  if (e.key === "n" || e.key === "N") { e.preventDefault(); passUntil("my_next_turn", SKIP_LABELS.my_next_turn); return; }

  // Space / Enter: pass priority — blitz through priority windows to reach the
  // next decision (essential under full control, which stops at many more of
  // them, including the mana-only windows before combat). A no-op during a
  // combat declaration (PassPriority isn't legal there, so you never skip past
  // declaring attackers/blockers) and while a request is in flight.
  if (e.key === " " || e.key === "Enter") {
    if (G.busy) return;
    const legal = (G.resp && G.resp.view && G.resp.view.legal) || [];
    const pass = legal.find((a) => a.label === "Pass" || a.label === "Pass priority");
    if (pass) { e.preventDefault(); sendAction(pass.index, "Pass"); }
  }
});
renderFullCtl();

// Panels menu open/close
const panelsBtn = document.getElementById("panelsbtn");
const panelsPop = document.getElementById("panels-pop");
panelsBtn.onclick = (e) => { e.stopPropagation(); panelsPop.classList.toggle("show"); };
document.addEventListener("click", (e) => {
  if (!document.getElementById("panels-menu").contains(e.target)) panelsPop.classList.remove("show");
});

// ----- networked duel: context, reconnect, leave ---------------------------
// The Stage hands the cockpit its (code, seat, token) in the URL. We also stash
// them in localStorage so a refresh / reopen of /duel reconnects to the same
// seat (the token is the only proof we own it). Solo play has no creds and uses
// the original routes untouched.
const MATCH_KEY = "arcana.match";
function saveMatchCreds(c) { try { localStorage.setItem(MATCH_KEY, JSON.stringify(c)); } catch (e) {} }
function loadMatchCreds() { try { return JSON.parse(localStorage.getItem(MATCH_KEY) || "null"); } catch (e) { return null; } }
function clearMatchCreds() { try { localStorage.removeItem(MATCH_KEY); } catch (e) {} }

function enterMatchMode(ctx) {
  Arcana.Match.set(ctx);
  saveMatchCreds(ctx);
  document.querySelector(".sub").textContent = "cockpit · seat " + ctx.seat + " · " + ctx.code;
  // Auto-pass is a solo convenience; hide it in a networked duel.
  const ap = document.querySelector(".autopass-ctl");
  if (ap) ap.style.display = "none";
  // Repurpose "New duel →" as "Leave match".
  const nb = document.getElementById("new");
  if (nb) { nb.textContent = "Leave match"; nb.title = "Leave this networked duel"; nb.onclick = leaveMatch; }
}

async function leaveMatch() {
  if (!confirm("Leave this match? Your opponent will be told it ended.")) return;
  Arcana.Match.closeSocket();
  try { await Arcana.Api.matchLeave(); } catch (e) { /* best-effort */ }
  clearMatchCreds();
  window.location = "/";
}

// Pull the lobby roster once so the HUD + waiting pill show real names.
async function loadOpponentName() {
  if (!Arcana.Match.active()) return;
  try {
    const info = await Arcana.Api.lobbyInfo(Arcana.Match.ctx.code);
    if (info && info.seats) {
      const me = Arcana.Match.seat();
      G.myName = (info.seats[me] && info.seats[me].name) || "You";
      G.oppName = (info.seats[1 - me] && info.seats[1 - me].name) || "Opponent";
      maybePollOpponent();
    }
  } catch (e) { /* names are cosmetic */ }
}

(async function boot() {
  const p = new URLSearchParams(location.search);
  const code = p.get("code"), seat = p.get("seat"), token = p.get("token");
  if (code && seat !== null && token) {
    enterMatchMode({ code, seat: parseInt(seat, 10), token });
  } else {
    // No URL creds — reconnect to a stored match if it's still live.
    const saved = loadMatchCreds();
    if (saved && saved.code) {
      try {
        const info = await Arcana.Api.lobbyInfo(saved.code);
        if (info && info.status !== "over") enterMatchMode(saved);
        else clearMatchCreds();
      } catch (e) { clearMatchCreds(); }
    }
  }
  await loadOpponentName();
  Arcana.loadGlossary();
  // Sync saved full-control to the server (solo only); the server already defaults
  // to smart auto-pass, so we only push when full control was left on.
  if (!Arcana.Match.active() && fullControl) {
    try { await Arcana.Api.autoPass("full_control"); } catch (e) { /* ignore */ }
  }
  await getState();
  startMatchSocket(); // server push for networked duels (no-op when solo)
})();
</script>
</body>
