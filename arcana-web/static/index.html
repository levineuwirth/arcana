<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcana — Analyst Cockpit</title>
<!-- apply the persisted theme before paint to avoid a flash -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem("arcana.theme")||"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
<link rel="stylesheet" href="/theme.css" />
<style>
  /* =========================================================================
     ANALYST COCKPIT — a fixed-viewport, dockable panel workspace.

     The page NEVER scrolls (100dvh). A top bar sits above a workspace made of a
     three-column dock row (left / center / right) plus a full-width bottom dock,
     separated by draggable dividers. Each region holds one-or-more PANELS from a
     registry; every panel has a header with a collapse toggle, can be hidden via
     the Panels menu, and the full layout (sizes / collapsed / hidden) persists to
     localStorage. Panels scroll INTERNALLY; the board's cards are height-driven
     so they stay legible (analysis framing, not a maximized table).
     ========================================================================= */
  html, body { height: 100%; }
  body { height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    padding: 0 var(--page-padding); gap: 6px; }

  /* CSS-var-driven dock sizes (mutated by the resizers, persisted to storage). */
  :root { --dock-left: 240px; --dock-right: 290px; }

  /* ---- top bar ---- */
  /* .topbar / .wordmark / .sub are shared (theme.css). */
  .topbar { flex: 0 0 auto; }
  .phasebar {
    display: flex; align-items: baseline; gap: 12px;
    padding: 5px 14px; border: 1px solid var(--border); border-left: 3px solid var(--border);
    border-radius: var(--radius-panel); background: var(--bg-offset);
  }
  .phasebar.you-turn { border-left-color: var(--text); }
  .arrows { position: fixed; inset: 0; z-index: 110; pointer-events: none; }
  .arrows path { fill: none; stroke-width: 3; opacity: .92; stroke-linecap: round; }

  /* board-click targeting */
  .ac-card.targeting-src .ac-frame { box-shadow: 0 0 0 3px var(--tgt, #caa45a); }
  .ac-card.target .ac-frame { box-shadow: 0 0 0 3px #caa45a; cursor: pointer; }
  .ac-card.target:hover .ac-frame { box-shadow: 0 0 0 4px #caa45a; }
  .phud.target-player { cursor: pointer; outline: 2px solid #caa45a; outline-offset: 2px; border-radius: var(--radius-control); }
  .targetbanner {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 130;
    display: flex; align-items: center; gap: 14px; padding: 8px 16px;
    background: var(--bg-offset); border: 1px solid #caa45a; border-radius: var(--radius-panel);
    box-shadow: var(--shadow-float); font-family: var(--font-serif); font-size: 15px; color: var(--text);
  }
  .targetbanner button { font-size: 12px; }
  .autopass-ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); }
  .autopass-ctl select {
    font-family: var(--font-sans); font-size: 12px; text-transform: none; letter-spacing: 0;
    color: var(--text); background: var(--bg-offset); border: 1px solid var(--border);
    border-radius: var(--radius-control); padding: 2px 6px;
  }
  /* Full-control toggle (F): quiet when off, a lit amber chip when armed. */
  #fullctl {
    font-family: var(--font-sans); font-size: 12px; text-transform: none; letter-spacing: 0;
    color: var(--text-muted); background: var(--bg-offset); border: 1px solid var(--border);
    border-radius: var(--radius-control); padding: 2px 8px; cursor: pointer;
  }
  #fullctl:hover { border-color: var(--text-muted); color: var(--text); }
  #fullctl.active {
    color: #1a1205; background: var(--tgt, #caa45a); border-color: var(--tgt, #caa45a);
    font-weight: 600;
  }
  /* "Pass until <phase>" skip cluster — same chip language as #fullctl. */
  .skipctl {
    font-family: var(--font-sans); font-size: 12px; text-transform: none; letter-spacing: 0;
    color: var(--text-muted); background: var(--bg-offset); border: 1px solid var(--border);
    border-radius: var(--radius-control); padding: 2px 8px; cursor: pointer;
  }
  .skipctl:hover { border-color: var(--text-muted); color: var(--text); }
  .skipctl:disabled { opacity: .5; cursor: default; }
  #skipgroup { display: inline-flex; align-items: center; gap: 4px; }
  #skipgroup .lbl { font-size: 11px; color: var(--text-muted); }
  .kbd { opacity: .6; font-size: 10px; margin-left: 5px; letter-spacing: .04em; }
  .phasebar .turn { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 13px; }
  .phasebar .step { font-family: var(--font-serif); font-weight: 600; font-size: 17px; color: var(--text); }
  .phasebar .who { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .phasebar .who.you { color: var(--text); }
  .phasebar .who.opp { color: var(--text-faint); }

  /* ---- Panels menu (show/hide + reset) ---- */
  .menu-wrap { position: relative; }
  .menu-pop {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 140; min-width: 190px;
    display: none; padding: 6px; background: var(--bg-nav);
    border: 1px solid var(--border-muted); border-radius: var(--radius-panel);
    box-shadow: var(--shadow-float);
  }
  .menu-pop.show { display: block; }
  .menu-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 13px;
    cursor: pointer; border-radius: var(--radius-control);
  }
  .menu-item:hover { background: var(--bg-offset); }
  .menu-item input { width: auto; padding: 0; margin: 0; }
  .menu-sep { height: 1px; background: var(--border); margin: 6px 2px; }

  #banner {
    flex: 0 0 auto; display: none; padding: 8px 14px; border: 1px solid var(--border-muted);
    border-radius: var(--radius-panel); background: var(--bg-offset);
    font-family: var(--font-serif); font-weight: 600; font-size: 16px;
  }

  /* ---- workspace + docks ---- */
  #workspace { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #docks-row { flex: 1 1 auto; min-height: 0; display: flex; }
  .dock { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; overflow: hidden; }
  #dock-left  { width: var(--dock-left);  flex: 0 0 auto; }
  #dock-right { width: var(--dock-right); flex: 0 0 auto; }
  #dock-center { flex: 1 1 auto; min-width: 260px; }

  /* draggable dividers (vertical only — left/right column resize) */
  .divider { flex: 0 0 auto; background: transparent; transition: background var(--transition-fast); }
  .divider-v { width: 7px; cursor: col-resize; }
  .divider:hover, .divider.dragging { background: var(--border-muted); }

  /* ---- panel chrome ---- */
  .panel {
    display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-panel); background: var(--bg-offset);
  }
  .panel.grow { flex: 1 1 0; }
  .panel:not(.grow) { flex: 0 0 auto; }
  .panel.collapsed { flex: 0 0 auto; }
  .panel.collapsed .panel-body { display: none; }
  .panel.hidden { display: none; }
  .panel-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 8px;
    border-bottom: 1px solid var(--border); background: var(--bg-nav);
  }
  .panel-head .ptitle-text {
    flex: 1; font-family: var(--font-sans); font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint);
  }
  .panel-head .pcollapse {
    border: none; background: transparent; padding: 0 4px; font-size: 11px; line-height: 1;
    color: var(--text-faint); cursor: pointer;
  }
  .panel-head .pcollapse:hover { color: var(--text); background: transparent; }
  .panel-body {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    overflow: auto; padding: 6px 8px;
  }
  /* card-bearing bodies don't scroll the page — their card rows scale to fit */
  .body-board, .body-hand, .body-stack { overflow: hidden; padding: 6px; }
  .body-hand { height: clamp(120px, 18vh, 210px); }
  .body-actions { max-height: 24vh; overflow: auto; }

  /* ---- board panel ---- */
  .board { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .player {
    flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-panel);
    padding: 4px 12px 6px; background: var(--bg);
  }
  .player.you { border-color: var(--border-muted); }
  .ptitle { flex: 0 0 auto; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 2px; }
  .ptitle .who { font-family: var(--font-sans); font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  .ptitle .life { font-family: var(--font-serif); font-weight: 600; font-size: 22px;
    font-variant-numeric: tabular-nums; line-height: 1; }
  .ptitle .life .unit { font-size: 11px; color: var(--text-faint); font-weight: 400; margin-left: 3px; }
  .ptitle .gauge { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  .ptitle .gauge .gpip { display: inline-flex; align-items: center; gap: 1px; font-variant-numeric: tabular-nums; }
  .ptitle .gauge .floating { color: var(--text-faint); }
  .ptitle .counts { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; }
  .ptitle .spacer { flex: 1; }

  /* the battlefield: lands (left) + permanents (right) as side-by-side COLUMNS,
     so a player band is ONE card tall (not two stacked rows) → cards fill the
     full band height. Each column's width is set ∝ its card count (in JS) so
     every card gets ~equal width; an empty column is hidden so the populated one
     spans the whole band. */
  .lands-creatures { flex: 1; min-height: 0; display: flex; flex-direction: row; gap: 12px; }
  .zone { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .zone.collapsed { display: none; }     /* empty column yields its width */
  .zone-head { flex: 0 0 auto; margin: 0 0 2px; }
  .zone-head.toggle { display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer; width: fit-content; }
  .zone-head .zone-toggle { font-size: 10px; color: var(--text-faint); text-transform: none; letter-spacing: 0; }
  .zone-head.toggle:hover .zone-toggle { color: var(--text-muted); }

  /* collapsed lands: a VERTICAL chip column, sized to content + pinned left so
     lands stay confined to a narrow left strip; scrolls if tall. */
  .landstrip { flex: 0 0 auto; min-width: 0; }
  .landstrip .land-chips { flex: 1; min-height: 0; display: flex; flex-direction: column;
    flex-wrap: nowrap; gap: 4px; overflow-y: auto; padding-top: 2px; }
  .land-chip {
    display: flex; align-items: baseline; gap: 8px; justify-content: space-between;
    min-width: 116px; max-width: 220px;
    font-family: var(--font-sans); font-size: 12px; line-height: 1.4;
    padding: 3px 8px; border: 1px solid var(--border); border-radius: var(--radius-control);
    color: var(--text); background: var(--bg); font-variant-numeric: tabular-nums;
  }
  .land-chip .lc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .land-chip .lc-n {
    flex: 0 0 auto; font-size: 10px; padding: 0 5px; border-radius: 999px;
    background: var(--bg-offset); color: var(--text-muted); border: 1px solid var(--border-muted);
  }
  .land-chip .lc-pips { flex: 0 0 auto; font-size: 9px; letter-spacing: 1px; line-height: 1; }
  .land-chip .lc-pips .on { color: var(--text); }
  .land-chip .lc-pips .off { color: var(--text-faint); }
  .land-chip.tapped { color: var(--text-faint); border-color: var(--border-muted); font-style: italic; }
  .land-chip.clickable { cursor: pointer; }
  .land-chip.clickable:hover { background: var(--bg-offset); border-color: var(--text-muted); }

  /* height-driven card rows: cards fill the row height + scale with the viewport;
     too many cards scroll horizontally (the page itself never scrolls). */
  .cards { display: flex; gap: 8px; align-items: flex-end; }
  .cards.fit { flex: 1; min-height: 0; height: 100%; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
  .cards.fit .ac-card { height: 100%; width: auto; aspect-ratio: 488 / 680; flex: 0 0 auto; }
  .cards.fit .ac-card .ac-frame { width: 100%; height: 100%; left: 0; top: 0; }
  /* tapped: stay in the portrait slot, rotate + scale to fit (no overlap) */
  .cards.fit .ac-card.tapped { width: auto; height: 100%; aspect-ratio: 488 / 680; }
  .cards.fit .ac-card.tapped .ac-frame { left: 0; top: 0; transform: rotate(90deg) scale(.7); }

  /* The HAND is a single content-height row (it lives in the content-sized Play
     strip, not a flex-filled panel), so its cards get an explicit comfortable
     height. The BATTLEFIELD stays height-driven (fills the now-large board,
     never overflows → never cut off). Scoped by row class so they don't clash. */
  :root { --hand-card-h: clamp(150px, 20vh, 224px); }
  .cards.hand.fit { flex: 0 0 auto; height: auto; align-items: flex-start; }
  .cards.hand.fit .ac-card { height: var(--hand-card-h); }
  .cards.hand.fit .ac-card.tapped { height: var(--hand-card-h); }

  /* Forge-style pile: identical cards collapse to one tile with a ×N count badge
     and the right edges of the cards behind fanned out. Horizontal-only offset
     (the row clips vertically); margin keeps the fan clear of the next pile. */
  .cards.battlefield.fit .ac-card.stacked { margin-right: 14px; }
  .ac-card.stacked::before, .ac-card.stacked::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
    border-radius: 5px; background: var(--bg-offset); box-shadow: 0 0 0 1px var(--border-muted);
  }
  .ac-card.stacked::before { transform: translateX(5px); }
  .ac-card.stacked::after  { transform: translateX(10px); }

  .empty { color: var(--text-faint); font-size: 12px; font-style: italic; font-family: var(--font-serif); padding: 2px 0; }

  /* ---- consolidated player HUD (vitals on one line) ---- */
  .phud {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 2px 2px 4px; font-family: var(--font-sans); font-size: 12px; color: var(--text-muted);
  }
  .phud .who { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  .phud .life { font-family: var(--font-serif); font-weight: 600; font-size: 20px; color: var(--text);
    font-variant-numeric: tabular-nums; line-height: 1; }
  .phud .life .unit { font-size: 10px; color: var(--text-faint); font-weight: 400; margin-left: 3px; }
  .phud .energy { font-family: var(--font-serif); font-weight: 600; font-size: 16px; color: var(--mana-r, #d08a2a);
    font-variant-numeric: tabular-nums; line-height: 1; }
  .phud .energy .unit { font-size: 10px; color: var(--text-faint); font-weight: 400; margin-left: 3px; }
  .phud .poison { font-family: var(--font-serif); font-weight: 600; font-size: 16px; color: var(--mana-g, #5aa15a);
    font-variant-numeric: tabular-nums; line-height: 1; }
  .phud .poison .unit { font-size: 10px; color: var(--text-faint); font-weight: 400; margin-left: 3px; }
  .phud .poison.lethal { color: #c0432a; animation: poison-pulse 1.2s ease-in-out infinite; }
  @keyframes poison-pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .phud .gauge { display: flex; align-items: center; gap: 8px; }
  .phud .gauge .gpip { display: inline-flex; align-items: center; gap: 1px; font-variant-numeric: tabular-nums; }
  .phud .gauge .floating { color: var(--text-faint); }
  .phud .spacer { flex: 1; }
  .phud .counts { display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
  .phud .counts .zc { border-radius: var(--radius-control); padding: 0 4px; }
  .phud .counts .zc.clickable { cursor: pointer; }
  .phud .counts .zc.clickable:hover { background: var(--bg); color: var(--text); }
  /* exile pip glows when it holds something you can play (impulse / foretell) */
  .phud .counts .zc.hot { color: var(--link); box-shadow: 0 0 0 1px color-mix(in srgb, var(--link) 55%, transparent); }
  .phud .counts .zc.hot .zc-spark { font-size: 10px; }
  /* a castable card (e.g. an impulse-exiled card) glows in the zone viewer */
  .ac-card.castable .ac-frame { box-shadow: 0 0 0 2px var(--link), 0 0 16px color-mix(in srgb, var(--link) 45%, transparent); }
  .ac-card.castable:hover .ac-frame { box-shadow: 0 0 0 3px var(--link), 0 0 22px color-mix(in srgb, var(--link) 60%, transparent); }

  /* zone viewer modal (browse graveyard / exile / library / hand) */
  .zoneviewer {
    position: fixed; inset: 0; z-index: 150; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 7, 6, .5); padding: 24px;
  }
  .zv-box {
    display: flex; flex-direction: column; min-height: 0; max-height: 86vh; max-width: min(1100px, 94vw);
    background: var(--bg-offset); border: 1px solid var(--border-muted);
    border-radius: var(--radius-panel); box-shadow: var(--shadow-float); padding: 12px 16px;
  }
  .zv-head { flex: 0 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    font-family: var(--font-serif); font-weight: 600; font-size: 16px; margin-bottom: 10px; }
  .zv-head .zv-n { color: var(--text-faint); font-weight: 400; font-size: 13px; }
  .zv-close { font-size: 14px; line-height: 1; padding: 2px 8px; }
  .zv-grid { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .zv-back {
    width: var(--card-w); height: var(--card-h); flex: 0 0 auto;
    border-radius: 6px; border: 1px solid var(--border-muted);
    background: linear-gradient(145deg, var(--bg) 0%, var(--bg-offset) 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif); font-size: 13px; color: var(--text-faint); letter-spacing: .08em;
  }
  .phud.opp { border-bottom: 1px solid var(--border); margin-bottom: 2px; }

  /* ---- Play strip: your HUD + hand + minimal action controls ---- */
  .body-play { display: flex; flex-direction: column; gap: 4px; }
  #handzone { flex: 0 0 auto; display: flex; flex-direction: column; }
  #actions { flex: 0 0 auto; }

  /* ---- stack / log panels ---- */
  #stack { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; }
  #log { flex: 1; min-height: 0; font-size: 12px; overflow-y: auto; }
  #log .ln { line-height: 1.4; padding: 1px 0 1px 8px; border-left: 2px solid transparent; }
  #log .you { color: var(--text); border-left-color: var(--blk); }
  #log .opp { color: var(--text-muted); border-left-color: var(--atk); }
  #log .sys { color: var(--text-faint); font-style: italic; }
  /* effect outcomes (life/damage/draw/death) — subtle, indented under the action */
  #log .evt { color: var(--text-muted); border-left-color: var(--border-muted); font-size: 11px; padding-left: 14px; }

  /* ---- Eval panel (chess-style bar) ---- */
  .evalwrap { display: flex; flex-direction: column; gap: 6px; }
  .evalends { display: flex; justify-content: space-between; font-size: 10px;
    text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); }
  .evalbar {
    position: relative; height: 22px; border: 1px solid var(--border);
    border-radius: var(--radius-control); background: var(--bg); overflow: hidden;
  }
  .evalbar-you { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text);
    transition: width var(--transition-medium); }
  @media (prefers-reduced-motion: reduce) { .evalbar-you { transition: none; } }
  .evalbar-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-muted); }
  .evalrow { display: flex; align-items: baseline; gap: 6px; }
  .evalwin { font-family: var(--font-serif); font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
  .evalwin-lbl { font-size: 11px; color: var(--text-faint); }
  .evalmeta { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* ---- Draw-odds panel ---- */
  .draw-total { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .draw-total b { color: var(--text); font-variant-numeric: tabular-nums; }
  .draw-sec { margin-bottom: 10px; }
  .draw-sec-h { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-faint); margin-bottom: 4px; }
  .draw-types { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; }
  .draw-types span b { font-variant-numeric: tabular-nums; }
  .draw-cmc-row { display: flex; align-items: center; gap: 6px; font-size: 11px; margin: 2px 0; }
  .draw-cmc-lbl { width: 26px; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .draw-cmc-track { flex: 1; min-width: 0; }
  .draw-cmc-bar { height: 10px; background: var(--text-muted); border-radius: 2px; min-width: 1px; }
  .draw-cmc-cnt { color: var(--text-faint); font-variant-numeric: tabular-nums; width: 22px; }
  .draw-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .draw-controls input { width: 58px; padding: 3px 6px; font-variant-numeric: tabular-nums; }
  .draw-odds-row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; padding: 1px 4px; border-radius: var(--radius-control); }
  .draw-odds-row.clickable { cursor: pointer; }
  .draw-odds-row.clickable:hover { background: var(--bg-offset); }
  .draw-odds-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .draw-odds-k { color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .draw-odds-p { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; font-weight: 500; }

  /* ---- Suggested-lines panel ---- */
  #suggestpanel { display: flex; flex-direction: column; gap: 4px; min-height: 0; height: 100%; overflow-y: auto; }
  .sg-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .sg-status { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); }
  .sg-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 4px;
    border: 1px solid transparent; border-radius: var(--radius-control);
  }
  .sg-row.clickable { cursor: pointer; }
  .sg-row.clickable:hover { background: var(--bg-offset); border-color: var(--border-muted); }
  .sg-best { border-color: var(--border-muted); }
  .sg-meter { flex: 0 0 44px; height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
  .sg-fill { height: 100%; background: var(--text-muted); }
  .sg-best .sg-fill { background: var(--text); }
  .sg-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .sg-pct { flex: 0 0 auto; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .sg-delta { flex: 0 0 30px; text-align: right; font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  /* ---- Card-power panel ---- */
  #powerpanel { display: flex; flex-direction: column; gap: 3px; min-height: 0; max-height: 100%; overflow-y: auto; }
  .cp-row { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border: 1px solid transparent; border-radius: var(--radius-control); }
  .cp-row.clickable { cursor: pointer; }
  .cp-row.clickable:hover { background: var(--bg-offset); border-color: var(--border-muted); }
  .cp-meter { flex: 0 0 44px; height: 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
  .cp-fill { height: 100%; background: var(--text-muted); }
  .cp-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .cp-pct { flex: 0 0 auto; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-muted); }

  /* ---- deferred panel slots (registry placeholders) ---- */
  .deferred-note { font-size: 12px; font-style: italic; font-family: var(--font-serif); color: var(--text-faint); }

  /* ---- card-driven actions: hint + multi-ability chooser popup ---- */
  .action-hint { margin: 2px 0 4px; }
  .decision-prompt {
    font-family: var(--font-serif); font-size: 15px; color: var(--link);
    margin: 2px 0 8px; padding: 6px 12px; border-left: 3px solid var(--link);
    background: color-mix(in srgb, var(--link) 10%, transparent); border-radius: 0 6px 6px 0;
  }
  .action-menu {
    position: fixed; z-index: 140; display: flex; flex-direction: column; gap: 2px;
    background: var(--bg-offset); border: 1px solid var(--border-muted);
    border-radius: var(--radius-control); box-shadow: var(--shadow-float); padding: 4px;
  }
  .action-menu button { text-align: left; white-space: nowrap; }
  .action-menu-head { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-faint); padding: 2px 4px 4px; }

  /* combat highlight: red = attacking, blue = blocking — semantic colored rings
     (override the monochrome selection rings) + solid colored badges for contrast. */
  :root { --atk: #d4452f; --blk: #3b7dd8; }
  .ac-card.atk .ac-frame { box-shadow: 0 0 0 3px var(--atk); border-color: var(--atk); }
  .ac-card.blk .ac-frame { box-shadow: 0 0 0 3px var(--blk); border-color: var(--blk); }
  .ac-card.atk.clickable:hover .ac-frame { box-shadow: 0 0 0 4px var(--atk); }
  .ac-card.blk.clickable:hover .ac-frame { box-shadow: 0 0 0 4px var(--blk); }
  .ac-card.atk .ac-badge { background: var(--atk); color: #fff; }
  .ac-card.blk .ac-badge { background: var(--blk); color: #fff; }

  /* ---- transient overlay (combat builder + mulligan bottoming) ----
     The backdrop only DIMS — it does not capture pointer events, so the board
     and hand behind stay clickable (click-to-declare attackers/blockers and
     bottoming selection are preserved). Only the floating control card itself is
     interactive, and it's anchored low so the board reads through the dim. */
  #overlay {
    position: fixed; inset: 0; z-index: 120; display: none; pointer-events: none;
    flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 18px 18px 22px; background: transparent; /* no dim — keep cards readable */
  }
  #overlay.show { display: flex; }
  .overlay-card {
    pointer-events: auto; max-width: min(760px, 94vw); max-height: 72vh; overflow-y: auto;
    background: var(--bg-offset); border: 1px solid var(--border-muted);
    border-radius: var(--radius-panel); box-shadow: var(--shadow-float); padding: 12px 16px;
  }
  /* networked-duel "waiting for opponent" pill */
  #netwait {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 120;
    display: flex; align-items: center; gap: 9px; padding: 7px 16px;
    background: var(--bg-offset); border: 1px solid var(--border); border-radius: 999px;
    box-shadow: var(--shadow-float); font-size: 13px; color: var(--text-muted);
  }
  #netwait[hidden] { display: none; }
  #netwait .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--link);
    animation: netwait-pulse 1.1s ease-in-out infinite;
  }
  @keyframes netwait-pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  /* visual library-search / tutor picker */
  #search-modal {
    position: fixed; inset: 0; z-index: 130; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: color-mix(in srgb, var(--bg) 82%, transparent);
  }
  #search-modal[hidden] { display: none; }
  .search-card {
    width: min(1100px, 96vw); max-height: 88vh; display: flex; flex-direction: column;
    background: var(--bg-offset); border: 1px solid var(--border); border-radius: var(--radius-panel);
    box-shadow: var(--shadow-float);
  }
  .search-head { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--border-muted); }
  .search-head b { font-family: var(--font-serif); font-size: 17px; }
  .search-head .spacer { flex: 1; }
  .search-grid { overflow-y: auto; padding: 16px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr)); gap: 12px; align-content: start; }
  .search-grid .pick { cursor: pointer; transition: transform var(--transition-fast); border-radius: 10px; }
  .search-grid .pick:hover { transform: translateY(-4px); }
  .search-grid .pick.match { box-shadow: 0 0 0 2px var(--link), 0 0 18px color-mix(in srgb, var(--link) 40%, transparent); border-radius: 10px; }
  .search-grid .pick.dim { opacity: .4; filter: grayscale(.5); cursor: default; }
  .search-grid .pick.dim:hover { transform: none; }
  #combat { display: none; }
  #combat.show { display: flex; flex-direction: column; }
  #combat .ctitle { font-family: var(--font-serif); font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  #combat .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; max-width: 70ch; }
  #combat .ctrls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  #combat .csec { border-top: 1px solid var(--border); padding: 6px 0; }
  #combat .csec-h { font-size: 13px; font-weight: 500; margin-bottom: 5px; }
  #combat .ord-row, #combat .dmg-row { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
  #combat .ord-num { width: 20px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  #combat .ord-nm, #combat .dmg-nm { flex: 1; }
  #combat .dmg-amt { min-width: 22px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  #combat .stepper { padding: 1px 9px; font-size: 14px; line-height: 1.4; }
  #combat .dmg-status { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  #combat .dmg-status.bad { color: var(--text); font-weight: 500; }

  /* ---- actions panel ---- */
  .agroup { margin-bottom: 8px; }
  .agroup .gl { margin-bottom: 4px; }
  .agroup .btns, .control-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .control-row { margin-top: 6px; }

  body.busy #actions, body.busy #combat, body.busy .player { pointer-events: none; opacity: .7; }

  /* ---- light tap pulse ---- */
  @keyframes ac-pulse { 0% { box-shadow: 0 0 0 0 var(--text-muted); } 100% { box-shadow: 0 0 0 6px transparent; } }
  .ac-card.just-entered .ac-frame { animation: ac-pulse var(--transition-slow) ease-out; }
  @media (prefers-reduced-motion: reduce) { .ac-card.just-entered .ac-frame { animation: none; } }
</style>

      <button class="skipctl" data-until="end_of_turn" title="Pass until end of turn (E): auto-pass up to this turn's end step (declares no attackers on the way when legal). Stops early if anything hits the stack.">End<span class="kbd">E</span></button>
      <button class="skipctl" data-until="my_next_turn" title="Pass until your next turn (N): auto-pass through the rest of this turn and the opponent's. Stops early if anything hits the stack or you must block.">Turn<span class="kbd">N</span></button>
    </span>
    <button id="fullctl" title="Full control (F): stop at EVERY priority window — hold up mana, bluff, or act at an unusual window. Off = smart auto-pass through windows where you have no play.">Full control<span class="kbd">F</span></button>
    <a href="/deck">Deckbuilder →</a>

  <div id="banner"></div>

  <!-- The dockable workspace: a 3-column dock row (left / center / right),
       separated by draggable dividers. Panels are injected by the registry. -->

  <!-- Targeting / combat arrows are drawn here, above the board, below modals. -->

    <marker id="ah-tgt" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#caa45a"/></marker>
  </defs><g id="arrow-layer"></g></svg>

  <!-- Transient combat / mulligan UI floats here (does not reflow the dock). -->
