<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcana — Analyst Cockpit</title>
<!-- apply the persisted theme before paint to avoid a flash -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem("arcana.theme")||"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
<link rel="stylesheet" href="/theme.css" />
<style>
  /* =========================================================================
     ANALYST COCKPIT — a fixed-viewport, dockable panel workspace.

     The page NEVER scrolls (100dvh). A top bar sits above a workspace made of a
     three-column dock row (left / center / right) plus a full-width bottom dock,
     separated by draggable dividers. Each region holds one-or-more PANELS from a
     registry; every panel has a header with a collapse toggle, can be hidden via
     the Panels menu, and the full layout (sizes / collapsed / hidden) persists to
     localStorage. Panels scroll INTERNALLY; the board's cards are height-driven
     so they stay legible (analysis framing, not a maximized table).
     ========================================================================= */
  html, body { height: 100%; }
  body { height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    padding: 0 var(--page-padding); gap: 6px; }

  /* CSS-var-driven dock sizes (mutated by the resizers, persisted to storage). */
  :root { --dock-left: 240px; --dock-right: 290px; }

  /* ---- top bar ---- */
  .topbar {
    flex: 0 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 8px 0; background: var(--bg-nav); border-bottom: 1px solid var(--border);
  }
  .topbar .spacer { flex: 1; }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand .mark { font-family: var(--font-serif); font-weight: 600; font-size: 19px; letter-spacing: .01em; }
  .brand .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-faint); }
  .phasebar {
    display: flex; align-items: baseline; gap: 12px;
    padding: 5px 14px; border: 1px solid var(--border); border-left: 3px solid var(--border);
    border-radius: var(--radius-panel); background: var(--bg-offset);
  }
  .phasebar.you-turn { border-left-color: var(--text); }
  .phasebar .turn { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 13px; }
  .phasebar .step { font-family: var(--font-serif); font-weight: 600; font-size: 17px; color: var(--text); }
  .phasebar .who { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .phasebar .who.you { color: var(--text); }
  .phasebar .who.opp { color: var(--text-faint); }

  /* ---- Panels menu (show/hide + reset) ---- */
  .menu-wrap { position: relative; }
  .menu-pop {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 140; min-width: 190px;
    display: none; padding: 6px; background: var(--bg-nav);
    border: 1px solid var(--border-muted); border-radius: var(--radius-panel);
    box-shadow: var(--shadow-float);
  }
  .menu-pop.show { display: block; }
  .menu-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 13px;
    cursor: pointer; border-radius: var(--radius-control);
  }
  .menu-item:hover { background: var(--bg-offset); }
  .menu-item input { width: auto; padding: 0; margin: 0; }
  .menu-sep { height: 1px; background: var(--border); margin: 6px 2px; }

  #banner {
    flex: 0 0 auto; display: none; padding: 8px 14px; border: 1px solid var(--border-muted);
    border-radius: var(--radius-panel); background: var(--bg-offset);
    font-family: var(--font-serif); font-weight: 600; font-size: 16px;
  }

  /* ---- workspace + docks ---- */
  #workspace { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #docks-row { flex: 1 1 auto; min-height: 0; display: flex; }
  .dock { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; overflow: hidden; }
  #dock-left  { width: var(--dock-left);  flex: 0 0 auto; }
  #dock-right { width: var(--dock-right); flex: 0 0 auto; }
  #dock-center { flex: 1 1 auto; min-width: 260px; }

  /* draggable dividers (vertical only — left/right column resize) */
  .divider { flex: 0 0 auto; background: transparent; transition: background var(--transition-fast); }
  .divider-v { width: 7px; cursor: col-resize; }
  .divider:hover, .divider.dragging { background: var(--border-muted); }

  /* ---- panel chrome ---- */
  .panel {
    display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-panel); background: var(--bg-offset);
  }
  .panel.grow { flex: 1 1 0; }
  .panel:not(.grow) { flex: 0 0 auto; }
  .panel.collapsed { flex: 0 0 auto; }
  .panel.collapsed .panel-body { display: none; }
  .panel.hidden { display: none; }
  .panel-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 8px;
    border-bottom: 1px solid var(--border); background: var(--bg-nav);
  }
  .panel-head .ptitle-text {
    flex: 1; font-family: var(--font-sans); font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint);
  }
  .panel-head .pcollapse {
    border: none; background: transparent; padding: 0 4px; font-size: 11px; line-height: 1;
    color: var(--text-faint); cursor: pointer;
  }
  .panel-head .pcollapse:hover { color: var(--text); background: transparent; }
  .panel-body {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    overflow: auto; padding: 6px 8px;
  }
  /* card-bearing bodies don't scroll the page — their card rows scale to fit */
  .body-board, .body-hand, .body-stack { overflow: hidden; padding: 6px; }
  .body-hand { height: clamp(120px, 18vh, 210px); }
  .body-actions { max-height: 24vh; overflow: auto; }

  /* ---- board panel ---- */
  .board { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .player {
    flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-panel);
    padding: 4px 12px 6px; background: var(--bg);
  }
  .player.you { border-color: var(--border-muted); }
  .ptitle { flex: 0 0 auto; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 2px; }
  .ptitle .who { font-family: var(--font-sans); font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  .ptitle .life { font-family: var(--font-serif); font-weight: 600; font-size: 22px;
    font-variant-numeric: tabular-nums; line-height: 1; }
  .ptitle .life .unit { font-size: 11px; color: var(--text-faint); font-weight: 400; margin-left: 3px; }
  .ptitle .gauge { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  .ptitle .gauge .gpip { display: inline-flex; align-items: center; gap: 1px; font-variant-numeric: tabular-nums; }
  .ptitle .gauge .floating { color: var(--text-faint); }
  .ptitle .counts { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; }
  .ptitle .spacer { flex: 1; }

  /* the battlefield: lands (left) + permanents (right) as side-by-side COLUMNS,
     so a player band is ONE card tall (not two stacked rows) → cards fill the
     full band height. Each column's width is set ∝ its card count (in JS) so
     every card gets ~equal width; an empty column is hidden so the populated one
     spans the whole band. */
  .lands-creatures { flex: 1; min-height: 0; display: flex; flex-direction: row; gap: 12px; }
  .zone { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .zone.collapsed { display: none; }     /* empty column yields its width */
  .zone-head { flex: 0 0 auto; margin: 0 0 2px; }
  .zone-head.toggle { display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer; width: fit-content; }
  .zone-head .zone-toggle { font-size: 10px; color: var(--text-faint); text-transform: none; letter-spacing: 0; }
  .zone-head.toggle:hover .zone-toggle { color: var(--text-muted); }

  /* collapsed lands: a VERTICAL chip column, sized to content + pinned left so
     lands stay confined to a narrow left strip; scrolls if tall. */
  .landstrip { flex: 0 0 auto; min-width: 0; }
  .landstrip .land-chips { flex: 1; min-height: 0; display: flex; flex-direction: column;
    flex-wrap: nowrap; gap: 4px; overflow-y: auto; padding-top: 2px; }
  .land-chip {
    display: flex; align-items: baseline; gap: 8px; justify-content: space-between;
    min-width: 116px; max-width: 220px;
    font-family: var(--font-sans); font-size: 12px; line-height: 1.4;
    padding: 3px 8px; border: 1px solid var(--border); border-radius: var(--radius-control);
    color: var(--text); background: var(--bg); font-variant-numeric: tabular-nums;
  }
  .land-chip .lc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .land-chip .lc-n {
    flex: 0 0 auto; font-size: 10px; padding: 0 5px; border-radius: 999px;
    background: var(--bg-offset); color: var(--text-muted); border: 1px solid var(--border-muted);
  }
  .land-chip .lc-pips { flex: 0 0 auto; font-size: 9px; letter-spacing: 1px; line-height: 1; }
  .land-chip .lc-pips .on { color: var(--text); }
  .land-chip .lc-pips .off { color: var(--text-faint); }
  .land-chip.tapped { color: var(--text-faint); border-color: var(--border-muted); font-style: italic; }
  .land-chip.clickable { cursor: pointer; }
  .land-chip.clickable:hover { background: var(--bg-offset); border-color: var(--text-muted); }

  /* height-driven card rows: cards fill the row height + scale with the viewport;
     too many cards scroll horizontally (the page itself never scrolls). */
  .cards { display: flex; gap: 8px; align-items: flex-end; }
  .cards.fit { flex: 1; min-height: 0; height: 100%; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
  .cards.fit .ac-card { height: 100%; width: auto; aspect-ratio: 488 / 680; flex: 0 0 auto; }
  .cards.fit .ac-card .ac-frame { width: 100%; height: 100%; left: 0; top: 0; }
  /* tapped: stay in the portrait slot, rotate + scale to fit (no overlap) */
  .cards.fit .ac-card.tapped { width: auto; height: 100%; aspect-ratio: 488 / 680; }
  .cards.fit .ac-card.tapped .ac-frame { left: 0; top: 0; transform: rotate(90deg) scale(.7); }

  /* The HAND is a single content-height row (it lives in the content-sized Play
     strip, not a flex-filled panel), so its cards get an explicit comfortable
     height. The BATTLEFIELD stays height-driven (fills the now-large board,
     never overflows → never cut off). Scoped by row class so they don't clash. */
  :root { --hand-card-h: clamp(150px, 20vh, 224px); }
  .cards.hand.fit { flex: 0 0 auto; height: auto; align-items: flex-start; }
  .cards.hand.fit .ac-card { height: var(--hand-card-h); }
  .cards.hand.fit .ac-card.tapped { height: var(--hand-card-h); }

  /* Forge-style pile: identical cards collapse to one tile with a ×N count badge
     and the right edges of the cards behind fanned out. Horizontal-only offset
     (the row clips vertically); margin keeps the fan clear of the next pile. */
  .cards.battlefield.fit .ac-card.stacked { margin-right: 14px; }
  .ac-card.stacked::before, .ac-card.stacked::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
    border-radius: 5px; background: var(--bg-offset); box-shadow: 0 0 0 1px var(--border-muted);
  }
  .ac-card.stacked::before { transform: translateX(5px); }
  .ac-card.stacked::after  { transform: translateX(10px); }

  .empty { color: var(--text-faint); font-size: 12px; font-style: italic; font-family: var(--font-serif); padding: 2px 0; }

  /* ---- consolidated player HUD (vitals on one line) ---- */
  .phud {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 2px 2px 4px; font-family: var(--font-sans); font-size: 12px; color: var(--text-muted);
  }
  .phud .who { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  .phud .life { font-family: var(--font-serif); font-weight: 600; font-size: 20px; color: var(--text);
    font-variant-numeric: tabular-nums; line-height: 1; }
  .phud .life .unit { font-size: 10px; color: var(--text-faint); font-weight: 400; margin-left: 3px; }
  .phud .gauge { display: flex; align-items: center; gap: 8px; }
  .phud .gauge .gpip { display: inline-flex; align-items: center; gap: 1px; font-variant-numeric: tabular-nums; }
  .phud .gauge .floating { color: var(--text-faint); }
  .phud .spacer { flex: 1; }
  .phud .counts { display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
  .phud.opp { border-bottom: 1px solid var(--border); margin-bottom: 2px; }

  /* ---- Play strip: your HUD + hand + minimal action controls ---- */
  .body-play { display: flex; flex-direction: column; gap: 4px; }
  #handzone { flex: 0 0 auto; display: flex; flex-direction: column; }
  #actions { flex: 0 0 auto; }

  /* ---- stack / log panels ---- */
  #stack { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; }
  #log { flex: 1; min-height: 0; font-size: 12px; overflow-y: auto; }
  #log .ln { line-height: 1.4; padding: 1px 0 1px 8px; border-left: 2px solid transparent; }
  #log .you { color: var(--text); border-left-color: var(--blk); }
  #log .opp { color: var(--text-muted); border-left-color: var(--atk); }
  #log .sys { color: var(--text-faint); font-style: italic; }

  /* ---- Eval panel (chess-style bar) ---- */
  .evalwrap { display: flex; flex-direction: column; gap: 6px; }
  .evalends { display: flex; justify-content: space-between; font-size: 10px;
    text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); }
  .evalbar {
    position: relative; height: 22px; border: 1px solid var(--border);
    border-radius: var(--radius-control); background: var(--bg); overflow: hidden;
  }
  .evalbar-you { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text);
    transition: width var(--transition-medium); }
  @media (prefers-reduced-motion: reduce) { .evalbar-you { transition: none; } }
  .evalbar-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-muted); }
  .evalrow { display: flex; align-items: baseline; gap: 6px; }
  .evalwin { font-family: var(--font-serif); font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
  .evalwin-lbl { font-size: 11px; color: var(--text-faint); }
  .evalmeta { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* ---- Draw-odds panel ---- */
  .draw-total { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .draw-total b { color: var(--text); font-variant-numeric: tabular-nums; }
  .draw-sec { margin-bottom: 10px; }
  .draw-sec-h { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-faint); margin-bottom: 4px; }
  .draw-types { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; }
  .draw-types span b { font-variant-numeric: tabular-nums; }
  .draw-cmc-row { display: flex; align-items: center; gap: 6px; font-size: 11px; margin: 2px 0; }
  .draw-cmc-lbl { width: 26px; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .draw-cmc-track { flex: 1; min-width: 0; }
  .draw-cmc-bar { height: 10px; background: var(--text-muted); border-radius: 2px; min-width: 1px; }
  .draw-cmc-cnt { color: var(--text-faint); font-variant-numeric: tabular-nums; width: 22px; }
  .draw-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .draw-controls input { width: 58px; padding: 3px 6px; font-variant-numeric: tabular-nums; }
  .draw-odds-row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; padding: 1px 4px; border-radius: var(--radius-control); }
  .draw-odds-row.clickable { cursor: pointer; }
  .draw-odds-row.clickable:hover { background: var(--bg-offset); }
  .draw-odds-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .draw-odds-k { color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .draw-odds-p { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; font-weight: 500; }

  /* ---- Suggested-lines panel ---- */
  #suggestpanel { display: flex; flex-direction: column; gap: 4px; min-height: 0; height: 100%; overflow-y: auto; }
  .sg-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .sg-status { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); }
  .sg-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 4px;
    border: 1px solid transparent; border-radius: var(--radius-control);
  }
  .sg-row.clickable { cursor: pointer; }
  .sg-row.clickable:hover { background: var(--bg-offset); border-color: var(--border-muted); }
  .sg-best { border-color: var(--border-muted); }
  .sg-meter { flex: 0 0 44px; height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
  .sg-fill { height: 100%; background: var(--text-muted); }
  .sg-best .sg-fill { background: var(--text); }
  .sg-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .sg-pct { flex: 0 0 auto; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .sg-delta { flex: 0 0 30px; text-align: right; font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  /* ---- Card-power panel ---- */
  #powerpanel { display: flex; flex-direction: column; gap: 3px; min-height: 0; max-height: 100%; overflow-y: auto; }
  .cp-row { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border: 1px solid transparent; border-radius: var(--radius-control); }
  .cp-row.clickable { cursor: pointer; }
  .cp-row.clickable:hover { background: var(--bg-offset); border-color: var(--border-muted); }
  .cp-meter { flex: 0 0 44px; height: 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
  .cp-fill { height: 100%; background: var(--text-muted); }
  .cp-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .cp-pct { flex: 0 0 auto; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-muted); }

  /* ---- deferred panel slots (registry placeholders) ---- */
  .deferred-note { font-size: 12px; font-style: italic; font-family: var(--font-serif); color: var(--text-faint); }

  /* ---- card-driven actions: hint + multi-ability chooser popup ---- */
  .action-hint { margin: 2px 0 4px; }
  .action-menu {
    position: fixed; z-index: 140; display: flex; flex-direction: column; gap: 2px;
    background: var(--bg-offset); border: 1px solid var(--border-muted);
    border-radius: var(--radius-control); box-shadow: var(--shadow-float); padding: 4px;
  }
  .action-menu button { text-align: left; white-space: nowrap; }

  /* combat highlight: red = attacking, blue = blocking — semantic colored rings
     (override the monochrome selection rings) + solid colored badges for contrast. */
  :root { --atk: #d4452f; --blk: #3b7dd8; }
  .ac-card.atk .ac-frame { box-shadow: 0 0 0 3px var(--atk); border-color: var(--atk); }
  .ac-card.blk .ac-frame { box-shadow: 0 0 0 3px var(--blk); border-color: var(--blk); }
  .ac-card.atk.clickable:hover .ac-frame { box-shadow: 0 0 0 4px var(--atk); }
  .ac-card.blk.clickable:hover .ac-frame { box-shadow: 0 0 0 4px var(--blk); }
  .ac-card.atk .ac-badge { background: var(--atk); color: #fff; }
  .ac-card.blk .ac-badge { background: var(--blk); color: #fff; }

  /* ---- transient overlay (combat builder + mulligan bottoming) ----
     The backdrop only DIMS — it does not capture pointer events, so the board
     and hand behind stay clickable (click-to-declare attackers/blockers and
     bottoming selection are preserved). Only the floating control card itself is
     interactive, and it's anchored low so the board reads through the dim. */
  #overlay {
    position: fixed; inset: 0; z-index: 120; display: none; pointer-events: none;
    flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 18px 18px 22px; background: transparent; /* no dim — keep cards readable */
  }
  #overlay.show { display: flex; }
  .overlay-card {
    pointer-events: auto; max-width: min(760px, 94vw); max-height: 72vh; overflow-y: auto;
    background: var(--bg-offset); border: 1px solid var(--border-muted);
    border-radius: var(--radius-panel); box-shadow: var(--shadow-float); padding: 12px 16px;
  }
  #combat { display: none; }
  #combat.show { display: flex; flex-direction: column; }
  #combat .ctitle { font-family: var(--font-serif); font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  #combat .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; max-width: 70ch; }
  #combat .ctrls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  #combat .csec { border-top: 1px solid var(--border); padding: 6px 0; }
  #combat .csec-h { font-size: 13px; font-weight: 500; margin-bottom: 5px; }
  #combat .ord-row, #combat .dmg-row { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
  #combat .ord-num { width: 20px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  #combat .ord-nm, #combat .dmg-nm { flex: 1; }
  #combat .dmg-amt { min-width: 22px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  #combat .stepper { padding: 1px 9px; font-size: 14px; line-height: 1.4; }
  #combat .dmg-status { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  #combat .dmg-status.bad { color: var(--text); font-weight: 500; }

  /* ---- actions panel ---- */
  .agroup { margin-bottom: 8px; }
  .agroup .gl { margin-bottom: 4px; }
  .agroup .btns, .control-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .control-row { margin-top: 6px; }

  body.busy #actions, body.busy #combat, body.busy .player { pointer-events: none; opacity: .7; }

  /* ---- light tap pulse ---- */
  @keyframes ac-pulse { 0% { box-shadow: 0 0 0 0 var(--text-muted); } 100% { box-shadow: 0 0 0 6px transparent; } }
  .ac-card.just-entered .ac-frame { animation: ac-pulse var(--transition-slow) ease-out; }
  @media (prefers-reduced-motion: reduce) { .ac-card.just-entered .ac-frame { animation: none; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">Arcana</span><span class="sub">cockpit</span></div>
    <div class="phasebar" id="phase"></div>
    <div class="spacer"></div>
    <a href="/deck">Deckbuilder →</a>
    <div class="menu-wrap" id="panels-menu">
      <button id="panelsbtn" class="ghost">Panels ▾</button>
      <div class="menu-pop" id="panels-pop"></div>
    </div>
    <button id="refresh" class="ghost">Refresh</button>
    <button id="new">New game</button>
    <span id="themeslot"></span>
  </header>

  <div id="banner"></div>

  <!-- The dockable workspace: a 3-column dock row (left / center / right),
       separated by draggable dividers. Panels are injected by the registry. -->
  <div id="workspace">
    <div id="docks-row">
      <div class="dock" id="dock-left"></div>
      <div class="divider divider-v" data-resize="left"></div>
      <div class="dock" id="dock-center"></div>
      <div class="divider divider-v" data-resize="right"></div>
      <div class="dock" id="dock-right"></div>
    </div>
  </div>

  <!-- Transient combat / mulligan UI floats here (does not reflow the dock). -->
  <div id="overlay"><div class="overlay-card"><div id="combat"></div></div></div>

<script src="/app.js"></script>
<script>
"use strict";

// ----- module state --------------------------------------------------------
const G = {
  resp: null,
  log: [],             // running game log lines: {cls, text}
  cardById: new Map(), // id -> CardView (both battlefields), for combat display
  seenBf: new Set(),   // ids already seen on a battlefield (for enter-pulse)
  // combat selection (reset when the prompt identity changes)
  combatToken: null,
  atk: new Map(),      // attackerId -> defending entity object
  blk: new Map(),      // blockerId  -> attackerId
  pendingBlocker: null,
  order: new Map(),    // attackerId -> [blockerId,...] in chosen damage order
  damage: new Map(),   // attackerId -> Map(blockerId -> amount)
  bottomSel: new Set(),// mulligan: hand card ids selected to put on the bottom
  busy: false,
  // draw-odds panel: "next N draws" input + the last library snapshot (so the
  // input can recompute odds without re-fetching /state).
  drawN: 1,
  lastLib: null,
  // lands collapse to a compact mana strip by default; click to expand to cards.
  expandLands: false,
  // suggested-lines panel: ranked legal actions for the current decision.
  // token = position signature (so we fetch once per position); deep = whether
  // the heavier "deepen" budget was used; lines = the ranked Suggestion[].
  suggest: { token: null, deep: false, loading: false, lines: null },
};

// available-mana gauge: color key -> {pip class, symbol}
const MANA = {
  white: { cls: "w", sym: "W" }, blue: { cls: "u", sym: "U" }, black: { cls: "b", sym: "B" },
  red: { cls: "r", sym: "R" }, green: { cls: "g", sym: "G" }, colorless: { cls: "c", sym: "C" },
};

/* ===========================================================================
   COCKPIT: panel registry + dockable workspace + layout persistence.

   Each panel definition is { id, title, region, grow, defaultHidden?, build }.
   `build(bodyEl)` constructs the panel's stable inner DOM ONCE (containing the
   element IDs the game logic renders into, e.g. #opponent / #stack / #log), so
   the existing render functions keep working untouched — the cockpit only moves
   the containers around and adds the Eval + Draw-odds renderers.

   Adding a deferred panel later (Suggested lines, Card power) is just one more
   entry in this array. Full drag-to-redock is a noted follow-up; this pass gives
   resize + collapse + show/hide + persistence.
   ======================================================================== */
const PANELS = [
  { id: "eval",  title: "Eval",            region: "left",   grow: false, build: buildEvalPanel },
  { id: "stack", title: "Stack",           region: "left",   grow: false, build: buildStackPanel },
  { id: "log",   title: "Log",             region: "left",   grow: true,  build: buildLogPanel },
  { id: "board", title: "Board",           region: "center", grow: true,  build: buildBoardPanel },
  // Play strip: your vitals + hand + minimal controls. Most actions are
  // card-driven (click a hand card to play it, a permanent to activate it), so
  // the button list is just non-card choices + pass/concede.
  { id: "play",  title: "Play",            region: "center", grow: false, build: buildPlayPanel },
  { id: "suggested", title: "Suggested lines", region: "right", grow: true, build: buildSuggestPanel },
  { id: "power", title: "Card power",       region: "right",  grow: false, build: buildCardPowerPanel },
  { id: "draw",  title: "Draw odds",       region: "right",  grow: true,  build: buildDrawPanel },
];

const REGION_DOCK = { left: "dock-left", center: "dock-center", right: "dock-right" };

// ---- panel body builders (construct stable inner DOM once) ----
function buildEvalPanel(body) { body.innerHTML = '<div id="evalpanel" class="evalwrap"></div>'; }
function buildStackPanel(body) { body.innerHTML = '<div id="stack" class="cards stack fit"></div>'; }
function buildBoardPanel(body) {
  body.innerHTML =
    '<div class="board">' +
      '<div id="opphud" class="phud opp"></div>' +
      '<section id="opponent" class="player"></section>' +
      '<section id="you" class="player you"></section>' +
    "</div>";
}
// Play strip: your vitals (HUD) + hand + minimal action controls, consolidated.
function buildPlayPanel(body) {
  body.innerHTML =
    '<div id="youhud" class="phud you"></div>' +
    '<section id="handzone"></section>' +
    '<div id="actions"></div>';
}
function buildDrawPanel(body) { body.innerHTML = '<div id="drawpanel"></div>'; }
function buildSuggestPanel(body) { body.innerHTML = '<div id="suggestpanel"></div>'; }
function buildCardPowerPanel(body) { body.innerHTML = '<div id="powerpanel"></div>'; }
function buildLogPanel(body) { body.innerHTML = '<div id="log"></div>'; }
function buildDeferred(note) {
  return (body) => { const d = document.createElement("div"); d.className = "deferred-note"; d.textContent = note; body.appendChild(d); };
}

// ---- layout state + persistence ----
const LAYOUT_KEY = "arcana.cockpit.layout.v4"; // bumped: Card-power now a real, default-visible panel
let L = defaultLayout();

function defaultLayout() {
  const hidden = {};
  for (const p of PANELS) if (p.defaultHidden) hidden[p.id] = true;
  return { sizes: { left: 240, right: 290 }, collapsed: {}, hidden };
}
function loadLayout() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "null"); } catch (e) { saved = null; }
  const base = defaultLayout();
  if (!saved || typeof saved !== "object") return base;
  return {
    sizes: Object.assign(base.sizes, saved.sizes || {}),
    collapsed: Object.assign({}, saved.collapsed || {}),
    hidden: Object.assign({}, saved.hidden || base.hidden),
  };
}
function saveLayout() { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(L)); } catch (e) { /* ignore */ } }
function setVar(name, v) { document.documentElement.style.setProperty(name, typeof v === "number" ? v + "px" : v); }

// Build every panel into its dock (once). Inner element IDs become live.
function buildWorkspace() {
  for (const dockId of Object.values(REGION_DOCK)) document.getElementById(dockId).innerHTML = "";
  for (const p of PANELS) {
    const dock = document.getElementById(REGION_DOCK[p.region]);
    if (!dock) continue;
    const panel = document.createElement("section");
    panel.className = "panel" + (p.grow ? " grow" : "");
    panel.id = "panel-" + p.id;

    const head = document.createElement("header");
    head.className = "panel-head";
    const collapse = document.createElement("button");
    collapse.className = "pcollapse"; collapse.type = "button"; collapse.title = "Collapse / expand";
    collapse.textContent = "▾";
    collapse.onclick = () => toggleCollapse(p.id);
    const title = document.createElement("span");
    title.className = "ptitle-text"; title.textContent = p.title;
    head.append(collapse, title);

    const bodyEl = document.createElement("div");
    bodyEl.className = "panel-body body-" + p.id;
    p.build(bodyEl);

    panel.append(head, bodyEl);
    dock.appendChild(panel);
  }
}

// Reflect the layout state onto the DOM (sizes + collapsed + hidden).
function applyLayout() {
  setVar("--dock-left", L.sizes.left);
  setVar("--dock-right", L.sizes.right);
  for (const p of PANELS) {
    const el = document.getElementById("panel-" + p.id);
    if (!el) continue;
    el.classList.toggle("hidden", !!L.hidden[p.id]);
    el.classList.toggle("collapsed", !!L.collapsed[p.id]);
    const btn = el.querySelector(".pcollapse");
    if (btn) btn.textContent = L.collapsed[p.id] ? "▸" : "▾";
  }
}

function toggleCollapse(id) { L.collapsed[id] = !L.collapsed[id]; saveLayout(); applyLayout(); }
function togglePanel(id, visible) { L.hidden[id] = !visible; saveLayout(); applyLayout(); }
function resetLayout() { L = defaultLayout(); saveLayout(); applyLayout(); buildPanelsMenu(); }

// ---- Panels menu (show/hide checkboxes + reset) ----
function buildPanelsMenu() {
  const pop = document.getElementById("panels-pop");
  pop.innerHTML = "";
  for (const p of PANELS) {
    const item = document.createElement("label");
    item.className = "menu-item";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !L.hidden[p.id];
    cb.onchange = () => togglePanel(p.id, cb.checked);
    const span = document.createElement("span");
    span.textContent = p.title;
    item.append(cb, span);
    pop.appendChild(item);
  }
  const sep = document.createElement("div"); sep.className = "menu-sep"; pop.appendChild(sep);
  const reset = document.createElement("div");
  reset.className = "menu-item"; reset.textContent = "Reset layout";
  reset.onclick = resetLayout;
  pop.appendChild(reset);
}

// ---- divider drag-resize (pointer events; clamps + persists) ----
function initResizers() {
  for (const d of document.querySelectorAll(".divider")) {
    d.addEventListener("pointerdown", (e) => startResize(e, d, d.dataset.resize));
  }
}
function startResize(e, div, which) {
  e.preventDefault();
  div.setPointerCapture(e.pointerId);
  div.classList.add("dragging");
  const row = document.getElementById("docks-row").getBoundingClientRect();
  const move = (ev) => {
    if (which === "left") {
      let w = ev.clientX - row.left;
      w = Math.max(150, Math.min(w, row.width - 260 - L.sizes.right));
      L.sizes.left = Math.round(w); setVar("--dock-left", w);
    } else if (which === "right") {
      let w = row.right - ev.clientX;
      w = Math.max(170, Math.min(w, row.width - 260 - L.sizes.left));
      L.sizes.right = Math.round(w); setVar("--dock-right", w);
    }
  };
  const up = () => {
    div.releasePointerCapture(e.pointerId);
    div.classList.remove("dragging");
    div.removeEventListener("pointermove", move);
    div.removeEventListener("pointerup", up);
    saveLayout();
  };
  div.addEventListener("pointermove", move);
  div.addEventListener("pointerup", up);
}

/* ===========================================================================
   NEW PANELS: Eval (chess-style bar) + Draw odds (hypergeometric).
   ======================================================================== */
function favLabel(v) { return v > 0.02 ? "favors you" : (v < -0.02 ? "favors opponent" : "roughly even"); }

// Eval bar: fill proportional to value mapped from [-1,1] (your share of the
// bar), plus the heuristic win% and the raw value.
function renderEval(ev) {
  const el = document.getElementById("evalpanel");
  if (!el) return;
  ev = ev || { value: 0, win_pct: 50 };
  const v = Math.max(-1, Math.min(1, ev.value || 0));
  const youFrac = (v + 1) / 2;            // 0 (all opp) .. 1 (all you)
  const win = (ev.win_pct == null ? 50 : ev.win_pct);
  el.innerHTML =
    '<div class="evalends"><span>You</span><span>Opp</span></div>' +
    '<div class="evalbar" title="Material eval — your share of the bar">' +
      '<div class="evalbar-you" style="width:' + (youFrac * 100).toFixed(1) + '%"></div>' +
      '<div class="evalbar-mid"></div>' +
    "</div>" +
    '<div class="evalrow">' +
      '<span class="evalwin tnum">' + win.toFixed(0) + "%</span>" +
      '<span class="evalwin-lbl">est. win — heuristic</span>' +
    "</div>" +
    '<div class="evalmeta">value ' + (v >= 0 ? "+" : "") + v.toFixed(3) + " · " + favLabel(v) + "</div>";
}

// Hypergeometric P(at least one target in N draws), product form (no factorials):
//   P(none) = ∏_{i=0}^{N-1} (total - k - i) / (total - i)
//   P(≥1)   = 1 - P(none)
// where k = copies left of the target, total = library size. Once the
// non-target pool runs out (numerator ≤ 0) the draw is guaranteed → P = 1.
function pAtLeastOne(total, k, n) {
  if (total <= 0 || k <= 0 || n <= 0) return 0;
  n = Math.min(n, total);
  let pNone = 1;
  for (let i = 0; i < n; i++) {
    const num = total - k - i;
    if (num <= 0) return 1;
    pNone *= num / (total - i);
  }
  return 1 - pNone;
}

function renderDraw(lib) {
  const el = document.getElementById("drawpanel");
  if (!el) return;
  G.lastLib = lib = lib || { total: 0, by_type: [], by_cmc: [], by_name: [] };
  el.innerHTML = "";

  // total
  const tot = document.createElement("div");
  tot.className = "draw-total";
  tot.innerHTML = "Library: <b class=\"tnum\">" + lib.total + "</b> cards";
  el.appendChild(tot);

  // by type
  if (lib.by_type && lib.by_type.length) {
    const sec = document.createElement("div"); sec.className = "draw-sec";
    sec.innerHTML = '<div class="draw-sec-h">By type</div>';
    const row = document.createElement("div"); row.className = "draw-types";
    for (const [name, cnt] of lib.by_type) {
      const s = document.createElement("span");
      s.innerHTML = name + " <b class=\"tnum\">" + cnt + "</b>";
      row.appendChild(s);
    }
    sec.appendChild(row); el.appendChild(sec);
  }

  // by cmc (small bar chart)
  if (lib.by_cmc && lib.by_cmc.length) {
    const sec = document.createElement("div"); sec.className = "draw-sec";
    sec.innerHTML = '<div class="draw-sec-h">Mana curve</div>';
    const max = lib.by_cmc.reduce((m, [, c]) => Math.max(m, c), 1);
    for (const [cmc, cnt] of lib.by_cmc) {
      const r = document.createElement("div"); r.className = "draw-cmc-row";
      const lbl = document.createElement("span"); lbl.className = "draw-cmc-lbl"; lbl.textContent = cmc;
      const track = document.createElement("span"); track.className = "draw-cmc-track";
      const bar = document.createElement("div"); bar.className = "draw-cmc-bar";
      bar.style.width = Math.max(2, (cnt / max) * 100) + "%";
      track.appendChild(bar);
      const c = document.createElement("span"); c.className = "draw-cmc-cnt tnum"; c.textContent = cnt;
      r.append(lbl, track, c);
      sec.appendChild(r);
    }
    el.appendChild(sec);
  }

  // draw-odds controls + readout
  const oddsSec = document.createElement("div"); oddsSec.className = "draw-sec";
  oddsSec.innerHTML = '<div class="draw-sec-h">Draw odds — P(≥1) in next N draws</div>';
  const ctrls = document.createElement("div"); ctrls.className = "draw-controls";
  const lbl = document.createElement("span"); lbl.textContent = "Next draws (N):";
  const inp = document.createElement("input");
  inp.type = "number"; inp.min = "1"; inp.max = String(Math.max(1, lib.total)); inp.value = String(G.drawN);
  inp.oninput = () => {
    let n = parseInt(inp.value, 10);
    if (!Number.isFinite(n) || n < 1) n = 1;
    G.drawN = n;
    refreshOdds();
  };
  ctrls.append(lbl, inp);
  oddsSec.appendChild(ctrls);
  const odds = document.createElement("div"); odds.id = "draw-odds";
  oddsSec.appendChild(odds);
  el.appendChild(oddsSec);

  refreshOdds();
}

// Recompute the per-name odds for the current N (top names, by copies-left).
function refreshOdds() {
  const box = document.getElementById("draw-odds");
  if (!box) return;
  const lib = G.lastLib || { total: 0, by_name: [] };
  const n = G.drawN;
  box.innerHTML = "";
  if (!lib.total || !lib.by_name || !lib.by_name.length) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "(library empty)";
    box.appendChild(e);
    return;
  }
  for (const [name, k] of lib.by_name.slice(0, 16)) {
    const p = pAtLeastOne(lib.total, k, n);
    const row = document.createElement("div"); row.className = "draw-odds-row clickable";
    row.title = "Preview " + name;
    row.onclick = () => Arcana.Zoom.show({ name: name });
    const nm = document.createElement("span"); nm.className = "draw-odds-nm"; nm.textContent = name;
    const kc = document.createElement("span"); kc.className = "draw-odds-k tnum"; kc.textContent = "×" + k;
    const pc = document.createElement("span"); pc.className = "draw-odds-p tnum"; pc.textContent = (p * 100).toFixed(1) + "%";
    row.append(nm, kc, pc);
    box.appendChild(row);
  }
}

/* ===========================================================================
   SUGGESTED LINES panel — ranked legal actions from the value-MC backend
   (/suggest). Auto-runs once per position at a snappy budget; "Deepen" re-runs
   the same position at a heavier budget. Each row is click-to-play.
   ======================================================================== */
// Is the panel actually on screen (visible + not collapsed)? Don't burn a
// worker-side rollout if the user has hidden it.
function suggestVisible() {
  const el = document.getElementById("panel-suggested");
  return !!el && !el.classList.contains("hidden") && !el.classList.contains("collapsed");
}
// Position signature so we fetch once per decision (not on local re-renders).
function positionToken(view) {
  return view.turn + "/" + view.phase + "/" + view.priority_player + "/" +
    (view.legal || []).map((a) => a.label).join("|");
}
function clearSuggest() {
  G.suggest = { token: null, deep: false, loading: false, lines: null };
  renderSuggest();
}
// Fetch + adopt suggestions for token `tok`; ignore a stale reply if the
// position moved on while the worker was computing.
function fetchSuggest(deep, tok) {
  G.suggest = {
    token: tok, deep, loading: true,
    lines: G.suggest.token === tok ? G.suggest.lines : null,
  };
  renderSuggest();
  Arcana.Api.suggest(deep).then((lines) => {
    if (G.suggest.token !== tok) return;
    G.suggest = { token: tok, deep, loading: false, lines };
    renderSuggest();
  }).catch(() => {
    if (G.suggest.token !== tok) return;
    G.suggest.loading = false; G.suggest.lines = [];
    renderSuggest();
  });
}
// Auto-run when it's a real (≥2-way) human decision and the panel is visible.
function maybeAutoSuggest(view) {
  if (!suggestVisible()) return;
  const real = !view.game_over && (view.legal || []).length >= 2 &&
    !(G.resp && (G.resp.combat || G.resp.bottom != null));
  if (!real) { if (G.suggest.token !== null) clearSuggest(); return; }
  const tok = positionToken(view);
  if (tok === G.suggest.token && (G.suggest.lines || G.suggest.loading)) return;
  fetchSuggest(false, tok);
}
function renderSuggest() {
  const el = document.getElementById("suggestpanel");
  if (!el) return;
  const s = G.suggest;
  el.innerHTML = "";

  const bar = document.createElement("div"); bar.className = "sg-bar";
  const status = document.createElement("span"); status.className = "sg-status";
  status.textContent = s.loading ? "analyzing…" : (s.lines ? (s.deep ? "deepened" : "auto") : "idle");
  const deepen = document.createElement("button");
  deepen.textContent = s.loading && s.deep ? "deepening…" : "Deepen";
  deepen.disabled = s.loading || !s.token || s.deep;
  deepen.onclick = () => { if (s.token) fetchSuggest(true, s.token); };
  bar.append(status, deepen);
  el.appendChild(bar);

  if (!s.lines) {
    if (!s.loading) {
      const e = document.createElement("div"); e.className = "empty";
      e.textContent = "No suggestions — not your decision, or only one option.";
      el.appendChild(e);
    }
    return;
  }
  if (!s.lines.length) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "No lines to rank.";
    el.appendChild(e);
    return;
  }
  // Collapse identical labels (e.g. three "Play Mountain", one per copy in hand)
  // to one line — sorted, so the first kept is the best-scoring of its kind.
  const seen = new Set();
  const lines = s.lines.filter((l) => (seen.has(l.label) ? false : seen.add(l.label)));
  // delta baseline = the Pass line's win% (so each line reads "+N vs pass").
  const passLine = lines.find((l) => /^Pass/.test(l.label));
  const base = passLine ? passLine.win_pct : null;
  const best = lines[0].win_pct;
  for (const l of lines) {
    const row = document.createElement("div");
    row.className = "sg-row clickable" + (l.win_pct === best ? " sg-best" : "");
    row.title = "Apply: " + l.label;
    row.onclick = () => sendAction(l.index, l.label);
    const meter = document.createElement("div"); meter.className = "sg-meter";
    const fill = document.createElement("div"); fill.className = "sg-fill";
    fill.style.width = Math.max(2, Math.min(100, l.win_pct)) + "%";
    meter.appendChild(fill);
    const name = document.createElement("span"); name.className = "sg-label"; name.textContent = l.label;
    const pct = document.createElement("span"); pct.className = "sg-pct tnum"; pct.textContent = l.win_pct.toFixed(0) + "%";
    const delta = document.createElement("span"); delta.className = "sg-delta tnum";
    if (base != null) { const d = l.win_pct - base; delta.textContent = (d >= 0 ? "+" : "") + d.toFixed(0); }
    row.append(meter, name, pct, delta);
    el.appendChild(row);
  }
}

/* ===========================================================================
   CARD POWER panel — each of your permanents' marginal win% in this position
   (from /state's card_power, computed by arcana_ai::search::card_marginal_values).
   Names resolve from the live board (G.cardById); click a row to zoom the card.
   ======================================================================== */
function renderCardPower() {
  const el = document.getElementById("powerpanel");
  if (!el) return;
  el.innerHTML = "";
  const cp = (G.resp && G.resp.card_power) || [];
  if (!cp.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = "No permanents to rank.";
    el.appendChild(e);
    return;
  }
  const max = cp.reduce((m, c) => Math.max(m, c.win_pct), 0.0001);
  for (const c of cp) {
    const card = G.cardById.get(c.id);
    const row = document.createElement("div");
    row.className = "cp-row" + (card ? " clickable" : "");
    if (card) { row.title = "Zoom " + card.name; row.onclick = () => Arcana.Zoom.show(card); }
    const meter = document.createElement("div"); meter.className = "cp-meter";
    const fill = document.createElement("div"); fill.className = "cp-fill";
    fill.style.width = Math.max(2, (c.win_pct / max) * 100) + "%";
    meter.appendChild(fill);
    const nm = document.createElement("span"); nm.className = "cp-label";
    nm.textContent = card ? card.name : "#" + c.id;
    const pct = document.createElement("span"); pct.className = "cp-pct tnum";
    pct.textContent = "+" + c.win_pct.toFixed(1) + "%";
    row.append(meter, nm, pct);
    el.appendChild(row);
  }
}

// ----- card tiles (built on the shared component) --------------------------
// decorate hand cards: playable ones are click-to-play (server auto-taps + casts/
// plays, or floats mana and surfaces variants). Dim the rest. During a mulligan
// bottoming, hand clicks instead toggle bottom-selection.
function handDecor(c) {
  if (G.resp && G.resp.bottom != null) {
    const sel = G.bottomSel.has(c.id);
    return {
      classes: sel ? ["selected"] : ["selectable"],
      badge: sel ? "↓ bottom" : "keep",
      onClick: () => { if (sel) G.bottomSel.delete(c.id); else G.bottomSel.add(c.id); renderAll(); },
    };
  }
  if (c.playable) return { classes: ["selectable"], onClick: () => sendAutoTap(c.id, c.name) };
  return { classes: ["dim"] };
}

// available colored mana + floating + untapped-land tally, as a small gauge.
function manaGaugeHtml(p) {
  const a = p.available_mana || { total: 0 };
  let pips = "";
  for (const k of ["white", "blue", "black", "red", "green", "colorless"]) {
    if (a[k]) pips += '<span class="gpip">' + a[k] + Arcana.manaSymbolHtml(MANA[k].sym) + "</span>";
  }
  let s = a.total ? pips : '<span class="floating">no mana</span>';
  if (p.mana_pool) s += ' <span class="floating">(' + p.mana_pool + " floating)</span>";
  const lands = p.battlefield.filter((c) => c.is_land);
  const untapped = lands.filter((c) => !c.tapped).length;
  if (lands.length) s += ' <span class="floating tnum">· ' + untapped + "/" + lands.length + " lands</span>";
  return s;
}

// Render a card row. When `stackKey` is given, identical cards (same signature)
// collapse into a single Forge-style pile — one representative card with a "×N"
// count badge and a fanned stacked visual — saving space (especially lands).
// The pile's click acts on the representative; pass null to disable (e.g. during
// combat, when every creature must stay individually interactive).
function renderCards(container, cards, emptyMsg, decorate, stackKey) {
  container.innerHTML = "";
  if (!cards || cards.length === 0) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = emptyMsg || "(empty)";
    container.appendChild(e);
    return;
  }
  let items;
  if (stackKey) {
    const groups = new Map();
    for (const c of cards) {
      const k = stackKey(c);
      if (groups.has(k)) groups.get(k).push(c); else groups.set(k, [c]);
    }
    items = [...groups.values()].map((g) => ({ rep: g[0], n: g.length }));
  } else {
    items = cards.map((c) => ({ rep: c, n: 1 }));
  }
  for (const it of items) {
    const decor = decorate ? decorate(it.rep) : {};
    if (it.n > 1) decor.count = "×" + it.n;
    const el = Arcana.renderCard(it.rep, decor);
    if (it.n > 1) el.classList.add("stacked");
    if (decor && decor.pulse) el.classList.add("just-entered");
    container.appendChild(el);
  }
}

// Stack signature for battlefield cards: identical cards (same name, tapped
// state, and live P/T) pile together. tapped is in the key so tapped vs untapped
// lands stay distinct piles (you can see how many are still untapped).
function bfSig(c) {
  return [c.name, c.tapped ? "T" : "U", c.power, c.toughness].join("|");
}

// ----- combat helpers ------------------------------------------------------
function combatMaps() {
  const cb = G.resp && G.resp.combat;
  if (!cb) return null;
  const base = { mode: cb.kind, atkOpts: new Map(), blkOpts: new Map(),
                 incoming: new Set(), hiAtk: new Set(), hiBlk: new Set() };
  if (cb.kind === "attackers") {
    for (const o of cb.attackers) base.atkOpts.set(o.id, o.defenders);
  } else if (cb.kind === "blockers") {
    for (const o of cb.blockers) base.blkOpts.set(o.id, o.can_block);
    base.incoming = new Set(cb.incoming);
  } else {
    const groups = cb.kind === "orderblockers" ? cb.orderings : cb.damage;
    for (const g of groups) {
      base.hiAtk.add(g.attacker);
      for (const b of (g.blockers || g.targets)) base.hiBlk.add(b);
    }
  }
  return base;
}

// Does this object have any role in the current combat (so it must show as a
// clickable card rather than collapse into the land strip)?
function landCombatRole(id, cm) {
  if (!cm) return false;
  return cm.atkOpts.has(id) || cm.blkOpts.has(id) || cm.incoming.has(id) ||
         cm.hiAtk.has(id) || cm.hiBlk.has(id);
}

function combatTokenOf(cb) {
  if (!cb) return null;
  let ids;
  if (cb.kind === "attackers") ids = cb.attackers.map((o) => o.id);
  else if (cb.kind === "blockers") ids = cb.blockers.map((o) => o.id);
  else if (cb.kind === "orderblockers") ids = cb.orderings.map((o) => o.attacker);
  else ids = cb.damage.map((o) => o.attacker);
  return cb.kind + ":" + ids.slice().sort((a, b) => a - b).join(",");
}

function describeDefender(d) {
  if (d.Player !== undefined) return "P" + d.Player;
  const id = d.Planeswalker !== undefined ? d.Planeswalker : d.Battle;
  const c = G.cardById.get(id);
  return c ? c.name : ("#" + id);
}

function toggleAttacker(id, defenders) {
  if (defenders.length <= 1) {
    if (G.atk.has(id)) G.atk.delete(id); else G.atk.set(id, defenders[0]);
  } else if (!G.atk.has(id)) {
    G.atk.set(id, defenders[0]);
  } else {
    const cur = JSON.stringify(G.atk.get(id));
    const i = defenders.findIndex((d) => JSON.stringify(d) === cur);
    if (i >= 0 && i < defenders.length - 1) G.atk.set(id, defenders[i + 1]);
    else G.atk.delete(id);
  }
  renderAll();
}

function clickBlocker(id) {
  if (G.blk.has(id)) { G.blk.delete(id); G.pendingBlocker = null; }
  else { G.pendingBlocker = (G.pendingBlocker === id) ? null : id; }
  renderAll();
}

function clickAttacker(attackerId, blkOpts) {
  if (G.pendingBlocker === null) return;
  const can = blkOpts.get(G.pendingBlocker) || [];
  if (!can.includes(attackerId)) return;
  G.blk.set(G.pendingBlocker, attackerId);
  G.pendingBlocker = null;
  renderAll();
}

async function confirmAttackers() {
  const attackers = [];
  for (const [id, defending] of G.atk) attackers.push({ attacker: id, defending });
  logLine("you", attackers.length
    ? "Attack with " + attackers.length + " creature" + (attackers.length > 1 ? "s" : "")
    : "Declare no attackers");
  await postCombat({ kind: "attackers", attackers });
}

async function confirmBlockers() {
  const blockers = [];
  for (const [blocker, blocking] of G.blk) blockers.push({ blocker, blocking });
  logLine("you", blockers.length
    ? "Block with " + blockers.length + " creature" + (blockers.length > 1 ? "s" : "")
    : "Declare no blockers");
  await postCombat({ kind: "blockers", blockers });
}

// ----- rendering -----------------------------------------------------------
function prettyPhase(view) { return (view.phase || "").replace("/", " · "); }

// Compact one-line vitals (life / mana / counts) — opponent's at the board top,
// yours in the Play strip. Replaces the old per-player board header.
function renderHud(el, p, isYou) {
  if (!el) return;
  el.innerHTML =
    '<span class="who">' + (isYou ? "You" : "Opponent") + " · P" + p.id + "</span>" +
    '<span class="life tnum">' + p.life + '<span class="unit">life</span></span>' +
    '<span class="gauge">' + manaGaugeHtml(p) + "</span>" +
    '<span class="spacer"></span>' +
    '<span class="counts">' +
      '<span>hand <b class="tnum">' + p.hand_count + "</b></span>" +
      '<span>library <b class="tnum">' + p.library_count + "</b></span>" +
      '<span>graveyard <b class="tnum">' + p.graveyard_count + "</b></span>" +
    "</span>";
}

// The battlefield only — no header (vitals live in the HUD). Cards stay
// height-driven so the (now-large) board never overflows / cuts cards off.
// Lands (left) collapse to a compact mana strip by default (the HUD already
// shows available mana); creatures/permanents (right) stay as cards.
function renderBattlefield(container, p, isYou, cm) {
  container.innerHTML = "";
  const lands = p.battlefield.filter((c) => c.is_land);
  const others = p.battlefield.filter((c) => !c.is_land);
  const grid = document.createElement("div");
  grid.className = "lands-creatures";
  const inCombat = !!(cm && cm.mode);
  // Stack duplicates at rest; show every creature individually during combat.
  const stackKey = inCombat ? null : bfSig;

  // a column header label, optionally with a click toggle (lands collapse/expand)
  const mkHead = (text, onToggle, toggleText) => {
    const h = document.createElement("div");
    h.className = "meta-label zone-head"; h.textContent = text;
    if (onToggle) {
      h.classList.add("toggle");
      const t = document.createElement("span");
      t.className = "zone-toggle"; t.textContent = toggleText;
      h.appendChild(t);
      h.onclick = onToggle;
    }
    return h;
  };
  // a card column: width ∝ pile count; empty collapses so the other spans the band.
  const mkCardZone = (head, cards, empty) => {
    const z = document.createElement("div");
    z.className = "zone" + (cards.length ? "" : " collapsed");
    const slots = stackKey ? new Set(cards.map(stackKey)).size : cards.length;
    z.style.flexGrow = String(Math.max(1, slots));
    z.appendChild(head);
    const row = document.createElement("div");
    row.className = "cards battlefield fit";
    renderCards(row, cards, empty, (c) => bfDecor(c, isYou, cm), stackKey);
    z.appendChild(row);
    return z;
  };

  // Lands (left): collapsed compact strip by default; expand to cards. Stays
  // collapsed during combat too — only force the card view if a LAND itself has
  // a combat role (e.g. an animated man-land attacking/blocking), so it stays
  // clickable.
  const toggleLands = () => { G.expandLands = !G.expandLands; renderAll(); };
  const landNeedsCards = inCombat && lands.some((c) => landCombatRole(c.id, cm));
  const showLandCards = G.expandLands || landNeedsCards;
  if (lands.length && !showLandCards) {
    grid.appendChild(renderLandStrip(lands, isYou, mkHead("Lands · " + lands.length, toggleLands, "expand ▸")));
  } else {
    const head = (lands.length && !inCombat)
      ? mkHead("Lands", toggleLands, "collapse ▾") : mkHead("Lands");
    grid.appendChild(mkCardZone(head, lands, "no lands"));
  }
  // Creatures / permanents (right): full card view.
  grid.appendChild(mkCardZone(mkHead("Creatures & permanents"), others, "no permanents"));
  container.appendChild(grid);
}

// Collapsed lands: one compact wrapped row of chips (one per name+tapped group),
// each "Name ×N", tapped dimmed. Clicking an untapped group taps one for mana.
function renderLandStrip(lands, isYou, head) {
  const z = document.createElement("div");
  z.className = "zone landstrip"; // CSS sizes it to content (narrow left strip)
  z.appendChild(head);
  const wrap = document.createElement("div");
  wrap.className = "land-chips";
  // Group by NAME (not tap state) so each land shows its untapped/tapped
  // breakdown in one chip — pips: filled = untapped, hollow = tapped.
  const groups = new Map();
  for (const c of lands) {
    if (groups.has(c.name)) groups.get(c.name).push(c); else groups.set(c.name, [c]);
  }
  for (const [name, g] of groups) {
    const untapped = g.filter((c) => !c.tapped);
    const nU = untapped.length, nT = g.length - nU;
    const chip = document.createElement("div");
    chip.className = "land-chip" + (nU === 0 ? " tapped" : "");

    const nm = document.createElement("span");
    nm.className = "lc-name"; nm.textContent = name;
    chip.appendChild(nm);

    if (g.length > 1) {
      const n = document.createElement("span");
      n.className = "lc-n"; n.textContent = "×" + g.length;
      chip.appendChild(n);
    }
    // tap-state pips (numeric fallback past 8 so the chip stays compact)
    const pips = document.createElement("span");
    pips.className = "lc-pips";
    if (g.length <= 8) {
      pips.innerHTML =
        '<span class="on">' + "●".repeat(nU) + "</span>" +
        '<span class="off">' + "○".repeat(nT) + "</span>";
    } else {
      pips.textContent = nU + "/" + g.length;
    }
    chip.appendChild(pips);

    chip.title = g.length + " " + name + " — " + nU + " untapped, " + nT + " tapped";
    // Click taps ONE untapped land of this name (whichever has a mana ability) —
    // click again to tap another; the pips show how many remain untapped.
    if (isYou && nU > 0) {
      let acts = null;
      for (const c of untapped) {
        const a = activateActionsFor(c.id);
        if (a.length) { acts = a; break; }
      }
      if (acts) {
        chip.classList.add("clickable");
        chip.title += " · click to tap one";
        chip.onclick = (ev) => onPermanentClick(acts, ev);
      }
    }
    wrap.appendChild(chip);
  }
  z.appendChild(wrap);
  return z;
}

// The human's hand, in its own panel (so the board fits the viewport).
function renderHand(you) {
  const hz = document.getElementById("handzone");
  hz.innerHTML = "";
  const h = document.createElement("div");
  h.className = "meta-label zone-head";
  h.textContent = "Click a highlighted card to play it (auto-taps mana)";
  hz.appendChild(h);
  const hand = document.createElement("div");
  hand.className = "cards hand fit";
  renderCards(hand, you.hand, "empty hand", handDecor);
  hz.appendChild(hand);
}

// decorate a battlefield card with combat affordances + the enter-pulse
function combatDecor(c, isYou, cm) {
  const pulse = !G.seenBf.has(c.id);
  const base = pulse ? { pulse: true } : {};
  if (!cm) return base;
  if (cm.mode === "attackers" && isYou && cm.atkOpts.has(c.id)) {
    const attacking = G.atk.has(c.id);
    const defenders = cm.atkOpts.get(c.id);
    return Object.assign(base, {
      classes: attacking ? ["atk"] : ["selectable"],
      badge: attacking ? ("→ " + describeDefender(G.atk.get(c.id))) : "attack",
      onClick: () => toggleAttacker(c.id, defenders),
    });
  }
  if (cm.mode === "blockers") {
    if (isYou && cm.blkOpts.has(c.id)) {
      const assigned = G.blk.has(c.id);
      const pending = G.pendingBlocker === c.id;
      let badge = "block";
      if (assigned) {
        const tgt = G.cardById.get(G.blk.get(c.id));
        badge = "→ " + (tgt ? tgt.name : "#" + G.blk.get(c.id));
      } else if (pending) { badge = "pick attacker…"; }
      return Object.assign(base, {
        classes: assigned ? ["blk"] : (pending ? ["pending"] : ["selectable"]),
        badge,
        onClick: () => clickBlocker(c.id),
      });
    }
    if (!isYou && cm.incoming.has(c.id)) {
      return Object.assign(base, {
        classes: ["atk"], badge: "attacking",
        onClick: () => clickAttacker(c.id, cm.blkOpts),
      });
    }
  }
  if (cm.mode === "orderblockers" || cm.mode === "assigndamage") {
    if (cm.hiAtk.has(c.id)) return Object.assign(base, { classes: ["atk"], badge: "attacking" });
    if (cm.hiBlk.has(c.id)) return Object.assign(base, { classes: ["blk"], badge: "blocking" });
  }
  return base;
}

// Battlefield decorator: combat affordances take precedence; otherwise, if it's
// your permanent with an available activated ability, make it click-to-activate
// (so abilities are card-driven, not buttons).
function bfDecor(c, isYou, cm) {
  const combat = combatDecor(c, isYou, cm);
  const inCombat = cm && cm.mode;
  if (!inCombat && isYou) {
    const acts = activateActionsFor(c.id);
    if (acts.length) {
      // Subtle ring for the common single-ability case (lands tapping for mana,
      // etc.); only badge when there's a real choice of abilities.
      const deco = { classes: ["selectable"], onClick: (ev) => onPermanentClick(acts, ev) };
      if (acts.length > 1) deco.badge = acts.length + " abilities";
      return Object.assign(combat, deco);
    }
  }
  return combat;
}

// Legal "Activate …" actions that act FROM this permanent (via ActionView.source).
function activateActionsFor(id) {
  if (!G.resp) return [];
  return G.resp.view.legal.filter(
    (a) => a.source === id && /^Activate /.test(a.label)
  );
}

// Click a permanent: one ability → activate it; several → a small chooser popup.
function onPermanentClick(acts, ev) {
  if (G.busy) return;
  if (acts.length === 1) { sendAction(acts[0].index, acts[0].label); return; }
  showActionMenu(ev, acts);
}

// A small floating menu of action buttons, anchored at the pointer (for a
// permanent with multiple abilities). Dismisses on the next outside click.
function showActionMenu(ev, acts) {
  closeActionMenu();
  const menu = document.createElement("div");
  menu.id = "action-menu"; menu.className = "action-menu";
  for (const a of acts) {
    const b = document.createElement("button");
    b.textContent = a.label;
    b.onclick = () => { closeActionMenu(); sendAction(a.index, a.label); };
    menu.appendChild(b);
  }
  document.body.appendChild(menu);
  const x = ev && ev.clientX != null ? ev.clientX : 80;
  const y = ev && ev.clientY != null ? ev.clientY : 80;
  menu.style.left = Math.min(x, window.innerWidth - menu.offsetWidth - 8) + "px";
  menu.style.top = Math.min(y, window.innerHeight - menu.offsetHeight - 8) + "px";
  setTimeout(() => document.addEventListener("pointerdown", onMenuOutside, { once: true }), 0);
}
function onMenuOutside(e) {
  const m = document.getElementById("action-menu");
  if (m && !m.contains(e.target)) closeActionMenu();
}
function closeActionMenu() {
  const m = document.getElementById("action-menu");
  if (m) m.remove();
}

// classify a legal action label into a group for tidier presentation
function groupOf(label) {
  if (label === "Pass" || label === "Pass priority") return "pass";
  if (label === "Concede") return "concede";
  if (label.startsWith("Play ")) return "Lands";
  if (label.startsWith("Cast ")) return "Spells";
  if (label.startsWith("Activate ")) return "Abilities";
  if (/^(Choose|Yes|No|Pay|Decline|Pick|Distribute|Keep|Mulligan|Order|Assign|Select|Put|Scry)/.test(label))
    return "Choices";
  return "Other";
}

function renderActions(view) {
  const root = document.getElementById("actions");
  root.innerHTML = "";
  if (view.game_over) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "No actions — start a new game.";
    root.appendChild(e);
    return;
  }
  if (G.resp.combat || G.resp.bottom != null) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "Resolve the combat / mulligan prompt above.";
    root.appendChild(e);
    return;
  }

  // Lands / Spells / Abilities are CARD-DRIVEN (click a hand card to play/cast,
  // a permanent to activate), so they aren't rendered as buttons. Only genuine
  // non-card choices get buttons.
  const order = ["Choices", "Other"];
  const groups = {}; let pass = null, concede = null, cardDriven = 0;
  for (const a of view.legal) {
    const g = groupOf(a.label);
    if (g === "pass") { pass = a; continue; }
    if (g === "concede") { concede = a; continue; }
    if (g === "Lands" || g === "Spells" || g === "Abilities") { cardDriven++; continue; }
    (groups[g] = groups[g] || []).push(a);
  }
  if (cardDriven) {
    const hint = document.createElement("div");
    hint.className = "meta-label action-hint";
    hint.textContent = "Click a highlighted card to play or activate it";
    root.appendChild(hint);
  }
  for (const g of order) {
    if (!groups[g]) continue;
    const wrap = document.createElement("div");
    wrap.className = "agroup";
    const gl = document.createElement("div");
    gl.className = "gl meta-label"; gl.textContent = g;
    wrap.appendChild(gl);
    const btns = document.createElement("div");
    btns.className = "btns";
    for (const a of groups[g]) {
      const btn = document.createElement("button");
      btn.textContent = a.label;
      btn.onclick = () => sendAction(a.index, a.label);
      btns.appendChild(btn);
    }
    wrap.appendChild(btns);
    root.appendChild(wrap);
  }
  const ctrl = document.createElement("div");
  ctrl.className = "control-row";
  if (pass) {
    const b = document.createElement("button");
    b.className = "primary"; b.textContent = "Pass / next step";
    b.onclick = () => sendAction(pass.index, "Pass");
    ctrl.appendChild(b);
  }
  if (concede) {
    const b = document.createElement("button");
    b.className = "ghost"; b.textContent = "Concede";
    b.onclick = () => { if (confirm("Concede this game?")) sendAction(concede.index, "Concede"); };
    ctrl.appendChild(b);
  }
  if (pass || concede) root.appendChild(ctrl);
}

function cardLabel(id) {
  const c = G.cardById.get(id);
  if (!c) return "#" + id;
  const pt = (c.power !== null && c.power !== undefined) ? " " + c.power + "/" + c.toughness : "";
  return c.name + pt;
}
function cardToughness(id) {
  const c = G.cardById.get(id);
  return (c && c.toughness !== null && c.toughness !== undefined) ? c.toughness : 1;
}

const COMBAT_HINTS = {
  attackers: "Click your creatures on the board to attack; if a planeswalker/battle is in play, click again to cycle which one they attack. Then confirm.",
  blockers: "Click a creature on the board to block with, then click the attacker it should block. Click again to clear.",
  orderblockers: "Each attacker is blocked by several creatures — set the order damage is assigned in (first takes lethal first).",
  assigndamage: "Distribute each attacker's combat damage. 'Auto' assigns lethal-first; for tramplers the unassigned remainder hits the opponent.",
};
const COMBAT_TITLES = {
  attackers: "Declare attackers", blockers: "Declare blockers",
  orderblockers: "Order blockers", assigndamage: "Assign combat damage",
};

function renderCombatPanel() {
  const panel = document.getElementById("combat");
  const cb = G.resp.combat;
  if (!cb) { panel.className = ""; panel.innerHTML = ""; return; }
  panel.className = "show";
  panel.innerHTML = "";

  const title = document.createElement("div");
  title.className = "ctitle"; title.textContent = COMBAT_TITLES[cb.kind] || "Combat";
  panel.appendChild(title);
  const hint = document.createElement("div");
  hint.className = "hint"; hint.textContent = COMBAT_HINTS[cb.kind] || "";
  panel.appendChild(hint);

  if (cb.kind === "attackers") buildDeclarePanel(panel, "attacker");
  else if (cb.kind === "blockers") buildDeclarePanel(panel, "block");
  else if (cb.kind === "orderblockers") buildOrderPanel(panel, cb);
  else if (cb.kind === "assigndamage") buildDamagePanel(panel, cb);
}

function buildDeclarePanel(panel, word) {
  const ctrls = document.createElement("div");
  ctrls.className = "ctrls";
  const isAtk = word === "attacker";
  const n = isAtk ? G.atk.size : G.blk.size;
  const go = document.createElement("button");
  go.className = "primary";
  go.textContent = n ? ("Confirm " + n + " " + word + (n > 1 ? "s" : "")) : ("Confirm " + word + "s");
  go.onclick = isAtk ? confirmAttackers : confirmBlockers;
  const none = document.createElement("button");
  none.textContent = isAtk ? "No attacks" : "No blocks";
  none.onclick = isAtk
    ? () => { G.atk.clear(); confirmAttackers(); }
    : () => { G.blk.clear(); G.pendingBlocker = null; confirmBlockers(); };
  ctrls.append(go, none);
  panel.appendChild(ctrls);
}

function buildOrderPanel(panel, cb) {
  for (const g of cb.orderings) {
    if (!G.order.has(g.attacker)) G.order.set(g.attacker, g.blockers.slice());
  }
  for (const g of cb.orderings) {
    const ord = G.order.get(g.attacker);
    const sec = document.createElement("div"); sec.className = "csec";
    const h = document.createElement("div"); h.className = "csec-h";
    h.textContent = cardLabel(g.attacker) + " blocked by " + ord.length + ":";
    sec.appendChild(h);
    ord.forEach((bid, i) => {
      const row = document.createElement("div"); row.className = "ord-row";
      const num = document.createElement("span"); num.className = "ord-num"; num.textContent = (i + 1) + ".";
      const nm = document.createElement("span"); nm.className = "ord-nm"; nm.textContent = cardLabel(bid);
      const up = document.createElement("button"); up.className = "stepper"; up.textContent = "▲"; up.disabled = i === 0;
      up.onclick = () => moveOrder(g.attacker, i, -1);
      const dn = document.createElement("button"); dn.className = "stepper"; dn.textContent = "▼"; dn.disabled = i === ord.length - 1;
      dn.onclick = () => moveOrder(g.attacker, i, 1);
      row.append(num, nm, up, dn);
      sec.appendChild(row);
    });
    panel.appendChild(sec);
  }
  const ctrls = document.createElement("div"); ctrls.className = "ctrls";
  const go = document.createElement("button"); go.className = "primary"; go.textContent = "Confirm order";
  go.onclick = confirmOrder;
  ctrls.appendChild(go);
  panel.appendChild(ctrls);
}

function moveOrder(atk, i, d) {
  const ord = G.order.get(atk);
  const j = i + d;
  if (j < 0 || j >= ord.length) return;
  [ord[i], ord[j]] = [ord[j], ord[i]];
  renderAll();
}

async function confirmOrder() {
  const orderings = [];
  for (const [atk, ord] of G.order) orderings.push([atk, ord]);
  logLine("you", "Order blockers");
  await postCombat({ kind: "order", orderings });
}

// lethal-first auto-assignment
function autoLethal(g) {
  const m = new Map();
  let rem = g.power;
  for (const tid of g.targets) {
    const give = Math.min(rem, Math.max(1, cardToughness(tid)));
    m.set(tid, give); rem -= give;
  }
  if (!g.trample && rem > 0 && g.targets.length) {
    const last = g.targets[g.targets.length - 1];
    m.set(last, (m.get(last) || 0) + rem);
  }
  return m;
}

function setDmg(atk, tid, val, power) {
  const m = G.damage.get(atk);
  m.set(tid, Math.max(0, Math.min(val, power)));
  renderAll();
}

function buildDamagePanel(panel, cb) {
  for (const g of cb.damage) {
    if (!G.damage.has(g.attacker)) G.damage.set(g.attacker, autoLethal(g));
  }
  let allValid = true;
  for (const g of cb.damage) {
    const m = G.damage.get(g.attacker);
    const order = g.targets;
    const amtOf = (i) => (m.get(order[i]) || 0);
    const lethalOf = (i) => Math.max(1, cardToughness(order[i]));
    const sum = order.reduce((s, t) => s + (m.get(t) || 0), 0);
    const earlierAllLethal = (i) => order.slice(0, i).every((t, j) => (m.get(t) || 0) >= lethalOf(j));
    const laterAnyNonzero = (i) => order.slice(i + 1).some((t) => (m.get(t) || 0) > 0);

    const sec = document.createElement("div"); sec.className = "csec";
    const h = document.createElement("div"); h.className = "csec-h";
    h.textContent = cardLabel(g.attacker) + " — assign " + g.power + " damage:";
    sec.appendChild(h);
    order.forEach((tid, i) => {
      const row = document.createElement("div"); row.className = "dmg-row";
      const nm = document.createElement("span"); nm.className = "dmg-nm"; nm.textContent = cardLabel(tid);
      const minus = document.createElement("button"); minus.className = "stepper"; minus.textContent = "−";
      minus.disabled = !(amtOf(i) > 0 && (!laterAnyNonzero(i) || amtOf(i) - 1 >= lethalOf(i)));
      minus.onclick = () => setDmg(g.attacker, tid, amtOf(i) - 1, g.power);
      const amt = document.createElement("span"); amt.className = "dmg-amt"; amt.textContent = amtOf(i);
      const plus = document.createElement("button"); plus.className = "stepper"; plus.textContent = "+";
      plus.disabled = !(sum < g.power && earlierAllLethal(i));
      plus.onclick = () => setDmg(g.attacker, tid, amtOf(i) + 1, g.power);
      row.append(nm, minus, amt, plus);
      sec.appendChild(row);
    });
    const allLethal = order.every((t, i) => (m.get(t) || 0) >= lethalOf(i));
    const validG = sum === g.power || (g.trample && sum < g.power && allLethal);
    allValid = allValid && validG;

    const status = document.createElement("div"); status.className = "dmg-status";
    let txt = "assigned " + sum + " / " + g.power;
    if (sum > g.power) txt += " — too much!";
    else if (g.trample && sum < g.power) txt += allLethal
      ? " · " + (g.power - sum) + " tramples over"
      : " — assign lethal to each before trampling";
    else if (sum < g.power) txt += " — assign all " + g.power;
    status.textContent = txt;
    status.classList.toggle("bad", !validG);
    sec.appendChild(status);
    panel.appendChild(sec);
  }
  const ctrls = document.createElement("div"); ctrls.className = "ctrls";
  const auto = document.createElement("button"); auto.textContent = "Auto (lethal-first)";
  auto.onclick = () => { for (const g of cb.damage) G.damage.set(g.attacker, autoLethal(g)); renderAll(); };
  const go = document.createElement("button"); go.className = "primary"; go.textContent = "Confirm damage";
  go.disabled = !allValid;
  go.onclick = confirmDamage;
  ctrls.append(auto, go);
  panel.appendChild(ctrls);
}

async function confirmDamage() {
  const cb = G.resp.combat;
  const distributions = cb.damage.map((g) => {
    const m = G.damage.get(g.attacker);
    const distribution = g.targets
      .map((tid) => [tid, m.get(tid) || 0])
      .filter(([, amt]) => amt > 0);
    return { attacker: g.attacker, distribution };
  });
  logLine("you", "Assign combat damage");
  await postCombat({ kind: "damage", distributions });
}

function renderBottomPanel() {
  const panel = document.getElementById("combat");
  const n = G.resp.bottom;
  panel.className = "show"; panel.innerHTML = "";
  const title = document.createElement("div");
  title.className = "ctitle";
  title.textContent = "Mulligan — put " + n + " card" + (n > 1 ? "s" : "") + " on the bottom";
  panel.appendChild(title);
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "Click " + n + " card" + (n > 1 ? "s" : "") +
    " in your hand to bottom; the rest is your opening hand.";
  panel.appendChild(hint);
  const ctrls = document.createElement("div"); ctrls.className = "ctrls";
  const sel = G.bottomSel.size;
  const go = document.createElement("button"); go.className = "primary";
  go.textContent = "Confirm (" + sel + "/" + n + ")";
  go.disabled = sel !== n;
  go.onclick = confirmBottom;
  ctrls.appendChild(go);
  panel.appendChild(ctrls);
}

async function confirmBottom() {
  const n = G.resp.bottom;
  if (G.bottomSel.size !== n) return;
  const ids = [...G.bottomSel];
  logLine("you", "Bottom " + ids.length + " card" + (ids.length > 1 ? "s" : ""));
  setBusy(true);
  try {
    G.bottomSel.clear();
    adopt(await Arcana.Api.bottom(ids), true);
  } catch (e) {
    if (e.isApi) { logLine("sys", "✗ " + e.message); await getState(); }
    else logLine("sys", "request failed: " + e);
  } finally {
    setBusy(false);
  }
}

function renderLog() {
  const log = document.getElementById("log");
  if (!log) return;
  log.innerHTML = "";
  for (const l of G.log.slice(-60)) {
    const d = document.createElement("div");
    d.className = "ln " + l.cls;
    d.textContent = l.text;
    log.appendChild(d);
  }
  log.scrollTop = log.scrollHeight;
}

function logLine(cls, text) { G.log.push({ cls, text }); renderLog(); }

// Toggle the transient overlay (combat / mulligan) based on whether the combat
// panel rendered content. The dimming backdrop is pointer-events:none, so the
// board + hand behind stay clickable (declare / bottoming interactions intact).
function syncOverlay() {
  const combat = document.getElementById("combat");
  const ov = document.getElementById("overlay");
  if (!ov) return;
  ov.classList.toggle("show", !!(combat && combat.classList.contains("show")));
}

function renderAll() {
  const resp = G.resp;
  if (!resp) return;
  const view = resp.view;
  const me = view.perspective;
  const you = view.players.find((p) => p.id === me);
  const opp = view.players.find((p) => p.id !== me);

  // refresh the id->card lookup for combat display
  G.cardById = new Map();
  for (const p of view.players) for (const c of p.battlefield) G.cardById.set(c.id, c);

  const yourTurn = view.active_player === me;
  const phaseEl = document.getElementById("phase");
  phaseEl.className = "phasebar" + (yourTurn ? " you-turn" : "");
  phaseEl.innerHTML =
    '<span class="turn tnum">Turn ' + view.turn + "</span>" +
    '<span class="step">' + prettyPhase(view) + "</span>" +
    '<span class="who ' + (yourTurn ? "you" : "opp") + '">' +
      (yourTurn ? "Your turn" : "Opponent's turn") + "</span>";

  const banner = document.getElementById("banner");
  if (view.game_over) {
    banner.style.display = "block";
    const won = view.game_over.indexOf("P" + me) >= 0;
    banner.textContent = (view.game_over.startsWith("Win") && won ? "You win — " : "Game over — ") + view.game_over;
  } else {
    banner.style.display = "none";
  }

  const cm = combatMaps();
  renderHud(document.getElementById("opphud"), opp, false);
  renderBattlefield(document.getElementById("opponent"), opp, false, cm);
  renderBattlefield(document.getElementById("you"), you, true, cm);
  renderHud(document.getElementById("youhud"), you, true);
  renderHand(you);
  renderCards(document.getElementById("stack"), view.stack, "(stack empty)");
  if (resp.bottom != null) renderBottomPanel(); else renderCombatPanel();
  renderActions(view);

  // new analyst panels
  renderEval(resp.eval);
  renderDraw(resp.library);
  renderSuggest();
  maybeAutoSuggest(view);
  renderCardPower();
  syncOverlay();

  // remember which battlefield ids we've now shown (so new ones pulse next time)
  G.seenBf = new Set();
  for (const p of view.players) for (const c of p.battlefield) G.seenBf.add(c.id);

  setBusy(G.busy);
}

function setBusy(busy) {
  G.busy = busy;
  document.body.classList.toggle("busy", busy);
}

// ----- networking (through Arcana.Api) -------------------------------------
function adopt(resp, isAdvance) {
  const newToken = combatTokenOf(resp.combat);
  if (newToken !== G.combatToken) {
    G.combatToken = newToken;
    G.atk.clear(); G.blk.clear(); G.pendingBlocker = null;
    G.order.clear(); G.damage.clear();
  }
  if (resp.bottom == null) G.bottomSel.clear();
  if (isAdvance && resp.recent && resp.recent.length) {
    for (const r of resp.recent) logLine("opp", "Opponent: " + r.description);
  }
  G.resp = resp;
  renderAll();
}

async function getState() {
  try { adopt(await Arcana.Api.state(), false); }
  catch (e) { logLine("sys", "request failed: " + e); }
}

// generic guarded request: run `fn`, adopt the result, surface errors gracefully
async function guarded(fn) {
  if (G.busy) return;
  setBusy(true);
  try {
    adopt(await fn(), true);
  } catch (e) {
    if (e.isApi) { logLine("sys", "✗ " + e.message); await getState(); }
    else logLine("sys", "request failed: " + e);
  } finally {
    setBusy(false);
  }
}

async function sendAction(index, label) {
  if (label && label !== "Pass") logLine("you", "You: " + label);
  await guarded(() => Arcana.Api.action(index));
}

async function sendAutoTap(id, name) {
  logLine("you", "You: play " + (name || "card"));
  await guarded(() => Arcana.Api.autotap(id));
}

async function postCombat(body) { await guarded(() => Arcana.Api.combat(body)); }

async function newGame() {
  setBusy(true);
  try {
    const resp = await Arcana.Api.newGame({});
    G.log = []; G.combatToken = null; G.seenBf = new Set();
    logLine("sys", "— new game —");
    adopt(resp, false);
  } catch (e) {
    logLine("sys", "could not start a new game: " + e);
  } finally {
    setBusy(false);
  }
}

// ----- wire ----------------------------------------------------------------
L = loadLayout();
buildWorkspace();
applyLayout();
buildPanelsMenu();
initResizers();

Arcana.mountThemeSwitcher(document.getElementById("themeslot"));
document.getElementById("new").onclick = newGame;
document.getElementById("refresh").onclick = getState;

// Panels menu open/close
const panelsBtn = document.getElementById("panelsbtn");
const panelsPop = document.getElementById("panels-pop");
panelsBtn.onclick = (e) => { e.stopPropagation(); panelsPop.classList.toggle("show"); };
document.addEventListener("click", (e) => {
  if (!document.getElementById("panels-menu").contains(e.target)) panelsPop.classList.remove("show");
});

Arcana.loadGlossary();
getState();
</script>
