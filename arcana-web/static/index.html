<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcana — Web Play</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: #14161b; color: #e7e9ee;
    padding: 10px 14px 40px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 700; }
  h1 .sub { opacity: .5; font-weight: 400; font-size: 12px; }

  .topbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .topbar .spacer { flex: 1; }
  .phase {
    font-size: 13px; padding: 4px 10px; border-radius: 6px; background: #1c2330; border: 1px solid #2c3647;
  }
  .phase b { color: #8fb3ff; }

  button {
    background: #2a2f3a; color: #e7e9ee; border: 1px solid #3a4150; border-radius: 6px;
    padding: 6px 11px; cursor: pointer; font-size: 13px;
  }
  button:hover:not(:disabled) { background: #353c4a; }
  button:disabled { opacity: .45; cursor: default; }
  button.action { background: #2d4263; border-color: #3f5d8a; }
  button.action:hover:not(:disabled) { background: #375079; }
  button.pass { background: #34502f; border-color: #4a6b41; font-weight: 600; }
  button.pass:hover:not(:disabled) { background: #3f6038; }
  button.concede { background: #4a2d2d; border-color: #6b4141; }
  button.danger { background: #5a2d2d; border-color: #8a4f4f; font-weight: 600; }
  button.danger:hover:not(:disabled) { background: #6e3838; }

  /* layout: opponent top, your area bottom, stack + log in the middle */
  .player {
    border: 1px solid #2a2f3a; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
    background: #1a1d24;
  }
  .player.you { border-color: #3f5d8a; }
  .ptitle { display: flex; gap: 14px; align-items: baseline; margin-bottom: 4px; }
  .ptitle .name { font-weight: 700; }
  .ptitle .life { font-size: 20px; font-weight: 800; color: #ff8d8d; }
  .ptitle .mana { font-size: 12px; color: #9aa4b2; }
  .ptitle .counts { font-size: 12px; opacity: .7; }

  .zone-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .55; margin: 7px 0 3px; }
  .cards { display: flex; gap: 6px; flex-wrap: wrap; min-height: 8px; }

  .card {
    width: 92px; border-radius: 6px; overflow: hidden; background: #20242d;
    border: 2px solid #333a47; font-size: 11px; position: relative; transition: transform .08s, border-color .08s;
  }
  .card.tapped { transform: rotate(90deg) scale(.86); }
  .card img { width: 100%; display: block; aspect-ratio: 488/680; object-fit: cover; background: #0c0d11; }
  .card .nm { padding: 3px 4px; line-height: 1.15; }
  .card .foot { padding: 3px 4px; }
  .card .nmrow { display: flex; gap: 4px; align-items: baseline; }
  .card .cardname { flex: 1; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .cost { font-weight: 800; font-size: 10px; color: #e0cf90; white-space: nowrap; }
  .card .tlrow { display: flex; gap: 4px; align-items: baseline; margin-top: 1px; }
  .card .tl { flex: 1; font-size: 9px; opacity: .58; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .pt2 { font-weight: 800; font-size: 11px; color: #f0f2f6; white-space: nowrap; }
  /* subtle type tint on the footer for at-a-glance category reading */
  .card .foot.cat-land     { background: #241f14; }
  .card .foot.cat-creature { background: #1b241a; }
  .card .foot.cat-spell    { background: #1a2031; }
  .card .foot.cat-pw       { background: #2a1f2c; }
  .card .foot.cat-artifact { background: #1f242b; }
  .card .foot.cat-ench     { background: #231f2a; }
  .card.fallback { padding: 6px 4px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  /* combat affordances */
  .card.selectable { cursor: pointer; border-color: #6b8; }
  .card.selectable:hover { border-color: #9d8; }
  .card.attacking { border-color: #e0a24a; box-shadow: 0 0 0 2px #e0a24a55; }
  .card.incoming { border-color: #e06a6a; box-shadow: 0 0 0 2px #e06a6a55; }
  .card.pending { border-color: #f0d24a; box-shadow: 0 0 0 3px #f0d24a88; }
  .card.blocking { border-color: #6ab0e0; box-shadow: 0 0 0 2px #6ab0e055; }
  /* hand: playable this turn (cast/play if tapped out) vs not */
  .card.playable { border-color: #6bdc8a; box-shadow: 0 0 0 2px #6bdc8a55; }
  .card.unplayable { opacity: .58; }
  .card .badge {
    position: absolute; left: 0; top: 0; right: 0; font-size: 10px; font-weight: 700;
    padding: 2px 4px; text-align: center; background: rgba(0,0,0,.72);
  }
  .card .badge.atk { color: #f0c070; }
  .card .badge.blk { color: #8fc6f0; }

  .stack { border: 1px dashed #4a4150; border-radius: 6px; padding: 4px; }

  /* combat control panel */
  #combat { display: none; border: 1px solid #5a4a2a; background: #221d12; border-radius: 8px; padding: 10px; margin: 8px 0; }
  #combat.show { display: block; }
  #combat .ctitle { font-weight: 700; margin-bottom: 4px; color: #e0c080; }
  #combat .hint { font-size: 12px; opacity: .8; margin-bottom: 8px; }
  #combat .ctrls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  #combat .csec { border-top: 1px solid #3a3220; padding: 6px 0; }
  #combat .csec-h { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  #combat .ord-row, #combat .dmg-row { display: flex; gap: 8px; align-items: center; margin: 3px 0; font-size: 13px; }
  #combat .ord-num { width: 18px; opacity: .7; }
  #combat .ord-nm, #combat .dmg-nm { flex: 1; }
  #combat .dmg-amt { min-width: 18px; text-align: center; font-weight: 700; }
  #combat button { padding: 2px 9px; }
  #combat .dmg-status { font-size: 12px; opacity: .8; margin-top: 2px; }
  #combat .dmg-status.bad { color: #e69a8a; opacity: 1; }

  /* action groups */
  #actions { margin: 8px 0; }
  .agroup { margin-bottom: 8px; }
  .agroup .gl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .5; margin-bottom: 3px; }
  .agroup .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .control-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  /* game log */
  #log {
    font-size: 12px; background: #12141a; border: 1px solid #242a36; border-radius: 6px;
    padding: 6px 8px; max-height: 92px; overflow-y: auto; margin-bottom: 8px;
  }
  #log .you { color: #8fb3ff; }
  #log .opp { color: #c6b27a; }
  #log .sys { opacity: .6; }
  #log .ln { line-height: 1.4; }

  #banner {
    display: none; padding: 11px; border-radius: 8px; background: #2d3a2d; border: 1px solid #4a6b4a;
    font-weight: 800; margin-bottom: 8px; font-size: 15px;
  }
  .empty { opacity: .35; font-size: 12px; padding: 3px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>Arcana <span class="sub">web play</span></h1>
    <div class="phase" id="phase"></div>
    <div class="spacer"></div>
    <button id="refresh">Refresh</button>
    <button id="new" class="danger">New game</button>
  </div>

  <div id="banner"></div>

  <div id="opponent" class="player"></div>

  <div class="zone-label">Stack</div>
  <div id="stack" class="cards stack"></div>

  <div id="log"></div>

  <div id="you" class="player you"></div>

  <div id="combat"></div>

  <div class="zone-label">Your actions</div>
  <div id="actions"></div>

<script>
"use strict";

// ----- module state --------------------------------------------------------
const G = {
  resp: null,
  log: [],            // running game log lines: {cls, text}
  cardById: new Map(),// id -> CardView (both battlefields), for combat display
  // combat selection (reset when the prompt identity changes)
  combatToken: null,
  atk: new Map(),     // attackerId -> defending entity object
  blk: new Map(),     // blockerId  -> attackerId
  pendingBlocker: null,
  order: new Map(),   // attackerId -> [blockerId,...] in chosen damage order
  damage: new Map(),  // attackerId -> Map(blockerId -> amount)
  busy: false,
};

// ----- card art / tiles ----------------------------------------------------
function artUrl(name) {
  return "https://api.scryfall.com/cards/named?format=image&exact=" + encodeURIComponent(name);
}

// "{2}{G}{G}" -> "2GG" (compact for the narrow card footer; full cost is in the tooltip)
function compactCost(cost) {
  return cost ? cost.replace(/[{}]/g, "") : "";
}

// a coarse type category for the subtle footer tint
function categoryClass(c) {
  if (!c.type_line) return "";
  if (c.is_land) return "cat-land";
  if (c.power !== null && c.power !== undefined) return "cat-creature";
  const t = c.type_line;
  if (t.indexOf("Instant") >= 0 || t.indexOf("Sorcery") >= 0) return "cat-spell";
  if (t.indexOf("Planeswalker") >= 0) return "cat-pw";
  if (t.indexOf("Artifact") >= 0) return "cat-artifact";
  if (t.indexOf("Enchantment") >= 0) return "cat-ench";
  return "";
}

// colored mana symbols for the gauge
const MANA_COL = {
  white: ["W", "#e9e3c8"], blue: ["U", "#a9c9e8"], black: ["B", "#b7a9c0"],
  red: ["R", "#e69a8a"], green: ["G", "#9ccb9c"], colorless: ["C", "#c8ccd4"],
};

// hand cards: green-glow the ones playable this turn and make them click-to-play
// (the server auto-taps mana and casts/plays, or floats mana and surfaces the
// cast variants if a choice remains). Dim the rest. `playable` is server-computed.
function handDecor(c) {
  if (c.playable) return { cls: ["playable"], onclick: () => sendAutoTap(c.id, c.name) };
  return { cls: ["unplayable"] };
}

// summarize a player's mana picture: the colored mana they could produce right
// now (engine-computed, includes floating), plus an untapped-land tally.
function manaGauge(p) {
  const a = p.available_mana || { total: 0 };
  const pips = [];
  for (const k of ["white", "blue", "black", "red", "green", "colorless"]) {
    if (a[k]) {
      const [sym, col] = MANA_COL[k];
      pips.push('<span style="color:' + col + '">' + a[k] + sym + "</span>");
    }
  }
  let s = a.total ? ("avail " + pips.join(" ")) : "";
  if (p.mana_pool) s += (s ? " " : "") + '<span style="opacity:.65">(' + p.mana_pool + " floating)</span>";
  const lands = p.battlefield.filter(c => c.is_land);
  const untapped = lands.filter(c => !c.tapped).length;
  if (lands.length) s += (s ? " · " : "") + '<span style="opacity:.7">' + untapped + "/" + lands.length + " lands</span>";
  return s;
}

function cardEl(c, opts) {
  opts = opts || {};
  const div = document.createElement("div");
  div.className = "card" + (c.tapped ? " tapped" : "");
  const name = c.name && c.name.length ? c.name : "(hidden)";
  if (c.name && c.name.length) {
    const img = document.createElement("img");
    img.alt = name; img.loading = "lazy"; img.src = artUrl(name);
    img.onerror = () => {
      div.classList.add("fallback");
      // keep any badge we add below; just drop the broken <img>
      img.remove();
    };
    div.appendChild(img);
  } else {
    div.classList.add("fallback");
  }
  // footer: name + mana cost on one row, type line + P/T beneath
  const hasPT = (c.power !== null && c.power !== undefined);
  const foot = document.createElement("div");
  foot.className = "foot " + categoryClass(c);
  const row = document.createElement("div");
  row.className = "nmrow";
  const nm = document.createElement("div");
  nm.className = "cardname"; nm.textContent = name;
  row.appendChild(nm);
  if (c.mana_cost) {
    const cost = document.createElement("div");
    cost.className = "cost"; cost.textContent = compactCost(c.mana_cost);
    row.appendChild(cost);
  }
  foot.appendChild(row);
  if (c.type_line || hasPT) {
    const tlrow = document.createElement("div");
    tlrow.className = "tlrow";
    const tl = document.createElement("div");
    tl.className = "tl"; tl.textContent = c.type_line || "";
    tlrow.appendChild(tl);
    if (hasPT) {
      const pt = document.createElement("div");
      pt.className = "pt2"; pt.textContent = c.power + "/" + c.toughness;
      tlrow.appendChild(pt);
    }
    foot.appendChild(tlrow);
  }
  div.appendChild(foot);
  // full info on hover (footer text truncates)
  div.title = name + (c.mana_cost ? "  " + c.mana_cost : "") + (c.type_line ? "\n" + c.type_line : "");
  if (opts.badge) {
    const b = document.createElement("div");
    b.className = "badge " + (opts.badgeCls || "");
    b.textContent = opts.badge;
    div.appendChild(b);
  }
  if (opts.cls) div.classList.add(...opts.cls);
  if (opts.onclick) div.onclick = opts.onclick;
  return div;
}

function renderCards(container, cards, emptyMsg, decorate) {
  container.innerHTML = "";
  if (!cards || cards.length === 0) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = emptyMsg || "(empty)";
    container.appendChild(e);
    return;
  }
  for (const c of cards) container.appendChild(cardEl(c, decorate ? decorate(c) : {}));
}

// ----- combat helpers ------------------------------------------------------
function combatMaps() {
  // {mode, atkOpts, blkOpts, incoming, hiAtk, hiBlk} — the last two are
  // board-highlight sets for the order/damage steps (attackers + their blockers).
  const cb = G.resp && G.resp.combat;
  if (!cb) return null;
  const base = { mode: cb.kind, atkOpts: new Map(), blkOpts: new Map(),
                 incoming: new Set(), hiAtk: new Set(), hiBlk: new Set() };
  if (cb.kind === "attackers") {
    for (const o of cb.attackers) base.atkOpts.set(o.id, o.defenders);
  } else if (cb.kind === "blockers") {
    for (const o of cb.blockers) base.blkOpts.set(o.id, o.can_block);
    base.incoming = new Set(cb.incoming);
  } else {
    const groups = cb.kind === "orderblockers" ? cb.orderings : cb.damage;
    for (const g of groups) {
      base.hiAtk.add(g.attacker);
      for (const b of (g.blockers || g.targets)) base.hiBlk.add(b);
    }
  }
  return base;
}

function combatTokenOf(cb) {
  if (!cb) return null;
  let ids;
  if (cb.kind === "attackers") ids = cb.attackers.map(o => o.id);
  else if (cb.kind === "blockers") ids = cb.blockers.map(o => o.id);
  else if (cb.kind === "orderblockers") ids = cb.orderings.map(o => o.attacker);
  else ids = cb.damage.map(o => o.attacker);
  return cb.kind + ":" + ids.slice().sort((a, b) => a - b).join(",");
}

function describeDefender(d) {
  if (d.Player !== undefined) return "P" + d.Player;
  const id = d.Planeswalker !== undefined ? d.Planeswalker : d.Battle;
  const c = G.cardById.get(id);
  return c ? c.name : ("#" + id);
}

function toggleAttacker(id, defenders) {
  if (G.atk.has(id)) G.atk.delete(id);
  else G.atk.set(id, defenders[0]); // default to the first (lone opponent) defender
  renderAll();
}

function clickBlocker(id) {
  if (G.blk.has(id)) {           // already assigned → clear it
    G.blk.delete(id);
    G.pendingBlocker = null;
  } else {
    G.pendingBlocker = (G.pendingBlocker === id) ? null : id;
  }
  renderAll();
}

function clickAttacker(attackerId, blkOpts) {
  // assign the pending blocker to this attacker, if legal
  if (G.pendingBlocker === null) return;
  const can = blkOpts.get(G.pendingBlocker) || [];
  if (!can.includes(attackerId)) return; // this blocker can't block that attacker
  G.blk.set(G.pendingBlocker, attackerId);
  G.pendingBlocker = null;
  renderAll();
}

async function confirmAttackers() {
  const attackers = [];
  for (const [id, defending] of G.atk) attackers.push({ attacker: id, defending });
  logLine("you", attackers.length
    ? "Attack with " + attackers.length + " creature" + (attackers.length > 1 ? "s" : "")
    : "Declare no attackers");
  await postCombat({ kind: "attackers", attackers });
}

async function confirmBlockers() {
  const blockers = [];
  for (const [blocker, blocking] of G.blk) blockers.push({ blocker, blocking });
  logLine("you", blockers.length
    ? "Block with " + blockers.length + " creature" + (blockers.length > 1 ? "s" : "")
    : "Declare no blockers");
  await postCombat({ kind: "blockers", blockers });
}

// ----- rendering -----------------------------------------------------------
function prettyPhase(view) {
  const p = (view.phase || "").replace("/", " · ");
  return p;
}

function renderPlayer(container, p, isYou, cm) {
  container.innerHTML = "";
  const title = document.createElement("div");
  title.className = "ptitle";
  const gauge = manaGauge(p);
  title.innerHTML =
    '<span class="name">' + (isYou ? "You" : "Opponent") + " (P" + p.id + ')</span>' +
    '<span class="life">' + p.life + " life</span>" +
    (gauge ? '<span class="mana">' + gauge + "</span>" : "") +
    '<span class="counts">hand ' + p.hand_count + " · library " + p.library_count +
      " · graveyard " + p.graveyard_count + "</span>";
  container.appendChild(title);

  const blab = document.createElement("div");
  blab.className = "zone-label"; blab.textContent = "Battlefield";
  container.appendChild(blab);
  const bf = document.createElement("div");
  bf.className = "cards";
  renderCards(bf, p.battlefield, "no permanents", (c) => combatDecor(c, isYou, cm));
  container.appendChild(bf);

  if (isYou) {
    const hlab = document.createElement("div");
    hlab.className = "zone-label";
    hlab.textContent = "Your hand — click a green card to play it (auto-taps mana)";
    container.appendChild(hlab);
    const hand = document.createElement("div");
    hand.className = "cards";
    renderCards(hand, p.hand, "empty hand", handDecor);
    container.appendChild(hand);
  }
}

// decorate a battlefield card with combat affordances
function combatDecor(c, isYou, cm) {
  if (!cm) return {};
  if (cm.mode === "attackers" && isYou && cm.atkOpts.has(c.id)) {
    const attacking = G.atk.has(c.id);
    const defenders = cm.atkOpts.get(c.id);
    return {
      cls: attacking ? ["attacking"] : ["selectable"],
      badge: attacking ? ("ATK → " + describeDefender(G.atk.get(c.id))) : "attack",
      badgeCls: "atk",
      onclick: () => toggleAttacker(c.id, defenders),
    };
  }
  if (cm.mode === "blockers") {
    if (isYou && cm.blkOpts.has(c.id)) {
      const assigned = G.blk.has(c.id);
      const pending = G.pendingBlocker === c.id;
      let badge = "block";
      if (assigned) {
        const tgt = G.cardById.get(G.blk.get(c.id));
        badge = "BLK → " + (tgt ? tgt.name : "#" + G.blk.get(c.id));
      } else if (pending) {
        badge = "pick attacker…";
      }
      return {
        cls: assigned ? ["blocking"] : (pending ? ["pending"] : ["selectable"]),
        badge, badgeCls: "blk",
        onclick: () => clickBlocker(c.id),
      };
    }
    if (!isYou && cm.incoming.has(c.id)) {
      return {
        cls: ["incoming", "selectable"],
        badge: "attacking",
        badgeCls: "atk",
        onclick: () => clickAttacker(c.id, cm.blkOpts),
      };
    }
  }
  // order / damage steps: highlight the attackers and their blockers (no clicks;
  // the controls live in the combat panel).
  if (cm.mode === "orderblockers" || cm.mode === "assigndamage") {
    if (cm.hiAtk.has(c.id)) return { cls: ["attacking"], badge: "attacking", badgeCls: "atk" };
    if (cm.hiBlk.has(c.id)) return { cls: ["incoming"], badge: "blocking", badgeCls: "blk" };
  }
  return {};
}

// classify a legal action label into a group for tidier presentation
function groupOf(label) {
  if (label === "Pass" || label === "Pass priority") return "pass";
  if (label === "Concede") return "concede";
  if (label.startsWith("Play ")) return "Lands";
  if (label.startsWith("Cast ")) return "Spells";
  if (label.startsWith("Activate ")) return "Abilities";
  if (/^(Choose|Yes|No|Pay|Decline|Pick|Distribute|Keep|Mulligan|Order|Assign|Select|Put|Scry)/.test(label))
    return "Choices";
  return "Other";
}

function renderActions(view) {
  const root = document.getElementById("actions");
  root.innerHTML = "";
  if (view.game_over) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "No actions — start a new game.";
    root.appendChild(e);
    return;
  }
  // when a rich combat builder is up, suppress the raw declaration buttons
  if (G.resp.combat) return;

  const order = ["Lands", "Spells", "Abilities", "Choices", "Other"];
  const groups = {}; let pass = null, concede = null;
  for (const a of view.legal) {
    const g = groupOf(a.label);
    if (g === "pass") { pass = a; continue; }
    if (g === "concede") { concede = a; continue; }
    (groups[g] = groups[g] || []).push(a);
  }
  for (const g of order) {
    if (!groups[g]) continue;
    const wrap = document.createElement("div");
    wrap.className = "agroup";
    const gl = document.createElement("div");
    gl.className = "gl"; gl.textContent = g;
    wrap.appendChild(gl);
    const btns = document.createElement("div");
    btns.className = "btns";
    for (const a of groups[g]) {
      const btn = document.createElement("button");
      btn.className = "action"; btn.textContent = a.label;
      btn.onclick = () => sendAction(a.index, a.label);
      btns.appendChild(btn);
    }
    wrap.appendChild(btns);
    root.appendChild(wrap);
  }
  // control row: Pass (prominent) + Concede, always last
  const ctrl = document.createElement("div");
  ctrl.className = "control-row";
  if (pass) {
    const b = document.createElement("button");
    b.className = "pass"; b.textContent = "Pass / next step";
    b.onclick = () => sendAction(pass.index, "Pass");
    ctrl.appendChild(b);
  }
  if (concede) {
    const b = document.createElement("button");
    b.className = "concede"; b.textContent = "Concede";
    b.onclick = () => { if (confirm("Concede this game?")) sendAction(concede.index, "Concede"); };
    ctrl.appendChild(b);
  }
  if (pass || concede) root.appendChild(ctrl);
}

function cardLabel(id) {
  const c = G.cardById.get(id);
  if (!c) return "#" + id;
  const pt = (c.power !== null && c.power !== undefined) ? " " + c.power + "/" + c.toughness : "";
  return c.name + pt;
}
function cardToughness(id) {
  const c = G.cardById.get(id);
  return (c && c.toughness !== null && c.toughness !== undefined) ? c.toughness : 1;
}

const COMBAT_HINTS = {
  attackers: "Click your creatures (highlighted green) to send them in, then confirm.",
  blockers: "Click a creature to block with (green), then click the red attacker it should block. Click again to clear.",
  orderblockers: "Each attacker is blocked by several creatures — set the order damage is assigned in (first takes lethal first).",
  assigndamage: "Distribute each attacker's combat damage. 'Auto' assigns lethal-first; for tramplers the unassigned remainder hits the opponent.",
};
const COMBAT_TITLES = {
  attackers: "Declare attackers", blockers: "Declare blockers",
  orderblockers: "Order blockers", assigndamage: "Assign combat damage",
};

function renderCombatPanel() {
  const panel = document.getElementById("combat");
  const cb = G.resp.combat;
  if (!cb) { panel.className = ""; panel.innerHTML = ""; return; }
  panel.className = "show";
  panel.innerHTML = "";

  const title = document.createElement("div");
  title.className = "ctitle"; title.textContent = COMBAT_TITLES[cb.kind] || "Combat";
  panel.appendChild(title);
  const hint = document.createElement("div");
  hint.className = "hint"; hint.textContent = COMBAT_HINTS[cb.kind] || "";
  panel.appendChild(hint);

  if (cb.kind === "attackers") buildDeclarePanel(panel, "attacker");
  else if (cb.kind === "blockers") buildDeclarePanel(panel, "block");
  else if (cb.kind === "orderblockers") buildOrderPanel(panel, cb);
  else if (cb.kind === "assigndamage") buildDamagePanel(panel, cb);
}

function buildDeclarePanel(panel, word) {
  const ctrls = document.createElement("div");
  ctrls.className = "ctrls";
  const isAtk = word === "attacker";
  const n = isAtk ? G.atk.size : G.blk.size;
  const go = document.createElement("button");
  go.className = "action";
  go.textContent = n ? ("Confirm " + n + " " + word + (n > 1 ? "s" : ""))
                     : ("Confirm " + word + "s");
  go.onclick = isAtk ? confirmAttackers : confirmBlockers;
  const none = document.createElement("button");
  none.className = "pass";
  none.textContent = isAtk ? "No attacks" : "No blocks";
  none.onclick = isAtk
    ? () => { G.atk.clear(); confirmAttackers(); }
    : () => { G.blk.clear(); G.pendingBlocker = null; confirmBlockers(); };
  ctrls.append(go, none);
  panel.appendChild(ctrls);
}

function buildOrderPanel(panel, cb) {
  for (const g of cb.orderings) {
    if (!G.order.has(g.attacker)) G.order.set(g.attacker, g.blockers.slice());
  }
  for (const g of cb.orderings) {
    const ord = G.order.get(g.attacker);
    const sec = document.createElement("div"); sec.className = "csec";
    const h = document.createElement("div"); h.className = "csec-h";
    h.textContent = cardLabel(g.attacker) + " blocked by " + ord.length + ":";
    sec.appendChild(h);
    ord.forEach((bid, i) => {
      const row = document.createElement("div"); row.className = "ord-row";
      const num = document.createElement("span"); num.className = "ord-num"; num.textContent = (i + 1) + ".";
      const nm = document.createElement("span"); nm.className = "ord-nm"; nm.textContent = cardLabel(bid);
      const up = document.createElement("button"); up.textContent = "▲"; up.disabled = i === 0;
      up.onclick = () => moveOrder(g.attacker, i, -1);
      const dn = document.createElement("button"); dn.textContent = "▼"; dn.disabled = i === ord.length - 1;
      dn.onclick = () => moveOrder(g.attacker, i, 1);
      row.append(num, nm, up, dn);
      sec.appendChild(row);
    });
    panel.appendChild(sec);
  }
  const ctrls = document.createElement("div"); ctrls.className = "ctrls";
  const go = document.createElement("button"); go.className = "action"; go.textContent = "Confirm order";
  go.onclick = confirmOrder;
  ctrls.appendChild(go);
  panel.appendChild(ctrls);
}

function moveOrder(atk, i, d) {
  const ord = G.order.get(atk);
  const j = i + d;
  if (j < 0 || j >= ord.length) return;
  [ord[i], ord[j]] = [ord[j], ord[i]];
  renderAll();
}

async function confirmOrder() {
  const orderings = [];
  for (const [atk, ord] of G.order) orderings.push([atk, ord]);
  logLine("you", "Order blockers");
  await postCombat({ kind: "order", orderings });
}

// lethal-first auto-assignment: each target gets its lethal (toughness) in order,
// capped by remaining power; non-tramplers dump any remainder on the last target.
function autoLethal(g) {
  const m = new Map();
  let rem = g.power;
  for (const tid of g.targets) {
    const give = Math.min(rem, Math.max(1, cardToughness(tid)));
    m.set(tid, give); rem -= give;
  }
  if (!g.trample && rem > 0 && g.targets.length) {
    const last = g.targets[g.targets.length - 1];
    m.set(last, (m.get(last) || 0) + rem);
  }
  return m;
}

function setDmg(atk, tid, val, power) {
  const m = G.damage.get(atk);
  m.set(tid, Math.max(0, Math.min(val, power)));
  renderAll();
}

function buildDamagePanel(panel, cb) {
  for (const g of cb.damage) {
    if (!G.damage.has(g.attacker)) G.damage.set(g.attacker, autoLethal(g));
  }
  for (const g of cb.damage) {
    const m = G.damage.get(g.attacker);
    const sum = [...m.values()].reduce((a, b) => a + b, 0);
    const sec = document.createElement("div"); sec.className = "csec";
    const h = document.createElement("div"); h.className = "csec-h";
    h.textContent = cardLabel(g.attacker) + " — assign " + g.power + " damage:";
    sec.appendChild(h);
    for (const tid of g.targets) {
      const row = document.createElement("div"); row.className = "dmg-row";
      const nm = document.createElement("span"); nm.className = "dmg-nm"; nm.textContent = cardLabel(tid);
      const minus = document.createElement("button"); minus.textContent = "−";
      minus.onclick = () => setDmg(g.attacker, tid, (m.get(tid) || 0) - 1, g.power);
      const amt = document.createElement("span"); amt.className = "dmg-amt"; amt.textContent = m.get(tid) || 0;
      const plus = document.createElement("button"); plus.textContent = "+";
      plus.onclick = () => setDmg(g.attacker, tid, (m.get(tid) || 0) + 1, g.power);
      row.append(nm, minus, amt, plus);
      sec.appendChild(row);
    }
    const status = document.createElement("div"); status.className = "dmg-status";
    let txt = "assigned " + sum + " / " + g.power;
    if (sum > g.power) txt += " — too much!";
    else if (g.trample && sum < g.power) txt += " · " + (g.power - sum) + " tramples over";
    else if (sum < g.power) txt += " — assign all " + g.power;
    status.textContent = txt;
    status.classList.toggle("bad", sum > g.power || (!g.trample && sum !== g.power));
    sec.appendChild(status);
    panel.appendChild(sec);
  }
  const ctrls = document.createElement("div"); ctrls.className = "ctrls";
  const auto = document.createElement("button"); auto.className = "pass"; auto.textContent = "Auto (lethal-first)";
  auto.onclick = () => { for (const g of cb.damage) G.damage.set(g.attacker, autoLethal(g)); renderAll(); };
  const go = document.createElement("button"); go.className = "action"; go.textContent = "Confirm damage";
  go.onclick = confirmDamage;
  ctrls.append(auto, go);
  panel.appendChild(ctrls);
}

async function confirmDamage() {
  const cb = G.resp.combat;
  const distributions = cb.damage.map(g => {
    const m = G.damage.get(g.attacker);
    // engine distributions list only blockers that took damage, in order
    const distribution = g.targets
      .map(tid => [tid, m.get(tid) || 0])
      .filter(([, amt]) => amt > 0);
    return { attacker: g.attacker, distribution };
  });
  logLine("you", "Assign combat damage");
  await postCombat({ kind: "damage", distributions });
}

function renderLog() {
  const log = document.getElementById("log");
  log.innerHTML = "";
  const lines = G.log.slice(-40);
  for (const l of lines) {
    const d = document.createElement("div");
    d.className = "ln " + l.cls;
    d.textContent = l.text;
    log.appendChild(d);
  }
  log.scrollTop = log.scrollHeight;
}

function logLine(cls, text) {
  G.log.push({ cls, text });
  renderLog();
}

function renderAll() {
  const resp = G.resp;
  if (!resp) return;
  const view = resp.view;
  const me = view.perspective;
  const you = view.players.find(p => p.id === me);
  const opp = view.players.find(p => p.id !== me);

  // refresh the id->card lookup for combat display
  G.cardById = new Map();
  for (const p of view.players) for (const c of p.battlefield) G.cardById.set(c.id, c);

  document.getElementById("phase").innerHTML =
    "Turn " + view.turn + " — <b>" + prettyPhase(view) + "</b>" +
    " · active P" + view.active_player;

  const banner = document.getElementById("banner");
  if (view.game_over) {
    banner.style.display = "block";
    const won = view.game_over.indexOf("P" + me) >= 0;
    banner.textContent = (view.game_over.startsWith("Win") && won ? "You win! — " : "Game over — ") + view.game_over;
  } else {
    banner.style.display = "none";
  }

  const cm = combatMaps();
  renderPlayer(document.getElementById("opponent"), opp, false, cm);
  renderPlayer(document.getElementById("you"), you, true, cm);
  renderCards(document.getElementById("stack"), view.stack, "(stack empty)");
  renderCombatPanel();
  renderActions(view);
  setBusy(G.busy);
}

function setBusy(busy) {
  G.busy = busy;
  for (const b of document.querySelectorAll("#actions button, #combat button")) b.disabled = busy;
}

// ----- networking ----------------------------------------------------------
// Adopt a fresh response: reset combat selections if the decision changed,
// append the opponent's actions to the log (only on real advances).
function adopt(resp, isAdvance) {
  const newToken = combatTokenOf(resp.combat);
  if (newToken !== G.combatToken) {
    G.combatToken = newToken;
    G.atk.clear(); G.blk.clear(); G.pendingBlocker = null;
    G.order.clear(); G.damage.clear();
  }
  if (isAdvance && resp.recent && resp.recent.length) {
    for (const r of resp.recent) logLine("opp", "Opponent: " + r.description);
  }
  G.resp = resp;
  renderAll();
}

async function getState() {
  const r = await fetch("/state");
  adopt(await r.json(), false);
}

async function sendAction(index, label) {
  if (G.busy) return;
  setBusy(true);
  if (label && label !== "Pass") logLine("you", "You: " + label);
  try {
    const r = await fetch("/action", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ index }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({ error: r.statusText }));
      logLine("sys", "✗ " + (e.error || r.status));
      await getState();
      return;
    }
    adopt(await r.json(), true);
  } catch (e) {
    logLine("sys", "request failed: " + e);
  } finally {
    setBusy(false);
  }
}

async function sendAutoTap(id, name) {
  if (G.busy) return;
  setBusy(true);
  logLine("you", "You: play " + (name || "card"));
  try {
    const r = await fetch("/autotap", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ object_id: id }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({ error: r.statusText }));
      logLine("sys", "✗ " + (e.error || r.status));
      await getState();
      return;
    }
    adopt(await r.json(), true);
  } catch (e) {
    logLine("sys", "request failed: " + e);
  } finally {
    setBusy(false);
  }
}

async function postCombat(body) {
  if (G.busy) return;
  setBusy(true);
  try {
    const r = await fetch("/combat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({ error: r.statusText }));
      logLine("sys", "✗ " + (e.error || r.status));
      await getState();
      return;
    }
    adopt(await r.json(), true);
  } catch (e) {
    logLine("sys", "request failed: " + e);
  } finally {
    setBusy(false);
  }
}

async function newGame() {
  setBusy(true);
  try {
    const r = await fetch("/new", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: "{}",
    });
    G.log = [];
    G.combatToken = null;
    logLine("sys", "— new game —");
    adopt(await r.json(), false);
  } finally {
    setBusy(false);
  }
}

document.getElementById("new").onclick = newGame;
document.getElementById("refresh").onclick = getState;
getState();
</script>
