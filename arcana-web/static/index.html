<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arcana — Play</title>
<!-- apply the persisted theme before paint to avoid a flash -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem("arcana.theme")||"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
<link rel="stylesheet" href="/theme.css" />
<style>
  body { padding: 0 var(--page-padding) 3rem; }

  /* ---- top bar ---- */
  .topbar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 12px 0; position: sticky; top: 0; z-index: 20;
    background: var(--bg-nav); border-bottom: 1px solid var(--border); margin-bottom: 14px;
  }
  .topbar .spacer { flex: 1; }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand .mark { font-family: var(--font-serif); font-weight: 600; font-size: 20px; letter-spacing: .01em; }
  .brand .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-faint); }

  .phasebar {
    display: flex; align-items: baseline; gap: 10px;
    padding: 5px 12px; border: 1px solid var(--border); border-radius: var(--radius-panel);
    background: var(--bg-offset); font-size: 13px;
  }
  .phasebar .turn { font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .phasebar .step { font-family: var(--font-serif); font-weight: 600; }
  .phasebar .who { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; }

  /* ---- player panels ---- */
  .player {
    border: 1px solid var(--border); border-radius: var(--radius-panel);
    padding: 12px 14px; margin-bottom: 12px; background: var(--bg-offset);
  }
  .player.you { border-color: var(--border-muted); }
  .ptitle { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  .ptitle .who { font-family: var(--font-sans); font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  .ptitle .life { font-family: var(--font-serif); font-weight: 600; font-size: 26px;
    font-variant-numeric: tabular-nums; line-height: 1; }
  .ptitle .life .unit { font-size: 12px; color: var(--text-faint); font-weight: 400; margin-left: 3px; }
  .ptitle .gauge { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); }
  .ptitle .gauge .floating { color: var(--text-faint); }
  .ptitle .counts { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; }
  .ptitle .spacer { flex: 1; }

  .zone { margin-top: 8px; }
  .zone-head { margin: 8px 0 5px; }
  .cards { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; min-height: 6px; }
  .battlefield { --card-w: 104px; }
  .hand { --card-w: 124px; }
  .stack { --card-w: 96px; }
  .ptitle .gauge .gpip { display: inline-flex; align-items: center; gap: 1px;
    font-variant-numeric: tabular-nums; }

  .lands-creatures { display: grid; gap: 10px; }
  .empty { color: var(--text-faint); font-size: 12px; font-style: italic; font-family: var(--font-serif); padding: 4px 0; }

  /* ---- middle row: stack + log ---- */
  .midrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; align-items: start; }
  @media (max-width: 720px) { .midrow { grid-template-columns: 1fr; } }
  .stackzone, .logzone {
    border: 1px solid var(--border); border-radius: var(--radius-panel);
    padding: 10px 12px; background: var(--bg-offset);
  }
  #log { font-size: 12px; max-height: 150px; overflow-y: auto; }
  #log .ln { line-height: 1.45; padding: 1px 0; }
  #log .you { color: var(--text); }
  #log .opp { color: var(--text-muted); }
  #log .sys { color: var(--text-faint); font-style: italic; }

  /* ---- banner ---- */
  #banner {
    display: none; padding: 12px 14px; border: 1px solid var(--border-muted);
    border-radius: var(--radius-panel); background: var(--bg-offset);
    font-family: var(--font-serif); font-weight: 600; font-size: 16px; margin-bottom: 12px;
  }

  /* ---- combat / bottoming panel ---- */
  #combat { display: none; }
  #combat.show {
    display: block; border: 1px solid var(--border-muted); border-radius: var(--radius-panel);
    background: var(--bg-offset); padding: 12px 14px; margin-bottom: 12px;
  }
  #combat .ctitle { font-family: var(--font-serif); font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  #combat .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; max-width: 70ch; }
  #combat .ctrls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  #combat .csec { border-top: 1px solid var(--border); padding: 8px 0; }
  #combat .csec-h { font-size: 13px; font-weight: 500; margin-bottom: 5px; }
  #combat .ord-row, #combat .dmg-row { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
  #combat .ord-num { width: 20px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  #combat .ord-nm, #combat .dmg-nm { flex: 1; }
  #combat .dmg-amt { min-width: 22px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  #combat .stepper { padding: 1px 9px; font-size: 14px; line-height: 1.4; }
  #combat .dmg-status { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  #combat .dmg-status.bad { color: var(--text); font-weight: 500; }

  /* ---- actions ---- */
  #actionzone { margin-top: 4px; }
  .agroup { margin-bottom: 10px; }
  .agroup .gl { margin-bottom: 4px; }
  .agroup .btns, .control-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .control-row { margin-top: 6px; }

  /* busy / disabled interaction */
  body.busy #actions, body.busy #combat, body.busy .player { pointer-events: none; opacity: .7; }

  /* ---- light tap pulse ---- */
  @keyframes ac-pulse { 0% { box-shadow: 0 0 0 0 var(--text-muted); } 100% { box-shadow: 0 0 0 6px transparent; } }
  .ac-card.just-entered .ac-frame { animation: ac-pulse var(--transition-slow) ease-out; }
  @media (prefers-reduced-motion: reduce) { .ac-card.just-entered .ac-frame { animation: none; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">Arcana</span><span class="sub">play</span></div>
    <div class="phasebar" id="phase"></div>
    <div class="spacer"></div>
    <a href="/deck">Deckbuilder →</a>
    <button id="refresh" class="ghost">Refresh</button>
    <button id="new">New game</button>
    <span id="themeslot"></span>
  </header>

  <div id="banner"></div>

  <main class="board">
    <section id="opponent" class="player"></section>

    <div class="midrow">
      <section class="stackzone">
        <div class="meta-label">Stack</div>
        <div id="stack" class="cards stack"></div>
      </section>
      <section class="logzone">
        <div class="meta-label">Game log</div>
        <div id="log"></div>
      </section>
    </div>

    <section id="you" class="player you"></section>
  </main>

  <div id="combat"></div>

  <section id="actionzone">
    <div class="meta-label">Your actions</div>
    <div id="actions"></div>
  </section>

<script src="/app.js"></script>
<script>
"use strict";

// ----- module state --------------------------------------------------------
const G = {
  resp: null,
  log: [],             // running game log lines: {cls, text}
  cardById: new Map(), // id -> CardView (both battlefields), for combat display
  seenBf: new Set(),   // ids already seen on a battlefield (for enter-pulse)
  // combat selection (reset when the prompt identity changes)
  combatToken: null,
  atk: new Map(),      // attackerId -> defending entity object
  blk: new Map(),      // blockerId  -> attackerId
  pendingBlocker: null,
  order: new Map(),    // attackerId -> [blockerId,...] in chosen damage order
  damage: new Map(),   // attackerId -> Map(blockerId -> amount)
  bottomSel: new Set(),// mulligan: hand card ids selected to put on the bottom
  busy: false,
};

// available-mana gauge: color key -> {pip class, symbol}
const MANA = {
  white: { cls: "w", sym: "W" }, blue: { cls: "u", sym: "U" }, black: { cls: "b", sym: "B" },
  red: { cls: "r", sym: "R" }, green: { cls: "g", sym: "G" }, colorless: { cls: "c", sym: "C" },
};

// ----- card tiles (built on the shared component) --------------------------
// decorate hand cards: playable ones are click-to-play (server auto-taps + casts/
// plays, or floats mana and surfaces variants). Dim the rest. During a mulligan
// bottoming, hand clicks instead toggle bottom-selection.
function handDecor(c) {
  if (G.resp && G.resp.bottom != null) {
    const sel = G.bottomSel.has(c.id);
    return {
      classes: sel ? ["selected"] : ["selectable"],
      badge: sel ? "↓ bottom" : "keep",
      onClick: () => { if (sel) G.bottomSel.delete(c.id); else G.bottomSel.add(c.id); renderAll(); },
    };
  }
  if (c.playable) return { classes: ["selectable"], onClick: () => sendAutoTap(c.id, c.name) };
  return { classes: ["dim"] };
}

// available colored mana + floating + untapped-land tally, as a small gauge.
function manaGaugeHtml(p) {
  const a = p.available_mana || { total: 0 };
  let pips = "";
  for (const k of ["white", "blue", "black", "red", "green", "colorless"]) {
    if (a[k]) pips += '<span class="gpip">' + a[k] + Arcana.manaSymbolHtml(MANA[k].sym) + "</span>";
  }
  let s = a.total ? pips : '<span class="floating">no mana</span>';
  if (p.mana_pool) s += ' <span class="floating">(' + p.mana_pool + " floating)</span>";
  const lands = p.battlefield.filter((c) => c.is_land);
  const untapped = lands.filter((c) => !c.tapped).length;
  if (lands.length) s += ' <span class="floating tnum">· ' + untapped + "/" + lands.length + " lands</span>";
  return s;
}

function renderCards(container, cards, emptyMsg, decorate) {
  container.innerHTML = "";
  if (!cards || cards.length === 0) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = emptyMsg || "(empty)";
    container.appendChild(e);
    return;
  }
  for (const c of cards) {
    const decor = decorate ? decorate(c) : {};
    const el = Arcana.renderCard(c, decor);
    if (decor && decor.pulse) el.classList.add("just-entered");
    container.appendChild(el);
  }
}

// ----- combat helpers ------------------------------------------------------
function combatMaps() {
  const cb = G.resp && G.resp.combat;
  if (!cb) return null;
  const base = { mode: cb.kind, atkOpts: new Map(), blkOpts: new Map(),
                 incoming: new Set(), hiAtk: new Set(), hiBlk: new Set() };
  if (cb.kind === "attackers") {
    for (const o of cb.attackers) base.atkOpts.set(o.id, o.defenders);
  } else if (cb.kind === "blockers") {
    for (const o of cb.blockers) base.blkOpts.set(o.id, o.can_block);
    base.incoming = new Set(cb.incoming);
  } else {
    const groups = cb.kind === "orderblockers" ? cb.orderings : cb.damage;
    for (const g of groups) {
      base.hiAtk.add(g.attacker);
      for (const b of (g.blockers || g.targets)) base.hiBlk.add(b);
    }
  }
  return base;
}

function combatTokenOf(cb) {
  if (!cb) return null;
  let ids;
  if (cb.kind === "attackers") ids = cb.attackers.map((o) => o.id);
  else if (cb.kind === "blockers") ids = cb.blockers.map((o) => o.id);
  else if (cb.kind === "orderblockers") ids = cb.orderings.map((o) => o.attacker);
  else ids = cb.damage.map((o) => o.attacker);
  return cb.kind + ":" + ids.slice().sort((a, b) => a - b).join(",");
}

function describeDefender(d) {
  if (d.Player !== undefined) return "P" + d.Player;
  const id = d.Planeswalker !== undefined ? d.Planeswalker : d.Battle;
  const c = G.cardById.get(id);
  return c ? c.name : ("#" + id);
}

function toggleAttacker(id, defenders) {
  if (defenders.length <= 1) {
    if (G.atk.has(id)) G.atk.delete(id); else G.atk.set(id, defenders[0]);
  } else if (!G.atk.has(id)) {
    G.atk.set(id, defenders[0]);
  } else {
    const cur = JSON.stringify(G.atk.get(id));
    const i = defenders.findIndex((d) => JSON.stringify(d) === cur);
    if (i >= 0 && i < defenders.length - 1) G.atk.set(id, defenders[i + 1]);
    else G.atk.delete(id);
  }
  renderAll();
}

function clickBlocker(id) {
  if (G.blk.has(id)) { G.blk.delete(id); G.pendingBlocker = null; }
  else { G.pendingBlocker = (G.pendingBlocker === id) ? null : id; }
  renderAll();
}

function clickAttacker(attackerId, blkOpts) {
  if (G.pendingBlocker === null) return;
  const can = blkOpts.get(G.pendingBlocker) || [];
  if (!can.includes(attackerId)) return;
  G.blk.set(G.pendingBlocker, attackerId);
  G.pendingBlocker = null;
  renderAll();
}

async function confirmAttackers() {
  const attackers = [];
  for (const [id, defending] of G.atk) attackers.push({ attacker: id, defending });
  logLine("you", attackers.length
    ? "Attack with " + attackers.length + " creature" + (attackers.length > 1 ? "s" : "")
    : "Declare no attackers");
  await postCombat({ kind: "attackers", attackers });
}

async function confirmBlockers() {
  const blockers = [];
  for (const [blocker, blocking] of G.blk) blockers.push({ blocker, blocking });
  logLine("you", blockers.length
    ? "Block with " + blockers.length + " creature" + (blockers.length > 1 ? "s" : "")
    : "Declare no blockers");
  await postCombat({ kind: "blockers", blockers });
}

// ----- rendering -----------------------------------------------------------
function prettyPhase(view) { return (view.phase || "").replace("/", " · "); }

function renderPlayer(container, p, isYou, cm) {
  container.innerHTML = "";

  const title = document.createElement("div");
  title.className = "ptitle";
  title.innerHTML =
    '<span class="who">' + (isYou ? "You" : "Opponent") + " · P" + p.id + "</span>" +
    '<span class="life tnum">' + p.life + '<span class="unit">life</span></span>' +
    '<span class="gauge">' + manaGaugeHtml(p) + "</span>" +
    '<span class="spacer"></span>' +
    '<span class="counts">' +
      '<span>hand <b class="tnum">' + p.hand_count + "</b></span>" +
      '<span>library <b class="tnum">' + p.library_count + "</b></span>" +
      '<span>graveyard <b class="tnum">' + p.graveyard_count + "</b></span>" +
    "</span>";
  container.appendChild(title);

  // battlefield split: lands vs everything else (creatures/spells/PWs).
  const lands = p.battlefield.filter((c) => c.is_land);
  const others = p.battlefield.filter((c) => !c.is_land);
  const grid = document.createElement("div");
  grid.className = "lands-creatures";

  const mkZone = (label, cards, empty) => {
    const z = document.createElement("div");
    z.className = "zone";
    const h = document.createElement("div");
    h.className = "meta-label zone-head"; h.textContent = label;
    z.appendChild(h);
    const row = document.createElement("div");
    row.className = "cards battlefield";
    renderCards(row, cards, empty, (c) => combatDecor(c, isYou, cm));
    z.appendChild(row);
    return z;
  };
  grid.appendChild(mkZone("Creatures & permanents", others, "no permanents"));
  grid.appendChild(mkZone("Lands", lands, "no lands"));
  container.appendChild(grid);

  if (isYou) {
    const hz = document.createElement("div");
    hz.className = "zone";
    const h = document.createElement("div");
    h.className = "meta-label zone-head";
    h.textContent = "Your hand — click a highlighted card to play it (auto-taps mana)";
    hz.appendChild(h);
    const hand = document.createElement("div");
    hand.className = "cards hand";
    renderCards(hand, p.hand, "empty hand", handDecor);
    hz.appendChild(hand);
    container.appendChild(hz);
  }
}

// decorate a battlefield card with combat affordances + the enter-pulse
function combatDecor(c, isYou, cm) {
  const pulse = !G.seenBf.has(c.id);
  const base = pulse ? { pulse: true } : {};
  if (!cm) return base;
  if (cm.mode === "attackers" && isYou && cm.atkOpts.has(c.id)) {
    const attacking = G.atk.has(c.id);
    const defenders = cm.atkOpts.get(c.id);
    return Object.assign(base, {
      classes: attacking ? ["selected"] : ["selectable"],
      badge: attacking ? ("Attacking → " + describeDefender(G.atk.get(c.id))) : "attack",
      onClick: () => toggleAttacker(c.id, defenders),
    });
  }
  if (cm.mode === "blockers") {
    if (isYou && cm.blkOpts.has(c.id)) {
      const assigned = G.blk.has(c.id);
      const pending = G.pendingBlocker === c.id;
      let badge = "block";
      if (assigned) {
        const tgt = G.cardById.get(G.blk.get(c.id));
        badge = "Block → " + (tgt ? tgt.name : "#" + G.blk.get(c.id));
      } else if (pending) { badge = "pick attacker…"; }
      return Object.assign(base, {
        classes: assigned ? ["selected"] : (pending ? ["pending"] : ["selectable"]),
        badge,
        onClick: () => clickBlocker(c.id),
      });
    }
    if (!isYou && cm.incoming.has(c.id)) {
      return Object.assign(base, {
        classes: ["selectable"], badge: "attacking",
        onClick: () => clickAttacker(c.id, cm.blkOpts),
      });
    }
  }
  if (cm.mode === "orderblockers" || cm.mode === "assigndamage") {
    if (cm.hiAtk.has(c.id)) return Object.assign(base, { classes: ["selected"], badge: "attacking" });
    if (cm.hiBlk.has(c.id)) return Object.assign(base, { classes: ["pending"], badge: "blocking" });
  }
  return base;
}

// classify a legal action label into a group for tidier presentation
function groupOf(label) {
  if (label === "Pass" || label === "Pass priority") return "pass";
  if (label === "Concede") return "concede";
  if (label.startsWith("Play ")) return "Lands";
  if (label.startsWith("Cast ")) return "Spells";
  if (label.startsWith("Activate ")) return "Abilities";
  if (/^(Choose|Yes|No|Pay|Decline|Pick|Distribute|Keep|Mulligan|Order|Assign|Select|Put|Scry)/.test(label))
    return "Choices";
  return "Other";
}

function renderActions(view) {
  const root = document.getElementById("actions");
  root.innerHTML = "";
  if (view.game_over) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "No actions — start a new game.";
    root.appendChild(e);
    return;
  }
  if (G.resp.combat || G.resp.bottom != null) return;

  const order = ["Lands", "Spells", "Abilities", "Choices", "Other"];
  const groups = {}; let pass = null, concede = null;
  for (const a of view.legal) {
    const g = groupOf(a.label);
    if (g === "pass") { pass = a; continue; }
    if (g === "concede") { concede = a; continue; }
    (groups[g] = groups[g] || []).push(a);
  }
  for (const g of order) {
    if (!groups[g]) continue;
    const wrap = document.createElement("div");
    wrap.className = "agroup";
    const gl = document.createElement("div");
    gl.className = "gl meta-label"; gl.textContent = g;
    wrap.appendChild(gl);
    const btns = document.createElement("div");
    btns.className = "btns";
    for (const a of groups[g]) {
      const btn = document.createElement("button");
      btn.textContent = a.label;
      btn.onclick = () => sendAction(a.index, a.label);
      btns.appendChild(btn);
    }
    wrap.appendChild(btns);
    root.appendChild(wrap);
  }
  const ctrl = document.createElement("div");
  ctrl.className = "control-row";
  if (pass) {
    const b = document.createElement("button");
    b.className = "primary"; b.textContent = "Pass / next step";
    b.onclick = () => sendAction(pass.index, "Pass");
    ctrl.appendChild(b);
  }
  if (concede) {
    const b = document.createElement("button");
    b.className = "ghost"; b.textContent = "Concede";
    b.onclick = () => { if (confirm("Concede this game?")) sendAction(concede.index, "Concede"); };
    ctrl.appendChild(b);
  }
  if (pass || concede) root.appendChild(ctrl);
}

function cardLabel(id) {
  const c = G.cardById.get(id);
  if (!c) return "#" + id;
  const pt = (c.power !== null && c.power !== undefined) ? " " + c.power + "/" + c.toughness : "";
  return c.name + pt;
}
function cardToughness(id) {
  const c = G.cardById.get(id);
  return (c && c.toughness !== null && c.toughness !== undefined) ? c.toughness : 1;
}

const COMBAT_HINTS = {
  attackers: "Click your creatures to attack; if a planeswalker/battle is in play, click again to cycle which one they attack. Then confirm.",
  blockers: "Click a creature to block with, then click the attacker it should block. Click again to clear.",
  orderblockers: "Each attacker is blocked by several creatures — set the order damage is assigned in (first takes lethal first).",
  assigndamage: "Distribute each attacker's combat damage. 'Auto' assigns lethal-first; for tramplers the unassigned remainder hits the opponent.",
};
const COMBAT_TITLES = {
  attackers: "Declare attackers", blockers: "Declare blockers",
  orderblockers: "Order blockers", assigndamage: "Assign combat damage",
};

function renderCombatPanel() {
  const panel = document.getElementById("combat");
  const cb = G.resp.combat;
  if (!cb) { panel.className = ""; panel.innerHTML = ""; return; }
  panel.className = "show";
  panel.innerHTML = "";

  const title = document.createElement("div");
  title.className = "ctitle"; title.textContent = COMBAT_TITLES[cb.kind] || "Combat";
  panel.appendChild(title);
  const hint = document.createElement("div");
  hint.className = "hint"; hint.textContent = COMBAT_HINTS[cb.kind] || "";
  panel.appendChild(hint);

  if (cb.kind === "attackers") buildDeclarePanel(panel, "attacker");
  else if (cb.kind === "blockers") buildDeclarePanel(panel, "block");
  else if (cb.kind === "orderblockers") buildOrderPanel(panel, cb);
  else if (cb.kind === "assigndamage") buildDamagePanel(panel, cb);
}

function buildDeclarePanel(panel, word) {
  const ctrls = document.createElement("div");
  ctrls.className = "ctrls";
  const isAtk = word === "attacker";
  const n = isAtk ? G.atk.size : G.blk.size;
  const go = document.createElement("button");
  go.className = "primary";
  go.textContent = n ? ("Confirm " + n + " " + word + (n > 1 ? "s" : "")) : ("Confirm " + word + "s");
  go.onclick = isAtk ? confirmAttackers : confirmBlockers;
  const none = document.createElement("button");
  none.textContent = isAtk ? "No attacks" : "No blocks";
  none.onclick = isAtk
    ? () => { G.atk.clear(); confirmAttackers(); }
    : () => { G.blk.clear(); G.pendingBlocker = null; confirmBlockers(); };
  ctrls.append(go, none);
  panel.appendChild(ctrls);
}

function buildOrderPanel(panel, cb) {
  for (const g of cb.orderings) {
    if (!G.order.has(g.attacker)) G.order.set(g.attacker, g.blockers.slice());
  }
  for (const g of cb.orderings) {
    const ord = G.order.get(g.attacker);
    const sec = document.createElement("div"); sec.className = "csec";
    const h = document.createElement("div"); h.className = "csec-h";
    h.textContent = cardLabel(g.attacker) + " blocked by " + ord.length + ":";
    sec.appendChild(h);
    ord.forEach((bid, i) => {
      const row = document.createElement("div"); row.className = "ord-row";
      const num = document.createElement("span"); num.className = "ord-num"; num.textContent = (i + 1) + ".";
      const nm = document.createElement("span"); nm.className = "ord-nm"; nm.textContent = cardLabel(bid);
      const up = document.createElement("button"); up.className = "stepper"; up.textContent = "▲"; up.disabled = i === 0;
      up.onclick = () => moveOrder(g.attacker, i, -1);
      const dn = document.createElement("button"); dn.className = "stepper"; dn.textContent = "▼"; dn.disabled = i === ord.length - 1;
      dn.onclick = () => moveOrder(g.attacker, i, 1);
      row.append(num, nm, up, dn);
      sec.appendChild(row);
    });
    panel.appendChild(sec);
  }
  const ctrls = document.createElement("div"); ctrls.className = "ctrls";
  const go = document.createElement("button"); go.className = "primary"; go.textContent = "Confirm order";
  go.onclick = confirmOrder;
  ctrls.appendChild(go);
  panel.appendChild(ctrls);
}

function moveOrder(atk, i, d) {
  const ord = G.order.get(atk);
  const j = i + d;
  if (j < 0 || j >= ord.length) return;
  [ord[i], ord[j]] = [ord[j], ord[i]];
  renderAll();
}

async function confirmOrder() {
  const orderings = [];
  for (const [atk, ord] of G.order) orderings.push([atk, ord]);
  logLine("you", "Order blockers");
  await postCombat({ kind: "order", orderings });
}

// lethal-first auto-assignment
function autoLethal(g) {
  const m = new Map();
  let rem = g.power;
  for (const tid of g.targets) {
    const give = Math.min(rem, Math.max(1, cardToughness(tid)));
    m.set(tid, give); rem -= give;
  }
  if (!g.trample && rem > 0 && g.targets.length) {
    const last = g.targets[g.targets.length - 1];
    m.set(last, (m.get(last) || 0) + rem);
  }
  return m;
}

function setDmg(atk, tid, val, power) {
  const m = G.damage.get(atk);
  m.set(tid, Math.max(0, Math.min(val, power)));
  renderAll();
}

function buildDamagePanel(panel, cb) {
  for (const g of cb.damage) {
    if (!G.damage.has(g.attacker)) G.damage.set(g.attacker, autoLethal(g));
  }
  let allValid = true;
  for (const g of cb.damage) {
    const m = G.damage.get(g.attacker);
    const order = g.targets;
    const amtOf = (i) => (m.get(order[i]) || 0);
    const lethalOf = (i) => Math.max(1, cardToughness(order[i]));
    const sum = order.reduce((s, t) => s + (m.get(t) || 0), 0);
    const earlierAllLethal = (i) => order.slice(0, i).every((t, j) => (m.get(t) || 0) >= lethalOf(j));
    const laterAnyNonzero = (i) => order.slice(i + 1).some((t) => (m.get(t) || 0) > 0);

    const sec = document.createElement("div"); sec.className = "csec";
    const h = document.createElement("div"); h.className = "csec-h";
    h.textContent = cardLabel(g.attacker) + " — assign " + g.power + " damage:";
    sec.appendChild(h);
    order.forEach((tid, i) => {
      const row = document.createElement("div"); row.className = "dmg-row";
      const nm = document.createElement("span"); nm.className = "dmg-nm"; nm.textContent = cardLabel(tid);
      const minus = document.createElement("button"); minus.className = "stepper"; minus.textContent = "−";
      minus.disabled = !(amtOf(i) > 0 && (!laterAnyNonzero(i) || amtOf(i) - 1 >= lethalOf(i)));
      minus.onclick = () => setDmg(g.attacker, tid, amtOf(i) - 1, g.power);
      const amt = document.createElement("span"); amt.className = "dmg-amt"; amt.textContent = amtOf(i);
      const plus = document.createElement("button"); plus.className = "stepper"; plus.textContent = "+";
      plus.disabled = !(sum < g.power && earlierAllLethal(i));
      plus.onclick = () => setDmg(g.attacker, tid, amtOf(i) + 1, g.power);
      row.append(nm, minus, amt, plus);
      sec.appendChild(row);
    });
    const allLethal = order.every((t, i) => (m.get(t) || 0) >= lethalOf(i));
    const validG = sum === g.power || (g.trample && sum < g.power && allLethal);
    allValid = allValid && validG;

    const status = document.createElement("div"); status.className = "dmg-status";
    let txt = "assigned " + sum + " / " + g.power;
    if (sum > g.power) txt += " — too much!";
    else if (g.trample && sum < g.power) txt += allLethal
      ? " · " + (g.power - sum) + " tramples over"
      : " — assign lethal to each before trampling";
    else if (sum < g.power) txt += " — assign all " + g.power;
    status.textContent = txt;
    status.classList.toggle("bad", !validG);
    sec.appendChild(status);
    panel.appendChild(sec);
  }
  const ctrls = document.createElement("div"); ctrls.className = "ctrls";
  const auto = document.createElement("button"); auto.textContent = "Auto (lethal-first)";
  auto.onclick = () => { for (const g of cb.damage) G.damage.set(g.attacker, autoLethal(g)); renderAll(); };
  const go = document.createElement("button"); go.className = "primary"; go.textContent = "Confirm damage";
  go.disabled = !allValid;
  go.onclick = confirmDamage;
  ctrls.append(auto, go);
  panel.appendChild(ctrls);
}

async function confirmDamage() {
  const cb = G.resp.combat;
  const distributions = cb.damage.map((g) => {
    const m = G.damage.get(g.attacker);
    const distribution = g.targets
      .map((tid) => [tid, m.get(tid) || 0])
      .filter(([, amt]) => amt > 0);
    return { attacker: g.attacker, distribution };
  });
  logLine("you", "Assign combat damage");
  await postCombat({ kind: "damage", distributions });
}

function renderBottomPanel() {
  const panel = document.getElementById("combat");
  const n = G.resp.bottom;
  panel.className = "show"; panel.innerHTML = "";
  const title = document.createElement("div");
  title.className = "ctitle";
  title.textContent = "Mulligan — put " + n + " card" + (n > 1 ? "s" : "") + " on the bottom";
  panel.appendChild(title);
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "Click " + n + " card" + (n > 1 ? "s" : "") +
    " in your hand to bottom; the rest is your opening hand.";
  panel.appendChild(hint);
  const ctrls = document.createElement("div"); ctrls.className = "ctrls";
  const sel = G.bottomSel.size;
  const go = document.createElement("button"); go.className = "primary";
  go.textContent = "Confirm (" + sel + "/" + n + ")";
  go.disabled = sel !== n;
  go.onclick = confirmBottom;
  ctrls.appendChild(go);
  panel.appendChild(ctrls);
}

async function confirmBottom() {
  const n = G.resp.bottom;
  if (G.bottomSel.size !== n) return;
  const ids = [...G.bottomSel];
  logLine("you", "Bottom " + ids.length + " card" + (ids.length > 1 ? "s" : ""));
  setBusy(true);
  try {
    G.bottomSel.clear();
    adopt(await Arcana.Api.bottom(ids), true);
  } catch (e) {
    if (e.isApi) { logLine("sys", "✗ " + e.message); await getState(); }
    else logLine("sys", "request failed: " + e);
  } finally {
    setBusy(false);
  }
}

function renderLog() {
  const log = document.getElementById("log");
  log.innerHTML = "";
  for (const l of G.log.slice(-40)) {
    const d = document.createElement("div");
    d.className = "ln " + l.cls;
    d.textContent = l.text;
    log.appendChild(d);
  }
  log.scrollTop = log.scrollHeight;
}

function logLine(cls, text) { G.log.push({ cls, text }); renderLog(); }

function renderAll() {
  const resp = G.resp;
  if (!resp) return;
  const view = resp.view;
  const me = view.perspective;
  const you = view.players.find((p) => p.id === me);
  const opp = view.players.find((p) => p.id !== me);

  // refresh the id->card lookup for combat display
  G.cardById = new Map();
  for (const p of view.players) for (const c of p.battlefield) G.cardById.set(c.id, c);

  document.getElementById("phase").innerHTML =
    '<span class="turn tnum">Turn ' + view.turn + "</span>" +
    '<span class="step">' + prettyPhase(view) + "</span>" +
    '<span class="who">active P' + view.active_player + "</span>";

  const banner = document.getElementById("banner");
  if (view.game_over) {
    banner.style.display = "block";
    const won = view.game_over.indexOf("P" + me) >= 0;
    banner.textContent = (view.game_over.startsWith("Win") && won ? "You win — " : "Game over — ") + view.game_over;
  } else {
    banner.style.display = "none";
  }

  const cm = combatMaps();
  renderPlayer(document.getElementById("opponent"), opp, false, cm);
  renderPlayer(document.getElementById("you"), you, true, cm);
  renderCards(document.getElementById("stack"), view.stack, "(stack empty)");
  if (resp.bottom != null) renderBottomPanel(); else renderCombatPanel();
  renderActions(view);

  // remember which battlefield ids we've now shown (so new ones pulse next time)
  G.seenBf = new Set();
  for (const p of view.players) for (const c of p.battlefield) G.seenBf.add(c.id);

  setBusy(G.busy);
}

function setBusy(busy) {
  G.busy = busy;
  document.body.classList.toggle("busy", busy);
}

// ----- networking (through Arcana.Api) -------------------------------------
function adopt(resp, isAdvance) {
  const newToken = combatTokenOf(resp.combat);
  if (newToken !== G.combatToken) {
    G.combatToken = newToken;
    G.atk.clear(); G.blk.clear(); G.pendingBlocker = null;
    G.order.clear(); G.damage.clear();
  }
  if (resp.bottom == null) G.bottomSel.clear();
  if (isAdvance && resp.recent && resp.recent.length) {
    for (const r of resp.recent) logLine("opp", "Opponent: " + r.description);
  }
  G.resp = resp;
  renderAll();
}

async function getState() {
  try { adopt(await Arcana.Api.state(), false); }
  catch (e) { logLine("sys", "request failed: " + e); }
}

// generic guarded request: run `fn`, adopt the result, surface errors gracefully
async function guarded(fn) {
  if (G.busy) return;
  setBusy(true);
  try {
    adopt(await fn(), true);
  } catch (e) {
    if (e.isApi) { logLine("sys", "✗ " + e.message); await getState(); }
    else logLine("sys", "request failed: " + e);
  } finally {
    setBusy(false);
  }
}

async function sendAction(index, label) {
  if (label && label !== "Pass") logLine("you", "You: " + label);
  await guarded(() => Arcana.Api.action(index));
}

async function sendAutoTap(id, name) {
  logLine("you", "You: play " + (name || "card"));
  await guarded(() => Arcana.Api.autotap(id));
}

async function postCombat(body) { await guarded(() => Arcana.Api.combat(body)); }

async function newGame() {
  setBusy(true);
  try {
    const resp = await Arcana.Api.newGame({});
    G.log = []; G.combatToken = null; G.seenBf = new Set();
    logLine("sys", "— new game —");
    adopt(resp, false);
  } catch (e) {
    logLine("sys", "could not start a new game: " + e);
  } finally {
    setBusy(false);
  }
}

// ----- wire ----------------------------------------------------------------
Arcana.mountThemeSwitcher(document.getElementById("themeslot"));
document.getElementById("new").onclick = newGame;
document.getElementById("refresh").onclick = getState;
Arcana.loadGlossary();
getState();
</script>
