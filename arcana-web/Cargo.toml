[package]
name = "arcana-web"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Axum web/server GUI for human play against a bot — MVP web frontend."

# Split into a lib (testable game-driving core) + a thin binary (HTTP wiring) so
# the server logic can be exercised by `cargo test` without standing up a socket.
[lib]
name = "arcana_web"
path = "src/lib.rs"

[[bin]]
name = "arcana-web"
path = "src/main.rs"

[dependencies]
arcana-core = { path = "../arcana-core" }
arcana-cards = { path = "../arcana-cards" }
arcana-ai = { path = "../arcana-ai" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "time"] }
# Card-art proxy: fetch from Scryfall (throttled) and cache to disk so we don't
# hammer their rate-limited API. rustls to avoid a system TLS dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Scryfall serves its bulk card data as a gzipped JSONL file (not a
# Content-Encoding), so the art map decompresses it. Already in the workspace
# lockfile through arcana-gen's ureq.
flate2 = "1"
# Seat tokens need OS entropy (W-4) — the splitmix stream stays for public
# codes/seeds only. Already in the tree via rand.
getrandom = "0.2"

[dev-dependencies]
# The HTTP-layer tests in src/main.rs drive the router with
# `tower::ServiceExt::oneshot` and read bodies with `BodyExt::collect`; both
# crates are already in the tree through axum.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
