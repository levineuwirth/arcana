[package]
name = "arcana-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
im = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Off by default. Records structural writes to the object arena and the
# last-known-information maps on states that enable it (the payment grouping probe).
diag = []

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = { workspace = true }
# Card catalog used by integration tests only — arcana-core itself
# stays card-agnostic.
arcana-cards = { path = "../arcana-cards" }

[[bench]]
name = "simulation"
harness = false
